            <td class="num">${z? pf(z.detection):'—'}</td>
            <td class="num">${a? pf(a.detection):'—'}</td>
            <td class="num">${cmpDelta(a&&a.detection, z&&z.detection, {unit:' pts'})}</td>
            <td class="num">${z? pf(z.score):'—'}</td>
            <td class="num">${a? pf(a.score):'—'}</td>
          </tr>`;}).join('')}</tbody>
      </table></div>
      <div class="insight-box"><div class="ib-title">Careful with this one</div>
        <div class="ib-row"><span class="ib-dot"></span><span>
          A detection rate that moved does not by itself mean an auditor changed. They may have audited different people, or the work genuinely improved. Read it against the associate table above rather than alone.
        </span></div>
      </div></div>

    <div class="section-title">Commentary</div>
    <div id="cmpCommentaryHost">${commentarySummaryHTML()}</div>

    <div class="section-title">What Changed</div>
    <div class="card"><h3>Read of the Two Periods</h3>
      <div class="insight-box"><div class="ib-title">Movement</div>
        ${declined.length? `<div class="ib-row"><span class="ib-dot"></span><span>
          <b>${declined.length}</b> associate(s) fell by a point or more${declined[0]?`, most of all <b>${esc(declined[0].name)}</b> (${declined[0].dScore} pts)`:''}.
          ${improved.length?`<b>${improved.length}</b> improved by a point or more.`:''}
        </span></div>`:''}
        ${(()=>{
          // the same people struggling twice is a different problem from new names appearing
          const lowNow = people.filter(p=>p.now&&p.now.score!==null&&p.now.score<OUTLIER_THRESHOLD);
          const lowBoth= lowNow.filter(p=>p.was&&p.was.score!==null&&p.was.score<OUTLIER_THRESHOLD);
          const lowNew = lowNow.filter(p=>!p.was || p.was.score===null || p.was.score>=OUTLIER_THRESHOLD);
          if(!lowNow.length) return `<div class="ib-row"><span class="ib-dot"></span><span>
            Nobody is below the ${OUTLIER_THRESHOLD}% mark this period.</span></div>`;
          return `<div class="ib-row"><span class="ib-dot"></span><span>
            Of the <b>${lowNow.length}</b> below ${OUTLIER_THRESHOLD}% now,
            <b>${lowBoth.length}</b> ${lowBoth.length===1?'was':'were'} also below last period${lowBoth.length?` (${lowBoth.slice(0,4).map(p=>esc(p.name)).join(', ')})`:''} and
            <b>${lowNew.length}</b> ${lowNew.length===1?'is':'are'} new${lowNew.length?` (${lowNew.slice(0,4).map(p=>esc(p.name)).join(', ')})`:''}.
            A persistent name needs a different response from a new one — the first says the earlier plan did not work.
          </span></div>`;})()}
        ${newCats.length? `<div class="ib-row"><span class="ib-dot"></span><span>
          <b>${newCats.length}</b> error categor${newCats.length===1?'y':'ies'} appeared that did not exist last period: ${newCats.slice(0,5).map(c=>`${esc(c.cat)} (${c.now})`).join(', ')}. New categories usually follow a process or payer change rather than a person.
        </span></div>`:''}
        ${goneCats.length? `<div class="ib-row"><span class="ib-dot"></span><span>
          <b>${goneCats.length}</b> categor${goneCats.length===1?'y':'ies'} disappeared: ${goneCats.slice(0,5).map(c=>esc(c.cat)).join(', ')}. Worth checking whether they were fixed or simply not sampled this period.
        </span></div>`:''}
        ${grew.length? `<div class="ib-row"><span class="ib-dot"></span><span>
          Biggest growth: <b>${esc(grew[0].cat)}</b> up ${grew[0].d} to ${grew[0].now}. If its share also rose, the mix shifted rather than just the volume.
        </span></div>`:''}
        ${joined.length||left.length? `<div class="ib-row"><span class="ib-dot"></span><span>
          Roster moved: <b>${joined.length}</b> name(s) appear only this period${joined.length?` (${joined.slice(0,4).map(p=>esc(p.name)).join(', ')})`:''},
          <b>${left.length}</b> only last period${left.length?` (${left.slice(0,4).map(p=>esc(p.name)).join(', ')})`:''}.
          Totals will move for that reason alone.
        </span></div>`:''}
      </div>
      <div class="insight-box"><div class="ib-title">Before drawing conclusions</div>
        <div class="ib-row"><span class="ib-dot"></span><span>
          The two periods must cover comparable spans. ${n.audits} audits now against ${b.audits===null?'an unknown number':b.audits} before — if that gap is large, every count moves without behaviour changing.
        </span></div>
        ${(n.sampling!==null && b.sampling!==null && Math.abs(n.sampling-b.sampling)>=5)? `<div class="ib-row"><span class="ib-dot"></span><span>
          Sampling moved <b>${Math.abs(+(n.sampling-b.sampling).toFixed(1))} points</b>. A score shift on a materially different sample is weaker evidence than it looks.
        </span></div>`:''}
        <div class="ib-row"><span class="ib-dot"></span><span>
          Only people and categories present in both periods can show a change. Everything else is labelled rather than treated as a rise or a fall from zero.
        </span></div>
      </div></div>
  `;
}

// Effort alongside quality: how the work was done, next to how well it went.
function effortQualityHTML(){
  const det = scopePDetail();
  // a section that silently disappears looks like a bug, so say why instead
  if(!det.length) return `<div class="card needs-data"><h3>Effort vs Quality</h3>
    <div class="card-sub">Not available — no claim-level production rows in this range.</div>
    <div class="nd-body">This pairs how the work was done with how well it went: call share and handle time beside the QA score.
      <div class="nd-cols">Upload a <b>Production Sheet</b> with one row per claim. Include
        <b>Mode of Work</b> and <b>Total Duration</b> to get handle time as well.</div></div></div>`;
  if(!det.some(r=>r.mins>0)) return `<div class="card needs-data"><h3>Effort vs Quality</h3>
    <div class="card-sub">Partly available — ${det.length} claim(s) loaded, but none carry a call duration.</div>
    <div class="nd-body">Call share can be shown without timings, but handle time cannot.
      <div class="nd-cols">Add <b>Mode of Work</b> and <b>Total Duration</b> to the production sheet.</div></div></div>`;
  const qaBy = groupBy(scopeQA(), r=>r.nameKey);
  const g = groupBy(det, r=>r.nameKey);
  const rows=[];
  for(const [nk, rs] of g){
    const c = rs.filter(isCallRow), ct = c.filter(r=>r.mins>0);
    const mins = ct.reduce((s,r)=>s+r.mins,0);
    const qrs = qaBy.get(nk);
    rows.push({name:rs[0].name, tl:teamLeadOf(nk), touches:rs.length,
      calls:c.length, nonCalls:rs.length-c.length,
      callShare: rs.length? pct(c.length, rs.length):null,
      aht: ct.length? +(mins/ct.length).toFixed(1) : null,
      mins,
      score: qrs&&qrs.length? avgScore(qrs) : null,
      errors: qrs? qrs.reduce((s,r)=>s+r.errors.length,0) : 0});
  }
  const timedAll = det.filter(r=>isCallRow(r)&&r.mins>0);
  const teamAht = timedAll.length? +(timedAll.reduce((s,r)=>s+r.mins,0)/timedAll.length).toFixed(1) : 0;
  const teamShare = det.length? pct(det.filter(isCallRow).length, det.length) : 0;
  rows.sort((a,b)=>(b.callShare??-1)-(a.callShare??-1));
  const tile=(n,l,tone)=>`<div class="fb-tile ${tone||''}"><div class="ft-n">${n}</div><div class="ft-l">${esc(l)}</div></div>`;
  return `<div class="card"><h3>Effort vs Quality</h3>
    <div class="card-sub">How the work was done next to how well it went · call share and handle time against the QA score</div>
    <div class="fb-tiles">
      ${tile(fmtPct(teamShare), 'claims worked by call','')}
      ${tile(teamAht+'m', 'team average handle time','')}
      ${tile(fmtPct(100-teamShare), 'worked without a call','')}
      ${tile(fmtPct(avgScore(scopeQA())), 'avg QA score','')}
    </div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Associate</th><th>Team Lead</th><th class="num">Claims</th>
        <th class="num">Calls</th><th class="num">Non-Call</th><th class="num">% by Call</th>
        <th class="num">AHT</th><th class="num">QA Score</th><th class="num">Errors</th><th>Read</th></tr></thead>
      <tbody>${rows.map(x=>{
        const fast = x.aht!==null && x.aht < teamAht*0.75;
        const slow = x.aht!==null && x.aht > teamAht*1.35;
        const low  = x.score!==null && x.score < OUTLIER_THRESHOLD;
        return `<tr class="${fast&&low?'is-outlier':''}">
          <td><b>${esc(x.name)}</b></td>
          <td>${esc(x.tl)||'—'}</td>
          <td class="num">${x.touches}</td>
          <td class="num">${x.calls}</td>
          <td class="num">${x.nonCalls}</td>
          <td class="num">${x.callShare===null?'—':fmtPct(x.callShare)}</td>
          <td class="num">${x.aht===null?'—':x.aht+'m'}</td>
          <td class="num">${x.score===null?'—':`<span class="stamp ${scoreClass(x.score)}">${fmtPct(x.score)}</span>`}</td>
          <td class="num">${x.errors}</td>
          <td>${x.score===null? '<span class="tag clear">No audits</span>'
             : fast&&low ? '<span class="tag outlier">Rushing calls</span>'
             : fast ? '<span class="tag clear">Quick and accurate</span>'
             : slow&&!low ? '<span class="tag major">Thorough, slow</span>'
             : slow ? '<span class="tag outlier">Slow and error-prone</span>'
             : '<span class="tag clear">Balanced</span>'}</td>
        </tr>`;}).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td></td>
        <td class="num">${det.length}</td>
        <td class="num">${det.filter(isCallRow).length}</td>
        <td class="num">${det.filter(r=>!isCallRow(r)).length}</td>
        <td class="num">${fmtPct(teamShare)}</td>
        <td class="num">${teamAht}m<span class="foot-note">weighted</span></td>
        <td class="num">${fmtPct(avgScore(scopeQA()))}</td>
        <td class="num">${scopeQA().reduce((s,r)=>s+r.errors.length,0)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="insight-box"><div class="ib-title">Why this pairing matters</div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        A high <b>% by Call</b> is not automatically worse — some claim mixes need the phone. It becomes a question when
        one biller calls far more than the rest on similar work, since portal resolution is cheaper and faster.
      </span></div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        <b>Rushing calls</b> is the combination to watch: short handle time with a score under ${OUTLIER_THRESHOLD}%.
        The claim closes on the report and reopens in the queue.
      </span></div>
    </div></div>`;
}

        const bulkHTML = bulk.map(b=>{

          </div>`;
        }).join('');
        return `${bulkHTML}

              <th>What to do</th></tr></thead>
            <tbody>${rowsHTML}</tbody></table></div>` : ''}`;
      })()}
      <div class="insight-box"><div class="ib-title">A caution on all of this</div>
        <div class="ib-row"><span class="ib-dot"></span><span>
          Every line above is arithmetic against two thresholds — ${OUTLIER_THRESHOLD}% quality and ${PROD_MIN_ATTAIN}% attainment. It cannot see leave, queue mix, claim complexity or a payer system outage. Treat each as a question to ask, not a conclusion to act on.
        </span></div>
        ${ok.length? `<div class="ib-row"><span class="ib-dot"></span><span>
          <b>${ok.length}</b> associate(s) are meeting both marks: ${ok.slice(0,6).map(x=>esc(x.name)).join(', ')}${ok.length>6?` +${ok.length-6} more`:''}. They are the shadowing pool for the names above.
        </span></div>`:''}
      </div></div>
  `;
}

function qaDashboardHTML(){
  const rows = scopeQA();
  if(!rows.length) return `<div class="empty-state"><h3>No records in this selection</h3>
    <p>Widen the audit date range, or pick a different project / practice.</p></div>`;
  const stats = qaStats(rows);
  const totalAudits = rows.length;
  const auditors = stats.length;
  const withErr = rows.filter(r=>r.errCount>0).length;
  const detection = pct(withErr, totalAudits);
  const allLags = rows.map(r=>daysBetween(r.dateWorked,r.auditDate)).filter(v=>v!==null&&v>=0);
  const avgLag = allLags.length ? +(allLags.reduce((a,b)=>a+b,0)/allLags.length).toFixed(1) : null;
  const auditDays = new Set(rows.map(r=>r.auditDate).filter(Boolean)).size;
  const pidx = prodIndex();
  const teamProd = scopeProd().reduce((s2,p2)=>s2+p2.count,0);
  const teamSampling = teamProd>0 ? pct(totalAudits, teamProd) : null;
  const rep = repeatErrorData(rows);
  const peerDet = detection;
  const peerDed = totalAudits ? rows.reduce((s,r)=>s+r.deduction,0)/totalAudits : 0;

  // consistency: who grades notably softer or harder than peers
  const flags=[];
  stats.forEach(a=>{
    if(a.audits<5) return;
    const dDet = a.detection - peerDet;
    if(dDet <= -25) flags.push({who:a.key, kind:'lenient',
      text:`Finds errors in only ${fmtPct(a.detection)} of audits against a team average of ${fmtPct(peerDet)}. Either their queue is genuinely cleaner, or defects are being missed — sample-check a few of their passed claims.`});
    else if(dDet >= 25) flags.push({who:a.key, kind:'strict',
      text:`Flags errors in ${fmtPct(a.detection)} of audits versus ${fmtPct(peerDet)} for the team. Worth confirming they are applying the same parameter thresholds as everyone else.`});
    if(a.avgLag!==null && a.avgLag>7) flags.push({who:a.key, kind:'lag',
      text:`Audits land ${a.avgLag} days after the work is done on average (longest ${a.maxLag} days). Feedback that late rarely changes behaviour — tighten the turnaround.`});
  });

  const rcaBlock = rcaHTML(rows);

  return `
    <div class="banner ${flags.length?'na':'good'}"><div>

/* ==================== DATA QUALITY ==================== */
// Silent disagreements in the sheet move real scores, so they are reported.
// aging buckets are labelled a: 0-30, b: 31-60 and so on, so they sort by
// their letter rather than alphabetically by the label
const BUCKET_ORDER = ['A','B','C','D','E','F','G','H','I','J','K','L','M'];
function bucketSort(a,b){
  const ai=BUCKET_ORDER.indexOf(String(a).trim().charAt(0).toUpperCase());
  const bi=BUCKET_ORDER.indexOf(String(b).trim().charAt(0).toUpperCase());
  if(ai<0 && bi<0) return String(a).localeCompare(String(b));
  if(ai<0) return 1; if(bi<0) return -1;
  return ai-bi;
}
function money(v){
  if(v===null||v===undefined||!isFinite(v)) return '—';
  return '$' + Math.round(v).toLocaleString('en-US');
}
function valueAgingHTML(rows){
  const withVal = rows.filter(r=>r.bucketAge || r.balance>0 || r.age>0);
  if(!withVal.length) return `<div class="card needs-data"><h3>Claim Value &amp; Aging</h3>
    <div class="card-sub">Not available — this sheet carries no Age, Bucket or Balance columns.</div>
    <div class="nd-body">With them, errors can be weighed by the money behind them: a defect on a $4,000 claim
      at 150 days is not the same as one on a $40 claim at 20 days.
      <div class="nd-cols">Include <b>Age</b>, <b>Bucket</b>, <b>Billed Amount($)</b> and <b>Balance Amount($)</b> on the Audit Data tab.</div>
    </div></div>`;
  const g = groupBy(withVal.filter(r=>r.bucketAge), r=>r.bucketAge);
  const list=[...g.entries()].map(([b,rs])=>{
    const errRows = rs.filter(r=>r.errors.length);
    return {bucket:b, audits:rs.length,
      errors: rs.reduce((s,r)=>s+r.errors.length,0),
      errRows: errRows.length,
      score: avgScore(rs),
      balance: rs.reduce((s,r)=>s+(r.balance||0),0),
      balAtRisk: errRows.reduce((s,r)=>s+(r.balance||0),0),
      billed: rs.reduce((s,r)=>s+(r.billed||0),0),
      avgAge: rs.length? Math.round(rs.reduce((s,r)=>s+(r.age||0),0)/rs.length) : 0};
  }).sort((a,b)=>bucketSort(a.bucket,b.bucket));
  const tBal   = list.reduce((s,x)=>s+x.balance,0);
  const tRisk  = list.reduce((s,x)=>s+x.balAtRisk,0);
  const tAud   = list.reduce((s,x)=>s+x.audits,0);
  const tErr   = list.reduce((s,x)=>s+x.errors,0);
  const worst  = list.slice().sort((a,b)=>b.balAtRisk-a.balAtRisk)[0];
  const tile=(n,l,tone)=>`<div class="fb-tile ${tone||''}"><div class="ft-n">${n}</div><div class="ft-l">${esc(l)}</div></div>`;
  return `<div class="card"><h3>Claim Value &amp; Aging</h3>
    <div class="card-sub">Audited claims by aging bucket, with the balance behind them ·
      <b>value at risk</b> is the balance on claims where an error was found</div>
    <div class="fb-tiles">
      ${tile(money(tBal), 'balance on audited claims','')}
      ${tile(money(tRisk), 'value at risk (claims with an error)', tRisk>0?'bad':'good')}
      ${tile(tBal>0? fmtPct(pct(tRisk,tBal)) : '—', 'share of value at risk', tBal>0&&pct(tRisk,tBal)>=25?'bad':'')}
      ${tile(withVal.length? Math.round(withVal.reduce((s,r)=>s+(r.age||0),0)/withVal.length)+'d' : '—', 'average claim age','')}
    </div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Aging Bucket</th><th class="num">Audits</th><th class="num">Avg Age</th>
        <th class="num">QA Score</th><th class="num">Claims With Error</th><th class="num">Errors</th>
        <th class="num">Balance</th><th class="num">Value at Risk</th><th class="num">% of Balance at Risk</th></tr></thead>
      <tbody>${list.map(x=>`<tr class="${x.balance>0 && pct(x.balAtRisk,x.balance)>=40?'is-outlier':''}">
        <td><b>${esc(x.bucket)}</b></td>
        <td class="num">${x.audits}</td>
        <td class="num">${x.avgAge}d</td>
        <td class="num"><span class="stamp ${scoreClass(x.score)}">${fmtPct(x.score)}</span></td>
        <td class="num">${x.errRows}</td>
        <td class="num">${x.errors}</td>
        <td class="num">${money(x.balance)}</td>
        <td class="num">${x.balAtRisk?`<span style="color:var(--bad);font-weight:700;">${money(x.balAtRisk)}</span>`:money(0)}</td>
        <td class="num">${x.balance>0? fmtPct(pct(x.balAtRisk,x.balance)) : '—'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${tAud}</td>
        <td class="num">${withVal.length? Math.round(withVal.reduce((s,r)=>s+(r.age||0),0)/withVal.length)+'d':'—'}</td>
        <td class="num">${fmtPct(avgScore(withVal))}</td>
        <td class="num">${list.reduce((s,x)=>s+x.errRows,0)}</td>
        <td class="num">${tErr}</td>
        <td class="num">${money(tBal)}</td>
        <td class="num">${money(tRisk)}</td>
        <td class="num">${tBal>0? fmtPct(pct(tRisk,tBal)) : '—'}</td></tr></tfoot>
    </table></div>
    <div class="insight-box"><div class="ib-title">Reading this</div>
      ${worst && worst.balAtRisk>0 ? `<div class="ib-row"><span class="ib-dot"></span><span>
        Most value at risk sits in <b>${esc(worst.bucket)}</b> — ${money(worst.balAtRisk)} of ${money(worst.balance)}.
        Older buckets are harder to collect, so an error there costs more than the same error on a fresh claim.
      </span></div>`:''}
      <div class="ib-row"><span class="ib-dot"></span><span>
        <b>Value at risk</b> is the balance on claims where QA found an error — not money already lost. It is the amount
        whose handling is in question, and the reason a defect on an aged high-balance claim deserves priority over a count.
      </span></div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        Balances come from the audited sample only, so this is a sample of exposure rather than the whole AR.
      </span></div>
    </div></div>`;
}

function dashboardHTML(){
  const rows = scopeQA();
  const prod = scopeProd();
  if(!rows.length) return `<div class="empty-state"><h3>No records in this selection</h3>
    <p>Widen the date range, or pick a different project / practice.</p></div>`;
  const st = statBlock(rows, prod);
  const billers = new Set(rows.map(r=>r.nameKey)).size;
  const outs = allOutliers();
  const banner = outs.length
    ? `<div class="banner bad"><div><div class="b-title">${outs.length} outlier${outs.length!==1?'s':''} — recommend QIP / PIP</div>
        ${numlist(outs.slice(0,8).map(o=>`${esc(o.name)} — ${o.info.currentRun||o.info.maxRun} wks below ${OUTLIER_THRESHOLD}%`))}
        ${outs.length>8?`<div style="font-size:11px;color:var(--text-faint);margin-top:6px;">+ ${outs.length-8} more in the watchlist below</div>`:''}</div></div>`
    : `<div class="banner good"><div><div class="b-title">No outliers</div>
        No associate has fallen below ${OUTLIER_THRESHOLD}% for ${OUTLIER_CONSEC_WEEKS} consecutive weeks in this range.</div></div>`;

  // weekly trend inside the selected range
  const wg = new Map();
  for(const r of rows){
    const w = r.week || '(no week)';
    if(!wg.has(w)) wg.set(w,{key:weekLabel(w), rows:[], t:r.dwT||0});
    const e=wg.get(w); e.rows.push(r); if(r.dwT&&r.dwT<e.t) e.t=r.dwT;
  }
  const weekRows=[...wg.values()].sort((a,b)=>a.t-b.t).map(e=>{
    const pr = prod.filter(p=>weekOfDate(p.dateKey)===e.key);
    return {key:e.key, ...statBlock(e.rows, pr), outlier:avgScore(e.rows)<OUTLIER_THRESHOLD};
  });

  return `
    ${banner}
    <div class="kpi-grid">
      ${(()=>{
        // counted from the data, not the roster, so it follows the filters
        const audited = new Set(rows.map(r=>r.nameKey).filter(Boolean));
        const known = new Set();
        (ROSTER||[]).forEach(r=>{ if(r.nameKey) known.add(r.nameKey); });
        scopeProd().forEach(p2=>{ if(p2.nameKey) known.add(p2.nameKey); });
        const missing = [...known].filter(k=>!audited.has(k));
        return kpi('Associates', audited.size, '',
          missing.length ? `audited · ${missing.length} not audited` : 'audited in this range');
      })()}
      ${kpi('Audits', st.audits, '', `${billers} biller${billers!==1?'s':''} · ${esc(rangeLabel())}`)}
      ${kpi('Avg QA Score', fmtPct(st.score), scoreClass(st.score), `threshold ${OUTLIER_THRESHOLD}%`)}
      ${kpi('Clean Audits', st.clean, 'good', `${pct(st.clean, st.audits)}% error-free`)}
      ${kpi('Outliers', outs.length, outs.length?'bad':'good', `${OUTLIER_CONSEC_WEEKS}+ wks under ${OUTLIER_THRESHOLD}%`)}
    </div>
    <div class="kpi-grid">
      ${kpi('Fatal Errors', st.fatal, st.fatal?'bad':'good', st.errors?`${fmtPct(pct(st.fatal,st.errors))} of errors`:'none found')}
      ${kpi('Major Errors', st.major, st.major?'warn':'good', st.errors?`${fmtPct(pct(st.major,st.errors))} of errors`:'none found')}
      ${kpi('Non-Fatal Errors', st.nonfatal, st.nonfatal?'acc':'good', st.errors?`${fmtPct(pct(st.nonfatal,st.errors))} of errors`:'none found')}
      ${(()=>{
        // Defects are the errors themselves; defectives are the claims carrying
        // them. One claim can hold several defects, so the two never match and
        // reading only the first cannot separate "many bad claims" from
        // "a few very bad ones".
        const defectives = rows.filter(r=>r.errors.length).length;
        const per = defectives ? (st.errors/defectives).toFixed(2) : '0';
        return kpi('Defect Count', st.errors, '',
                 `${per} defect(s) per defective claim`) +
               kpi('Defective Count', defectives, defectives?'bad':'good',
                 `of ${st.audits} audited · ${fmtPct(pct(defectives, st.audits||1))} of claims`);
      })()}
      ${kpi('Score Lost to Errors', fmtPct(100-st.score), (100-st.score)>(100-OUTLIER_THRESHOLD)?'bad':'warn',
        `avg deduction per audit · ${fmtPct(st.score)} retained`)}
    </div>

    <div class="section-title">Thresholds</div>
    ${settingsCardHTML()}

    ${SAMPLING_IN_AGENT ? `<div class="section-title">Sampling Coverage</div>
    ${samplingComplianceHTML(rows)}` : ''}

    <div class="section-title">Project &amp; Practice Quality</div>
    ${scoreCardsHTML(rows)}
    ${projectPracticeTableHTML(rows)}

    <div class="section-title">Biller-wise Quality</div>
    ${billerTableHTML()}

    <div class="section-title">Outlier Watchlist</div>
    ${watchlistHTML()}

    <div class="section-title">Rework &amp; Correction</div>
    ${reworkAgentHTML(rows)}

    <div class="section-title">Claim Value &amp; Aging</div>
    ${valueAgingHTML(rows)}

    <div class="section-title">Pareto Analysis</div>
    ${paretoHTML(rows)}

    <div class="section-title">Error Type Breakdown</div>
    ${errorTypeBarsHTML(rows)}

    <div class="section-title">Weekly Summary</div>
    ${breakdownTable('Weekly Summary', `Weeks inside ${rangeLabel()}`, weekRows, 'Week')}

    <div class="section-title">By Payer</div>
    ${payerHTML(rows)}


    <div class="section-title">Recommended Actions</div>
    ${recommendedActionsHTML(rows)}
  `;
}

    document.querySelectorAll('.cat-btn').forEach(b=>{
      if(!ALLOWED_REPORTS.includes(b.dataset.cat)) b.remove();

      CATEGORY = ALLOWED_REPORTS[0];
      const f=document.querySelector('.cat-btn');
      if(f) f.classList.add('active');

    render();
  }
  updateBadges();
