function touchCountHTML(){
  const det = scopePDetail();
  if(!det.length) return '';
  noteForensics(det);
  const byClaim = new Map();
  let untracked = 0;
  det.forEach(r=>{
    const id = (r._claimNos && r._claimNos[0]) || '';
    if(!id){ untracked++; return; }
    if(!byClaim.has(id)) byClaim.set(id, []);
    byClaim.get(id).push(r);
  });
  const tracked = det.length - untracked;
  if(!byClaim.size) return `<div class="card needs-data"><h3>Touch Count</h3>
    <div class="card-sub">Not available — no claim number on any row.</div>
    <div class="nd-body">A claim worked twice costs twice. Counting touches needs an identifier to match on.
      <div class="nd-cols">Fill the <b>Claim ID</b> column, or make sure the claim number appears in the note as
        <span class="mono">claim#…</span>.</div></div></div>`;

  // Three outcomes, not two. A claim the same biller came back to is follow-up;
  // the same claim worked by two people is duplicated effort. Only the second
  // is unambiguously waste.
  const moved=[], own=[], dup=[];
  byClaim.forEach((v,id)=>{
    if(v.length<2) return;
    const seq=[...v].sort((x,y)=>String(x.dateKey||'').localeCompare(String(y.dateKey||'')));
    const acts=seq.map(r=>claimAction(r));
    const dates=[...new Set(seq.map(r=>r.dateKey).filter(Boolean))].sort();
    const billers=[...new Set(seq.map(r=>r.name))];
    const rec={id, n:v.length, waste:v.length-1, seq, billers,
      action:acts[0], reason:claimReason(seq[0]), dates,
      span: dates.length>1 ? Math.round((new Date(dates[dates.length-1])-new Date(dates[0]))/86400000) : 0};
    if(new Set(acts).size>1){ rec.path=[...new Set(acts)].join(' \u2192 '); moved.push(rec); }
    else if(billers.length>1) dup.push(rec);
    else own.push(rec);
  });
  const T=a2=>a2.reduce((s2,x)=>s2+x.waste,0);
  const again = moved.length + own.length + dup.length;
  let once=0; byClaim.forEach(v=>{ if(v.length<2) once++; });
  const tile=(n,l,tone)=>`<div class="fb-tile ${tone||''}"><div class="ft-n">${n}</div><div class="ft-l">${esc(l)}</div></div>`;

  // action as the parent, sub-status underneath — the shape used everywhere else
  const nested = (list, key) => {
    const total=T(list);
    const byAct=[...groupBy(list, x=>x.action).entries()]
      .map(([act,v])=>({act, claims:v.length, waste:T(v),
        subs:[...groupBy(v, x=>x.reason).entries()]
          .map(([rsn,rs])=>({rsn, claims:rs.length, waste:T(rs), rows:rs}))
          .sort((a2,b2)=>b2.waste-a2.waste)}))
      .sort((a2,b2)=>b2.waste-a2.waste);
    let cum=0, cutAt=-1;
    byAct.forEach((g,i)=>{ cum+=g.waste; if(cutAt<0 && cum/total>=0.8) cutAt=i; });
    return {byAct, total, cutAt};
  };
  const table = (list, key, label) => {
    if(!list.length) return `<div class="data-note">Nothing in this group.</div>`;
    const {byAct,total,cutAt}=nested(list,key);
    return `<div class="table-scroll"><table class="data">
      <thead><tr><th>Action / Sub-status</th><th class="num">Claims</th><th class="num">Touches</th>
        <th class="num">Share</th><th>Note</th><th>Impacted Claims</th></tr></thead>
      <tbody>${byAct.map((g,gi)=>{
        const head=`<tr class="row-parent tc-toggle ${gi<=cutAt?'is-outlier':''}" data-tc="${key}-${gi}" style="cursor:pointer;">
          <td><span class="aud-caret" data-tccaret="${key}-${gi}">&#9656;</span> <b>${esc(g.act)}</b>
            <span class="mini">${g.subs.length} sub-status</span></td>
          <td class="num">${g.claims}</td>
          <td class="num">${g.waste}</td>
          <td class="num">${fmtPct(pct(g.waste,total))}</td>
          <td>${gi<=cutAt? '<span class="tag outlier">in the top 80%</span>' : ''}</td>
          <td><button type="button" class="csv-btn" data-tccsv="${esc(key)}|${esc(g.act)}|">&#8595; ${g.claims} claim(s)</button></td></tr>`;
        const kids=g.subs.map(sb=>`<tr class="row-child tc-row" data-tc="${key}-${gi}" style="display:none;">
          <td><span class="child-mark">&#8226;</span>${esc(sb.rsn)}</td>
          <td class="num">${sb.claims}</td>
          <td class="num">${sb.waste}</td>
          <td class="num">${fmtPct(pct(sb.waste,total))}</td>
          <td class="mini">${esc(sb.rows.slice(0,3).map(r=>r.id).join(', '))}${sb.rows.length>3?` +${sb.rows.length-3}`:''}</td>
          <td><button type="button" class="csv-btn" data-tccsv="${esc(key)}|${esc(g.act)}|${esc(sb.rsn)}">&#8595; ${sb.claims} claim(s)</button></td>
        </tr>`).join('');
        return head+kids;
      }).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${list.length}</td><td class="num">${total}</td>
        <td class="num">100.0%</td>
        <td>${cutAt+1} of ${byAct.length} action(s) carry 80%</td>
        <td><button type="button" class="csv-btn" data-tccsv="${esc(key)}||">&#8595; all ${list.length} claim(s)</button></td></tr></tfoot>
    </table></div>`;
  };
  const chase = own.filter(x=>x.span>=7).length;

  return `<div class="card"><h3>Touch Count</h3>
    <div class="card-sub">Matched on the <b>Unique ID</b> column &middot; claims worked more than once inside ${esc(rangeLabel())} ·
      matched on the claim number${det.some(r=>r.claimId)?'':' written in the note, since the Claim ID column is empty'} ·
      <b>if the action changed on the next touch it is not counted</b> — the claim moved on rather than being reworked</div>
    <div class="funnel">
      <div class="fn-stage">
        <div class="fn-top"><span>Production rows</span><span class="fn-n">${det.length}</span></div>
        <div class="fn-bar">
          <div class="fn-seg fn-a" style="width:${pct(tracked,det.length)}%"></div>
          <div class="fn-seg fn-none" style="width:${pct(untracked,det.length)}%"></div>
        </div>
        <div class="fn-lab"><span>${tracked} carry a claim number</span>
          <span>${untracked} do not — cannot be matched</span></div>
      </div>
      <div class="fn-stage" style="width:${Math.max(28,pct(tracked,det.length))}%">
        <div class="fn-top"><span>Distinct claims behind them</span><span class="fn-n">${byClaim.size}</span></div>
        <div class="fn-bar">
          <div class="fn-seg fn-b" style="width:${pct(once,byClaim.size)}%"></div>
          <div class="fn-seg fn-c" style="width:${pct(again,byClaim.size)}%"></div>
        </div>
        <div class="fn-lab"><span>${once} touched once</span><span>${again} touched again</span></div>
      </div>
      <div class="fn-stage" style="width:${Math.max(30,pct(again,byClaim.size)*pct(tracked,det.length)/100)}%">
        <div class="fn-top"><span>Touched again</span><span class="fn-n">${again}</span></div>
        <div class="fn-bar">
          <div class="fn-seg fn-ok"   style="width:${pct(moved.length,again||1)}%"></div>
          <div class="fn-seg fn-warn" style="width:${pct(own.length,again||1)}%"></div>
          <div class="fn-seg fn-bad"  style="width:${pct(dup.length,again||1)}%"></div>
        </div>
      </div>
      <div class="fn-key">
        <span><i class="fn-ok"></i><b>${moved.length}</b> moved on <span class="fn-sub">&middot; ${T(moved)+moved.length} rows &middot; not waste</span></span>
        <span><i class="fn-warn"></i><b>${own.length}</b> same biller came back <span class="fn-sub">&middot; ${T(own)+own.length} rows &middot; may be a chase</span></span>
        <span><i class="fn-bad"></i><b>${dup.length}</b> two billers, same step <span class="fn-sub">&middot; ${T(dup)+dup.length} rows &middot; act on this</span></span>
      </div>
    </div>
    <div class="section-sub-title">How the figures add up</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Group</th><th class="num">Claims</th><th class="num">Rows</th><th>What it is</th></tr></thead>
      <tbody>
        <tr><td>Touched once</td>
          <td class="num">${byClaim.size - moved.length - own.length - dup.length}</td>
          <td class="num">${tracked - moved.reduce((a,x)=>a+x.n,0) - own.reduce((a,x)=>a+x.n,0) - dup.reduce((a,x)=>a+x.n,0)}</td>
          <td><span class="tag clear">Worked once — nothing to look at</span></td></tr>
        <tr><td>Moved on — action changed</td>
          <td class="num">${moved.length}</td><td class="num">${moved.reduce((a,x)=>a+x.n,0)}</td>
          <td><span class="tag clear">Progression, not waste</span></td></tr>
        <tr class="${own.length?'':''}"><td>Same biller came back</td>
          <td class="num">${own.length}</td><td class="num">${own.reduce((a,x)=>a+x.n,0)}</td>
          <td><span class="tag major">Review — may be a deliberate chase</span></td></tr>
        <tr class="${dup.length?'is-outlier':''}"><td>Two billers, same step</td>
          <td class="num">${dup.length}</td><td class="num">${dup.reduce((a,x)=>a+x.n,0)}</td>
          <td><span class="tag outlier">Duplicated effort — act on this</span></td></tr>
      </tbody>
      <tfoot>
        <tr><td>Rows carrying a claim number</td>
          <td class="num">${byClaim.size}</td><td class="num">${tracked}</td>
          <td>every claim counted once</td></tr>
        <tr><td></td><td>No claim number</td><td class="num">—</td><td class="num">${untracked}</td>
          <td>cannot be matched, left out of the figures above</td></tr>
        <tr><td></td><td><b>Production in this range</b></td><td class="num">—</td>
          <td class="num"><b>${det.length}</b></td>
          <td>${tracked} + ${untracked} = ${det.length}</td></tr>
      </tfoot>
    </table></div>

    ${derivedActionNote('Whether the action changed between touches')}
    <div class="data-note"><b>Three different things, kept apart.</b>
      A claim whose <b>action changed</b> moved on and is not waste.
      A claim the <b>same biller came back to</b> may be a deliberate follow-up — ${chase} of these were 7 or more days
      apart, which reads like a chase rather than rework.
      A claim <b>two billers each worked to the same point</b> is duplicated effort, and is the one to act on.
      ${untracked? `<b>${untracked} of the ${det.length} claim row(s) in this range carry no claim number</b>, so they cannot be
      matched to anything and are left out of every figure above — which is why the first tile is lower than the
      production count.`:''}</div>

    <div class="section-sub-title">Two billers, same step — duplicated effort (${T(dup)} touches)</div>
    ${table(dup,'dup','duplicate')}

    <div class="section-sub-title">Same biller came back — review, not waste (${T(own)} touches)</div>
    ${table(own,'own','follow-up')}

    ${moved.length? `
    <div class="section-sub-title">Where the claim moved on</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Path</th><th class="num">Claims</th><th>Read</th></tr></thead>
      <tbody>${[...groupBy(moved, x=>x.path).entries()]
        .map(([k,v])=>({k,n:v.length})).sort((a2,b2)=>b2.n-a2.n).slice(0,6)
        .map(p2=>`<tr><td><b>${esc(p2.k)}</b></td><td class="num">${p2.n}</td>
          <td><span class="tag clear">Progression — not counted as waste</span></td></tr>`).join('')}</tbody>
    </table></div>`:''}
  </div>`;
}

function claimsByUserHTML(){

  if(!det.length) return '';
  const F = noteForensics(det);
  const hasNotes = det.some(r=>r.note);
  if(!hasNotes) return '';

  const g = groupBy(det, r=>r.nameKey);
  const list=[];
  for(const [nk, rs] of g){
    list.push({nameKey:nk, name:rs[0].name, tl:teamLeadOf(nk), rows:rs,

      // the sum of every check a claim trips — one claim can contribute several
      flagged:  rs.reduce((n,r)=>n
                  + (r._repeatClaim?1:0) + (r._exactCopy?1:0) + (r._repeatRef?1:0)
                  + (r._dosMismatch?1:0) + (r._noClaimNo?1:0) + (r._callNoRef?1:0)
                  + (r._misspelled||[]).length, 0),
      withFind: new Set(rs.filter(r=>r._repeatClaim||r._exactCopy||r._repeatRef||r._dosMismatch
                        ||r._noClaimNo||r._callNoRef||(r._misspelled||[]).length)
                        .map(r=>(r._claimNos&&r._claimNos[0])||r.uid||r.dateKey+'|'+r.note.slice(0,40))).size,

  list.sort((a,b)=>(b.exact+b.repClaim+b.dosBad)-(a.exact+a.repClaim+a.dosBad) || b.flagged-a.flagged);

      const words={}; let claims=0;
      det.forEach(r=>{ if(r._misspelled && r._misspelled.length){ claims++;
        r._misspelled.forEach(w=>words[w]=(words[w]||0)+1); }});
      const list=Object.entries(words).sort((a,b)=>b[1]-a[1]);
      const fields=[['status','Status'],['mode','Mode of Work'],['practice','Practice'],['payer','Payer']]
        .map(([f,l])=>({label:l, v:fieldVariants(det,f)})).filter(x=>x.v.length);
      if(!list.length && !fields.length) return '';
      return `<div class="section-sub-title">Spelling and consistency</div>
        ${list.length? `<div class="data-note"><b>${claims} claim(s)</b> contain a word from the known-misspelling list:
          ${list.slice(0,10).map(([w,c])=>`<span class="mono">${esc(w)}</span> &times;${c} &rarr; ${esc(MISSPELLINGS[w])}`).join(' &middot; ')}
          ${list.length>10?` and ${list.length-10} more`:''}.</div>`
        : `<div class="data-note">No known misspellings found in the note text.</div>`}
        ${fields.length? `<div class="table-scroll"><table class="data">
          <thead><tr><th>Field</th><th>Same value typed more than one way</th><th class="num">Rows</th></tr></thead>
          <tbody>${fields.flatMap(f=>f.v.slice(0,4).map(g=>`<tr>
            <td><b>${esc(f.label)}</b></td>
            <td style="white-space:normal;">${g.forms.map(([v,n])=>`<span class="mono">&ldquo;${esc(v)}&rdquo;</span> &times;${n}`).join(' &nbsp;|&nbsp; ')}</td>
            <td class="num">${g.rows}</td></tr>`)).join('')}</tbody>
        </table></div>
        <div class="data-note">A value typed several ways is counted as several different values, so every total built
          from that field is split. Fixing it at source is quicker than any rule here.</div>`:''}`;
    })()}

    ${refRows.length? `
    <div class="section-sub-title">Call references cited on more than one claim &mdash; claims told apart by Unique ID</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Call Reference</th><th class="num">Claims</th><th class="num">Billers</th>
        <th>Who cited it</th><th class="num">Balance Behind</th><th>Read</th></tr></thead>
      <tbody>${refRows.map(x=>`<tr class="${x.billers.length>1?'is-outlier':''}">
        <td class="mono"><b>${esc(x.ref)}</b></td>
        <td class="num">${x.n}</td>
        <td class="num">${x.billers.length}</td>
        <td>${esc(x.billers.slice(0,3).join(', '))}${x.billers.length>3?` +${x.billers.length-3}`:''}</td>
        <td class="num">${money(x.balance)}</td>
        <td>${x.billers.length>1
          ? '<span class="tag outlier">Two or more billers, one call</span>'
          : `<span class="tag clear">One call, ${x.n} claims</span>`}</td>
      </tr>`).join('')}</tbody>
    </table></div>` : ''}

    <div class="col-legend">
      <div class="cl-title">What each column means</div>
      <div class="cl-grid">
        <div><b>Repeat claim #</b> — the payer's claim number appears on more than one row, so the same claim was worked twice.
          Taken from the Claim ID column when it is filled, otherwise from the claim number written inside the note.
          ${det.some(r=>r.claimId)?'':'<b>In this file the Claim ID column is empty, so every match comes from the note text.</b>'}</div>
        <div><b>Exact copy</b> — identical to another claim's note, numbers and dates included, so it still names the other claim.</div>
        <div><b>Repeat call ref</b> — <b>claims are told apart by the Unique ID column</b>. — a reference <b>is</b> recorded, but the same one is cited on other claims. One call
          often covers several claims legitimately, so read the count, not the fact — a reference appearing under two
          different billers is the one to open, since only one of them was on that call.</div>
        <div><b>DOS mismatch</b> — the date of service typed into the note is not the row's own DOS. ${withDOS} of ${det.length} notes carry a DOS and could be checked.</div>
        <div><b>Claims</b> — rows worked by this biller in the selected range.</div>
        <div><b>No claim #</b> — the note never records the claim number it is about, so it cannot be tied back to a
          claim on its own. Counted separately from Flagged.</div>
        <div><b>No call ref</b> — <b>a call reference or a case number both count</b>, so a note citing
          <span class="mono">case# CS-4471902</span> is clean. A publication, section, article, chapter, LCD, NCD or
          policy number does not count — those cite NCCI or payer guidance, which is the source of truth for the
          decision, not evidence that a call took place. <b>Only raised where the note says a call was placed to the
          payer or insurance</b> —
          a rep named, a number dialled, or wording such as "spoke to" or "as per rep". A portal check, an EOB read or a
          coding query is not a call and is never asked for a reference. Where a call is stated and no reference number
          was recorded, nothing about that call can be verified with the payer afterwards. Counted separately from Flagged.</div>
        <div><b>Spelling</b> — claims containing a word from the known-misspelling list. Counted separately and never
          part of Flagged, since a typo is a writing matter, not a documentation fault.</div>
        <div><b>Errors</b> — <b>a count of errors, not of claims.</b> One claim that trips three checks adds three,
          and appears under all three columns. Use <b>Impacted Claims</b> for the number of claims involved.</div>
        <div><b>Impacted Claims</b> — how many distinct claims carry at least one finding, counted on the
          <b>Unique ID</b> column. This is the number the download gives you. This is the number the
          download gives you.</div>
        <div><b>(legacy)</b> The download holds these only; clean claims are never in the file.</div>
        <div style="grid-column:1/-1;padding-top:4px;border-top:1px solid var(--border);">
          <b>Each claim is counted once.</b> A claim can trip several checks, so for counting it is placed in the most serious column it qualifies for —
          DOS mismatch, then exact copy, then repeat claim #, then reused wording, then repeat call ref. The five columns therefore add up to Flagged.
          The claim list below and the CSV still show <b>every</b> flag on a row, so nothing is hidden.</div>
        <div style="grid-column:1/-1;padding-top:4px;border-top:1px solid var(--border);">
          <b>Three different repeats, three different meanings.</b>
          <b>Repeat claim #</b> means the same claim was worked twice, so effort was spent twice.
          <b>Reused wording</b> and <b>Exact copy</b> mean the same text on different claims.
          <b>Repeat call ref</b> means the same phone call cited on different claims — a reference shared across
          <b>two or more billers</b> is the one to look at, since only one person was on that call.
        </div>
        <div style="grid-column:1/-1;"><b>These columns do not add up to Claims.</b> They cover only what is worth acting on —
          a claim worked and documented correctly appears in Claims and in none of them. Read them as a review queue, not a verdict:
          a wrong identifier can be a paste, a typo, or a note written against the wrong tab.</div>
      </div>
    </div></div>`;
}

function baseLabel(){
  if(!BASE) return 'none';
  const bits=[];
  if(BASE.qa && BASE.qa.length)   bits.push(BASE.qa.length+' audits');
  if(BASE.prod && BASE.prod.length) bits.push(BASE.prod.reduce((s,p)=>s+p.count,0)+' claims');
  return bits.join(' · ') || 'loaded';
}

      let rows=[];
      if(res.type==='csv') rows=res.rows;
      else{

async function handleBaseQA(file){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.json')){
    const fr=new FileReader();
    fr.onload=async ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d._format!=='purview-quality-dashboard'){ toast('That is not an exported data file.', true); return; }
        BASE = BASE || {qa:[], prod:[]};
        BASE.qa = d.qa||[]; BASE.prod = d.prod||BASE.prod||[]; BASE.label=(d.savedAt||'').slice(0,10);
        await sset(K.base, BASE); setBaseCount(); render();
        toast(`Previous period loaded — ${BASE.qa.length} audit(s), ${(BASE.prod||[]).reduce((s,p)=>s+p.count,0)} claim(s).`);
      }catch(err){ toast('Could not read that data file.', true); }
    };
    fr.readAsText(file); return;
  }
  readFile(file, res=>{
    try{
      let rows=[];
      if(res.type==='csv') rows=res.rows;
      else {
        const wb=res.wb, nm=wb.SheetNames;
        const find=f=>nm.find(n=>n.trim().toLowerCase().includes(f));
        rows = sheetToRows(wb, find('audit data') || nm[0]);
      }
      const audits = parseAudit(rows);
      if(!audits.length){
        toast('No audit rows found — is this the QA sheet? Use the Previous Production slot for claims.', true);
        return;
      }
      BASE = BASE || {qa:[], prod:[]};
      BASE.qa = audits;
      const ds = audits.map(r=>r.dateWorked).filter(Boolean).sort();
      if(ds.length) BASE.label = ds[ds.length-1];
      sset(K.base, BASE); setBaseCount(); render();
      toast(`Previous QA loaded — ${audits.length} audit(s).`);
    }catch(err){ toast('Could not read that file.', true); }
  });
}

// Same maths as the live period, run over the baseline rows.
function periodStats(qaRows, prodRows){
  const claims = prodRows.reduce((s,p)=>s+p.count,0);
  const errs   = qaRows.reduce((s,r)=>s+r.errors.length,0);
  const rw     = qaRows.filter(r=>rwYes(r.reworkNeeded));
  const target = prodRows.reduce((s,p)=>s+targetForRow(p),0);
  return {
    target,
    attain: target>0 ? pct(claims, target) : null,
    audits: qaRows.length,
    score: qaRows.length? avgScore(qaRows) : null,
    errors: errs,
    fatal: qaRows.reduce((s,r)=>s+r.errors.filter(e=>e.bucket==='fatal').length,0),
    claims,
    sampling: claims>0 ? pct(qaRows.length, claims) : null,
    clean: qaRows.length? pct(qaRows.filter(r=>!r.errors.length).length, qaRows.length) : null,
    reworkClosure: rw.length? pct(rw.filter(r=>rwYes(r.reworkComplete)).length, rw.length) : null,
    people: new Set([...qaRows.map(r=>r.nameKey), ...prodRows.map(p=>p.nameKey)]).size
  };
}
function deltaCell(now, was, opts){
  const o = opts||{};
  // undefined arises when a name exists in only one period; treat it as unknown
  // rather than letting it fall through to NaN
  if(now===null || now===undefined || was===null || was===undefined || isNaN(now) || isNaN(was))
    return '<span style="color:var(--text-faint);">—</span>';
  const d = +(now - was).toFixed(1);
  if(Math.abs(d) < (o.tol||0.05)) return '<span style="color:var(--text-faint);">no change</span>';
  const better = o.lowerIsBetter ? d < 0 : d > 0;
  const arrow = d > 0 ? '&#9650;' : '&#9660;';
  return `<span style="color:${better?'var(--good)':'var(--bad)'};font-weight:700;">${arrow} ${Math.abs(d)}${o.unit||''}</span>`;
}
function comparisonHTML(){
  const bq = BASE && BASE.qa && BASE.qa.length;
  const bp = BASE && BASE.prod && BASE.prod.length;
  if(!bq && !bp){
    return `<div class="card needs-data"><h3>This Period vs Previous</h3>
      <div class="card-sub">No previous period loaded.</div>
      <div class="nd-body">Every report is a snapshot — it shows where you are, not which way you are moving.
        Upload last month's data in the <b>Previous Period</b> slot above and this section fills in with the change on every headline number.
        <div class="nd-cols">Easiest route: press <b>Export data</b> at the end of each month and upload that .json here next month.
          A raw QA or production sheet works too.</div>
      </div></div>`;
  }
  const now  = periodStats(scopeQA(), scopeProd());
  const was  = periodStats(BASE.qa||[], BASE.prod||[]);
  // a half that was never uploaded is unknown, not zero — showing 0 would
  // read as a collapse to nothing
  if(!bq){ ['audits','score','errors','fatal','clean','reworkClosure'].forEach(k=>was[k]=null); }
  if(!bp){ was.claims=null; }
  if(!bq || !bp){ was.sampling=null; }
  if(!bq && !bp){ was.people=null; }
  const rows = [
    {k:'Avg QA Score',       n:now.score,         w:was.score,         unit:'pts', isPct:true},
    {k:'Clean Audits',       n:now.clean,         w:was.clean,         unit:'pts', isPct:true},
    {k:'Errors',             n:now.errors,        w:was.errors,        lower:true},
    {k:'Fatal Errors',       n:now.fatal,         w:was.fatal,         lower:true},
    {k:'Audits Done',        n:now.audits,        w:was.audits},
    {k:'Sampling %',         n:now.sampling,      w:was.sampling,      unit:'pts', isPct:true},
    {k:'Claims Worked',      n:now.claims,        w:was.claims},
    {k:'Rework Closure %',   n:now.reworkClosure, w:was.reworkClosure, unit:'pts', isPct:true},
    {k:'People Covered',     n:now.people,        w:was.people}
  ];
  // percentages must stay percentages even when they land on a whole number
  const fmt = (v, isPct) => v===null||v===undefined ? '—' : (isPct ? fmtPct(v) : v);
  // per-associate movement, where both periods have the person
  const nowBy = groupBy(scopeQA(), r=>r.nameKey);
  const wasBy = groupBy(BASE.qa||[], r=>r.nameKey);
  const movers=[];
  for(const [nk, rs] of nowBy){
    const prev = wasBy.get(nk);
    if(!prev || !prev.length) continue;
    const a=avgScore(rs), b=avgScore(prev);
    movers.push({name:rs[0].name, now:a, was:b, d:+(a-b).toFixed(1), audits:rs.length});
  }
  movers.sort((a,b)=>a.d-b.d);
  const fell = movers.filter(m=>m.d<=-1).slice(0,6);
  const rose = movers.filter(m=>m.d>=1).slice(-6).reverse();

  return `<div class="card"><h3>This Period vs Previous</h3>
    <div class="card-sub">Current selection against the uploaded baseline${BASE.label?` (to ${esc(fmtD(BASE.label))})`:''} · green is the better direction for that measure${(!bq||!bp)?` · only the ${bq?'QA':'production'} half was uploaded, so ${bq?'volume':'quality'} rows read as —`:''}</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Measure</th><th class="num">Previous</th><th class="num">Now</th><th class="num">Change</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td><b>${esc(r.k)}</b></td>
        <td class="num">${fmt(r.w, r.isPct)}</td>
        <td class="num">${fmt(r.n, r.isPct)}</td>
        <td class="num">${deltaCell(r.n, r.w, {lowerIsBetter:r.lower, unit:r.unit?' '+r.unit:''})}</td>
      </tr>`).join('')}</tbody>
    </table></div>

    ${movers.length? `
    <div class="section-sub-title">Who moved</div>
    <div class="grid-2">
      <div><div class="tgt-lbl" style="margin-bottom:6px;">Scores that fell</div>
        ${fell.length? `<div class="table-scroll"><table class="data">
          <thead><tr><th>Associate</th><th class="num">Was</th><th class="num">Now</th><th class="num">Change</th></tr></thead>
          <tbody>${fell.map(m=>`<tr class="is-outlier"><td><b>${esc(m.name)}</b></td>
            <td class="num">${fmtPct(m.was)}</td><td class="num">${fmtPct(m.now)}</td>
            <td class="num">${deltaCell(m.now,m.was,{unit:' pts'})}</td></tr>`).join('')}</tbody>
        </table></div>` : '<div style="font-size:12.5px;color:var(--good);font-weight:600;">Nobody dropped by a point or more.</div>'}
      </div>
      <div><div class="tgt-lbl" style="margin-bottom:6px;">Scores that improved</div>
        ${rose.length? `<div class="table-scroll"><table class="data">
          <thead><tr><th>Associate</th><th class="num">Was</th><th class="num">Now</th><th class="num">Change</th></tr></thead>
          <tbody>${rose.map(m=>`<tr><td><b>${esc(m.name)}</b></td>
            <td class="num">${fmtPct(m.was)}</td><td class="num">${fmtPct(m.now)}</td>
            <td class="num">${deltaCell(m.now,m.was,{unit:' pts'})}</td></tr>`).join('')}</tbody>
        </table></div>` : '<div style="font-size:12.5px;color:var(--text-dim);">Nobody rose by a point or more.</div>'}
      </div>
    </div>`:''}

    <div class="insight-box"><div class="ib-title">Reading the change</div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        Only people present in <b>both</b> periods appear under "Who moved" — a new joiner has nothing to be compared against, and showing them would look like a collapse.
      </span></div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        The baseline is whatever you uploaded, so it is only a fair comparison if it covers a similar span. A four-week month against two weeks will move every count without anything having changed.
      </span></div>
      ${now.sampling!==null && was.sampling!==null && Math.abs(now.sampling-was.sampling)>=5 ? `<div class="ib-row"><span class="ib-dot"></span><span>
        Sampling moved by <b>${Math.abs(+(now.sampling-was.sampling).toFixed(1))} points</b>. A score shift on a very different sample size is weaker evidence than the number suggests.
      </span></div>`:''}
    </div></div>`;
}

/* ============================ SAVED VIEWS ============================ */
function refreshPresetSelect(){
  const sel=document.getElementById('presetSelect');
  if(!sel) return;
  const cur=sel.value;
  sel.innerHTML='<option value="">— none —</option>' +
    PRESETS.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('');
  if(PRESETS[cur]) sel.value=cur;
}
function wirePresets(){
  const sel=document.getElementById('presetSelect');
  const save=document.getElementById('presetSave');
  const del=document.getElementById('presetDel');
  if(!sel||!save||!del) return;
  save.addEventListener('click', async ()=>{
    const suggested = presetLabel(currentFilterState());
    const name = prompt ? prompt('Name this view', suggested) : suggested;
    const finalName = (name===null) ? null : String(name||'').trim() || suggested;
    if(finalName===null) return;
    const existing = PRESETS.findIndex(p=>p.name.toLowerCase()===finalName.toLowerCase());
    const entry = {name:finalName, ...currentFilterState()};
    if(existing>=0) PRESETS[existing]=entry; else PRESETS.push(entry);
    await sset(K.presets, PRESETS);
    refreshPresetSelect();
    sel.value = String(PRESETS.findIndex(p=>p.name===finalName));
    toast(`View saved: ${finalName}`);
  });
  del.addEventListener('click', async ()=>{
    const i=sel.value;
    if(i===''||!PRESETS[i]){ toast('Pick a saved view first.', true); return; }
    const nm=PRESETS[i].name;
    PRESETS.splice(i,1);
    await sset(K.presets, PRESETS);
    refreshPresetSelect(); sel.value='';
    toast(`Deleted: ${nm}`);
  });
  sel.addEventListener('change', ()=>{
    const p=PRESETS[sel.value];
    if(!p) return;
    DATE_FROM=p.from||''; DATE_TO=p.to||'';
    CLIENT=p.client||'__all__'; PRACTICE=p.practice||'__all__';
    TEAMLEAD=p.tl||'__all__'; ASSOC=p.assoc||'__all__';
    const f=document.getElementById('dateFrom'), t=document.getElementById('dateTo');
    if(f) f.value=DATE_FROM; if(t) t.value=DATE_TO;
    buildFilters();
    const cs=document.getElementById('clientSelect'); if(cs) cs.value=CLIENT;
    const ps=document.getElementById('practiceSelect'); if(ps) ps.value=PRACTICE;
    const ts=document.getElementById('tlSelect'); if(ts) ts.value=TEAMLEAD;
    const as=document.getElementById('assocSelect'); if(as) as.value=ASSOC;
    render();
    toast(`Applied: ${p.name}`);
  });
}

/* ============================ PAYER ============================ */
// The QA sheet carries a Payer column that nothing used. Error patterns by payer
// often show that a "training problem" is really one payer behaving badly.
function payerHTML(rows){
  const withPayer = rows.filter(r=>r.payer && r.payer.trim());
  if(!withPayer.length) return `<div class="card needs-data"><h3>By Payer</h3>
    <div class="card-sub">Not available — the <b>Payer</b> column is empty on these rows.</div>
    <div class="nd-body">Grouping errors by payer separates a people problem from a payer problem. If one payer drives a category across several billers, coaching will not fix it.
      <div class="nd-cols">Fill the <b>Payer</b> column on the Audit Data tab.</div></div></div>`;
  const g = groupBy(withPayer, r=>r.payer.trim());
  const list=[];
  for(const [payer, rs] of g){
    const m=new Map();
    rs.forEach(r=>r.errors.forEach(e=>m.set(e.cat,(m.get(e.cat)||0)+1)));

  const totalErr=list.reduce((s,x)=>s+x.errors,0);

        <td class="num">${x.audits}</td>
        <td class="num">${x.people}</td>
        <td class="num"><span class="stamp ${scoreClass(x.score)}">${fmtPct(x.score)}</span></td>
        <td class="num">${x.errors}</td>
        <td class="num">${x.fatal}</td>
        <td class="num">${fmtPct(pct(x.errors, totalErr||1))}</td>
        <td>${x.top? `${esc(x.top.cat)} <span style="color:var(--text-faint);">(${x.top.n})</span>`:'—'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td>
        <td class="num">${list.reduce((s,x)=>s+x.audits,0)}</td>
        <td class="num">${new Set(withPayer.map(r=>r.nameKey)).size}<span class="foot-note">distinct</span></td>
        <td class="num">${fmtPct(avgScore(withPayer))}</td>
        <td class="num">${totalErr}</td>
        <td class="num">${list.reduce((s,x)=>s+x.fatal,0)}</td>
        <td class="num">${fmtPct(100)}</td><td></td></tr></tfoot>
    </table></div>
    <div class="insight-box"><div class="ib-title">What to look for</div>
      ${spread.length? `<div class="ib-row"><span class="ib-dot"></span><span>
        ${spread.map(x=>`<b>${esc(x.payer)}</b> — ${fmtPct(pct(x.top.n,x.errors))} of its errors are ${esc(x.top.cat)}, across ${x.people} associates`).join('; ')}.
        When one category dominates a payer across several people, the cause is usually the payer's process or a gap in the SOP for it.
      </span></div>`:`<div class="ib-row"><span class="ib-dot"></span><span>
        No payer shows a single category dominating across multiple associates — errors look spread rather than payer-driven.

      <div class="ib-row"><span class="ib-dot"></span><span>

// Last period against this one, across every dimension the app measures.
// Everything here is a paired read: a number on its own says where you are,
// a pair says which way you are moving.
function baseHas(){ return {qa: !!(BASE&&BASE.qa&&BASE.qa.length), prod: !!(BASE&&BASE.prod&&BASE.prod.length)}; }

function cmpDelta(now, was, opts){ return deltaCell(now, was, opts); }
function cmpVerdict(d, lowerIsBetter, tol){
  const t = tol===undefined ? 1 : tol;
  if(d===null) return {label:'—', tone:''};
  const better = lowerIsBetter ? d < -t : d > t;
  const worse  = lowerIsBetter ? d >  t : d < -t;
  if(better) return {label:'Improved', tone:'clear'};
  if(worse)  return {label:'Declined', tone:'outlier'};
  return {label:'Flat', tone:'nonfatal'};
}

// per-associate figures for one period
function assocStats(qaRows, prodRows){
  const out = new Map();
  const rep = repeatCountByAssociate(qaRows);
  const byQ = groupBy(qaRows, r=>r.nameKey);
  for(const [nk, rs] of byQ){
    const rw = rs.filter(r=>rwYes(r.reworkNeeded));
    const errRows = rs.filter(r=>r.errors.length);
    out.set(nk, {
      nameKey:nk, name:rs[0].name, teamLead:rs[0].teamLead||'', project:rs[0].project||'',
      audits:rs.length, score:avgScore(rs),
      errors:rs.reduce((s,r)=>s+r.errors.length,0),
      fatal:rs.reduce((s,r)=>s+r.errors.filter(e=>e.bucket==='fatal').length,0),
      repeats:rep.get(nk)||0,
      reworkNeeded:rw.length,
      reworkClosure: rw.length? pct(rw.filter(r=>rwYes(r.reworkComplete)).length, rw.length) : null,
      fbShare: errRows.length? pct(errRows.filter(r=>fbShared(r.feedbackStatus)).length, errRows.length) : null,
      claims:0, target:0, attain:null
    });
  }
  const byP = groupBy(prodRows, p=>p.nameKey);
  for(const [nk, ps] of byP){
    const claims = ps.reduce((s,p)=>s+p.count,0);
    const target = ps.reduce((s,p)=>s+targetForRow(p),0);
    const e = out.get(nk) || {nameKey:nk, name:ps[0].name, teamLead:teamLeadOf(nk), project:ps[0].project||'',
      audits:0, score:null, errors:0, fatal:0, repeats:0, reworkNeeded:0, reworkClosure:null, fbShare:null};
    e.claims=claims; e.target=target; e.attain = target>0? pct(claims,target) : null;
    out.set(nk, e);
  }
  return out;
}

// Ramp-up expectations, editable because they change.
let RAMPUP = { expWeeks:3, freshTrain:4, freshOJT:2, pipWeeks:2 };
// Corrections made in the app. The uploaded sheet is never modified, so these
// are kept separately and travel with a published file.
let ROSTER_EDITS = {};

function rosterKeyOf(r){ return (r.ecn && r.ecn.trim()) ? 'e:'+r.ecn.trim().toUpperCase() : 'n:'+r.nameKey; }
function rosterView(r){
  const e = ROSTER_EDITS[rosterKeyOf(r)] || {};
  return {...r,
    status:      e.status      !== undefined ? e.status      : r.status,
    doj:         e.doj         !== undefined ? e.doj         : r.doj,
    statusStart: e.statusStart !== undefined ? e.statusStart : r.statusStart,
    statusEnd:   e.statusEnd   !== undefined ? e.statusEnd   : r.statusEnd,
    comment:     e.comment     !== undefined ? e.comment     : r.comment,
    _edited: Object.keys(e).length>0};
}
const isProdStatus  = s => /^\s*production\s*$/i.test(s||'');
const isFresherStat = s => /fresher/i.test(s||'');
const isTrainingSt  = s => /ojt|training|fresher/i.test(s||'');
const isPipStatus   = s => /pip|qip/i.test(s||'');

// A comment that records an agreed extension should stop the alarm without
// erasing the record.
function commentWaives(c){ return /^\s*(approved|extended|exempt|waived)/i.test(c||''); }

function addDaysKey(key, n){
  // a roster date can be blank or unparseable, so never let an Invalid Date
  // reach toISOString — it throws and takes the whole report down
  if(!key || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return '';
  if(!isFinite(n)) return '';        // a setting saved before this rule existed
  const d=new Date(key+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate()+n);
  if(isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}
const validKey = k => !!k && /^\d{4}-\d{2}-\d{2}$/.test(k) && !isNaN(new Date(k+'T00:00:00').getTime());
// A PIP or QIP is a fixed window, not a ramp-up, so it is judged on its own
// dates. Someone on a plan is already in production and never gets a ramp-up flag.
function planCheck(v, todayKey){
  if(isPipStatus(v.status)){
    if(!validKey(v.statusStart)) return {kind:'pip', flag:'nostart'};
    const dueKey = addDaysKey(v.statusStart, RAMPUP.pipWeeks*7);
    if(!dueKey) return {kind:'pip', flag:'nostart'};
    if(validKey(v.statusEnd)){
      const ran = Math.round((new Date(v.statusEnd)-new Date(v.statusStart))/86400000);
      return {kind:'pip', flag:'closed', dueKey, ran};
    }
    const days = Math.round((new Date(todayKey)-new Date(dueKey))/86400000);
    if(commentWaives(v.comment)) return {kind:'pip', flag:'waived', dueKey, days};
    if(days > 0)  return {kind:'pip', flag:'over', dueKey, days};
    if(days > -7) return {kind:'pip', flag:'soon', dueKey, days};
    return {kind:'pip', flag:'ontrack', dueKey, days};
  }
  const base = validKey(v.statusStart) ? v.statusStart : (validKey(v.doj) ? v.doj : '');
  if(isProdStatus(v.status)) return {kind:'ramp', flag:'prod'};
  if(!base) return {kind:'ramp', flag:'nodate'};
  const weeks = isFresherStat(v.status) ? (RAMPUP.freshTrain + RAMPUP.freshOJT) : RAMPUP.expWeeks;
  const dueKey = addDaysKey(base, weeks*7);
  if(!dueKey) return {kind:'ramp', flag:'nodate'};
  const days = Math.round((new Date(todayKey)-new Date(dueKey))/86400000);
  const weeksIn = +(((new Date(todayKey)-new Date(base+'T00:00:00'))/86400000)/7).toFixed(1);
  if(commentWaives(v.comment)) return {kind:'ramp', flag:'waived', dueKey, days, weeksIn};
  if(days > 0)  return {kind:'ramp', flag:'over', dueKey, days, weeksIn};
  if(days > -7) return {kind:'ramp', flag:'soon', dueKey, days, weeksIn};
  return {kind:'ramp', flag:'ontrack', dueKey, days, weeksIn};
}
// Start and End describe a training or plan window, so they mean nothing for
// someone settled in production.
function datesApply(v){ return isTrainingSt(v.status) || isPipStatus(v.status); }

// The other kind of outlier: not onboarding, but failing the marks.
function performanceFlag(nameKey, prodOut){
  const oi = (()=>{ try{ return outlierInfo(nameKey); }catch(e){ return null; } })();
  const po = prodOut.find(p=>p.nameKey===nameKey);
  const bits=[];
  if(oi && oi.isOutlier){
    const st = (oi.currentStreak && oi.currentStreak.length) ? oi.currentStreak : oi.streak;
    const last = st && st.length ? st[st.length-1].score : null;
    bits.push(`<span class="tag outlier">QA outlier${last!==null?` · ${fmtPct(last)}`:''}</span>`);
  }
  if(po) bits.push(`<span class="tag outlier">Production outlier · ${fmtPct(po.latest)}</span>`);
  return bits;
}
// One file a supervisor can keep, annotate and pass on. Everything on screen,
// flattened, including the flags so nobody has to recompute them.
function exportTeamStatusCSV(){
  if(!ROSTER.length){ toast('No roster loaded.', true); return; }
  const today=new Date().toISOString().slice(0,10);
  const prodOut=(()=>{ try{ return prodOutliers(); }catch(e){ return []; } })();
  const prodBy=groupBy(scopeProd(), p=>p.nameKey);
  const qaBy=groupBy(scopeQA(), r=>r.nameKey);
  const q=v=>{const t=String(v??''); return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
  const head=['Team Lead','Name','ECN','SPAN','DOJ','Tenure Category','Status','Start Date','End Date',
              'Weeks In','Due By','Days Over','Ramp-up / Plan','Performance','QA Score %','Attainment %',
              'Audits','Claims','Target','Comment'];
  const lines=[head.map(q).join(',')];
  ROSTER.map(rosterView).forEach(v=>{
    const pc=planCheck(v, today);
    const pr=prodBy.get(v.nameKey)||[], qa=qaBy.get(v.nameKey)||[];
    const claims=pr.reduce((s,p)=>s+p.count,0);
    const target=pr.reduce((s,p)=>s+targetForRow(p),0);
    const score=qa.length? avgScore(qa) : null;
    const attain=target>0? pct(claims,target) : null;
    const planTxt = pc.kind==='pip'
      ? ({over:`PIP overdue +${pc.days}d`, soon:'PIP due soon', closed:`PIP closed ${pc.ran}d`,
          waived:'Extension noted', nostart:'PIP with no start date', ontrack:'PIP running'}[pc.flag]||'')
      : ({prod:'In production', over:`Ramp-up outlier +${pc.days}d`, soon:'Due soon',
          waived:'Extension noted', nodate:'No date', ontrack:'On track'}[pc.flag]||'');
    const perf=performanceFlag(v.nameKey, prodOut)
      .map(h=>h.replace(/<[^>]+>/g,'')).join('; ') || ((qa.length||claims)?'Meeting both':'No data');
    lines.push([v.supervisor, v.name, v.ecn, v.span, v.doj, v.tenureCat, v.status,
      v.statusStart, v.statusEnd,
      pc.weeksIn!==undefined? pc.weeksIn : '', pc.dueKey||'',
      (pc.flag==='over'? pc.days : ''),
      planTxt, perf,
      score===null? 'no data' : score.toFixed(1),
      attain===null? 'no data' : attain.toFixed(1),
      qa.length, claims, target, v.comment].map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`team-status-${today}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${ROSTER.length} people · ${lines.length-1} row(s) exported.`);
}

    ? `<input class="rs-in" type="date" data-rk="${esc(rosterKeyOf(x))}" data-rf="${field}" value="${esc(x[field]||'')}" />`
    : '<span class="na-cell">n/a</span>';

  // ---- roster checks ----
  const inQA   = new Set(scopeQA().map(r=>r.nameKey));
  const inProd = new Set(scopeProd().map(p=>p.nameKey));
  const noBoth   = people.filter(x=>!inQA.has(x.nameKey) && !inProd.has(x.nameKey));
  const prodNoQA = people.filter(x=>inProd.has(x.nameKey) && !inQA.has(x.nameKey));
  const qaNoProd = people.filter(x=>inQA.has(x.nameKey) && !inProd.has(x.nameKey));
  const nameCount = new Map();
  ROSTER.forEach(r=>nameCount.set(r.nameKey,(nameCount.get(r.nameKey)||0)+1));
  const dupNames=[...nameCount.entries()].filter(([,n])=>n>1)
    .map(([k])=>ROSTER.filter(r=>r.nameKey===k));
  const ecnOdd = (()=>{ const m={}; ROSTER.forEach(r=>{ if(!r.ecn) return; const pt=r.ecn.replace(/\d+/g,'#'); m[pt]=(m[pt]||0)+1; });
    const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
    return top? {pattern:top[0], rows:ROSTER.filter(r=>r.ecn && r.ecn.replace(/\d+/g,'#')!==top[0])} : {pattern:'',rows:[]}; })();
  const notInRoster = [...new Set([...inQA,...inProd])].filter(k=>!ROSTER.some(r=>r.nameKey===k))
    .map(k=>{ const r=scopeQA().find(x=>x.nameKey===k)||scopeProd().find(x=>x.nameKey===k); return r?r.name:k; });

  const checkRow = (label, n, detail, tone) => n ? `<tr class="${tone||''}">
    <td><b>${label}</b></td><td class="num">${n}</td><td style="white-space:normal;">${detail}</td></tr>` : '';

  const byTL = groupBy(people, x=>x.supervisor || '(no supervisor)');

  return `
    ${overdue.length||pipOpen.filter(x=>x.pc.flag==='over').length ? `<div class="banner bad"><div>
      <div class="b-title">${overdue.length} past their ramp-up date${pipOpen.filter(x=>x.pc.flag==='over').length?`, ${pipOpen.filter(x=>x.pc.flag==='over').length} plan(s) past two weeks`:''}</div>
      ${overdue.slice(0,4).map(x=>`${esc(x.name)} (+${x.pc.days}d)`).join(' · ')}
    </div></div>`:''}

    <div class="kpi-grid">
      ${kpi('Headcount', head.total, '', `${byTL.size} team lead(s)`)}
      ${kpi('In Production', head.prod, 'good', head.total? fmtPct(pct(head.prod,head.total))+' of the team':'')}
      ${kpi('In Training', head.train, head.train?'warn':'', 'OJT and fresher')}
      ${kpi('On PIP / QIP', head.pip, head.pip?'bad':'', `${pipOpen.length} still open`)}
      ${kpi('Ramp-up Overdue', overdue.length, overdue.length?'bad':'good', 'past due, not in production')}
      ${kpi('Performance Outliers', perfOut.length, perfOut.length?'bad':'good', 'below QA or production mark')}
    </div>

    <div class="section-title">Rules</div>
    <div class="card"><h3>How long someone has to reach production</h3>
      <div class="card-sub">For information — these are the expectations the flags below are measured against</div>
      <div class="insight-box">
        <div class="ib-row"><span class="ib-dot"></span><span>
          <b>Experienced</b> — expected in Production within <b>${RAMPUP.expWeeks} weeks</b> of joining.</span></div>
        <div class="ib-row"><span class="ib-dot"></span><span>
          <b>Fresher</b> — <b>${RAMPUP.freshTrain} weeks</b> training plus <b>${RAMPUP.freshOJT} weeks</b> OJT, so due at <b>${RAMPUP.freshTrain+RAMPUP.freshOJT} weeks</b>.</span></div>
        <div class="ib-row"><span class="ib-dot"></span><span>
          <b>PIP / QIP</b> — runs a maximum of <b>${RAMPUP.pipWeeks} weeks</b> from its Start Date. Past that with no End Date, it is flagged.</span></div>
        <div class="ib-row"><span class="ib-dot"></span><span>
          Ramp-up counts from <b>Start Date</b> when filled, otherwise <b>DOJ</b>. A comment beginning <b>approved</b> or <b>extended</b> stands the flag down while staying on the record.</span></div>
      </div>
    </div>

    <div class="section-title">Team Status</div>
    <div class="card"><h3>Each team lead, with their people
      <button type="button" class="csv-btn" id="teamCsvBtn" style="float:right;">&#8595; CSV for supervisors</button></h3>
      <div class="card-sub">Click a team lead to open it · status, dates and comments are editable and never change your Excel ·
        <b>Start</b> and <b>End</b> apply to training and plans only</div>
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Team Lead / Associate</th><th class="num">QA Score</th><th class="num">Attainment</th>
          <th>ECN</th><th>DOJ</th><th>Status</th>
          <th>Start</th><th>End</th><th class="num">Weeks In</th><th>Due By</th>
          <th>Ramp-up / Plan</th><th>Performance</th><th>Comment</th></tr></thead>
        <tbody>${[...byTL.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([tl, mem], gi)=>{
          const ov=mem.filter(x=>x.pc.flag==='over').length;
          const po=mem.filter(x=>x.perf.length).length;
          const head2=`<tr class="row-parent ts-toggle ${ov?'is-outlier':''}" data-ts="${gi}" style="cursor:pointer;">
            <td><span class="aud-caret" data-tscaret="${gi}">&#9656;</span> <b>${esc(tl)}</b></td>
            <td class="num">${(()=>{const v=mem.filter(x=>x.score!==null);
              return v.length? `<span class="stamp ${scoreClass(v.reduce((s2,x)=>s2+x.score,0)/v.length)}">${fmtPct(v.reduce((s2,x)=>s2+x.score,0)/v.length)}</span>`:'<span class="na-cell">no data</span>';})()}</td>
            <td class="num">${(()=>{const cl=mem.reduce((s2,x)=>s2+x.claims,0), tg=mem.reduce((s2,x)=>s2+x.target,0);
              return tg>0? `<span class="stamp ${attainBand(pct(cl,tg))}">${fmtPct(pct(cl,tg))}</span>`:'<span class="na-cell">no data</span>';})()}</td>
            <td>${mem.length} people</td>
            <td></td>
            <td>${mem.filter(x=>isProdStatus(x.status)).length} prod · ${mem.filter(x=>isTrainingSt(x.status)).length} OJT</td>
            <td></td><td></td><td></td><td></td>
            <td>${ov?`<span class="tag outlier">${ov} overdue</span>`:'<span class="tag clear">None overdue</span>'}</td>
            <td>${po?`<span class="tag outlier">${po} outlier(s)</span>`:'<span class="tag clear">Clear</span>'}</td>
            <td></td></tr>`;
          const kids=mem.map(x=>`<tr class="row-child ts-row ${x.pc.flag==='over'?'is-outlier':''}" data-ts="${gi}" style="display:none;">
            <td><span class="child-mark">&#8226;</span>${esc(x.name)}${x._edited?' <span class="tgt-why">edited</span>':''}</td>
            <td class="num">${x.score===null? '<span class="na-cell">no data</span>'
              : `<span class="stamp ${scoreClass(x.score)}">${fmtPct(x.score)}</span>`}</td>
            <td class="num">${x.attain===null? '<span class="na-cell">no data</span>'
              : `<span class="stamp ${attainBand(x.attain)}">${fmtPct(x.attain)}</span>`}</td>
            <td class="mono">${esc(x.ecn||'—')}</td>
            <td><input class="rs-in" type="date" data-rk="${esc(rosterKeyOf(x))}" data-rf="doj" value="${esc(x.doj||'')}" /></td>
            <td><select class="rs-in" data-rk="${esc(rosterKeyOf(x))}" data-rf="status">
              ${[...new Set([x.status||'', ...statusOptions])].filter(Boolean).map(o=>
                `<option value="${esc(o)}" ${o.toLowerCase()===String(x.status||'').toLowerCase()?'selected':''}>${esc(o)}</option>`).join('')}
            </select></td>
            <td>${dateCell(x,'statusStart')}</td>
            <td>${dateCell(x,'statusEnd')}</td>
            <td class="num">${x.pc.weeksIn!==undefined? x.pc.weeksIn : '—'}</td>
            <td>${x.pc.dueKey? esc(fmtD(x.pc.dueKey)) : '—'}</td>
            <td>${planTag(x)}</td>
            <td>${x.perf.length? x.perf.join(' ')
                 : (x.audits||x.claims) ? '<span class="tag clear">Meeting both</span>'
                 : '<span class="tag clear">No data</span>'}</td>
            <td><input class="rs-in wide" type="text" data-rk="${esc(rosterKeyOf(x))}" data-rf="comment"
                 value="${esc(x.comment||'')}" placeholder="add note…" /></td>
          </tr>`).join('');
          return head2+kids;
        }).join('')}</tbody>
      </table></div>
    </div>

    <div class="section-title">Performance by Status</div>
    <div class="card"><h3>Quality and volume read against where someone is in their ramp-up</h3>
      <div class="card-sub">A score from week two of OJT and one from a settled associate are not the same result ·
        quality and volume sit together, because a plan can lift one while the other slips</div>
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Status</th><th class="num">People</th><th class="num">Audits</th>
          <th class="num">QA Score</th><th class="num">Errors</th>
          <th class="num">Claims</th><th class="num">Target</th><th class="num">Attainment</th>
          <th class="num">Claims / Day</th></tr></thead>
        <tbody>${[...groupBy(people, x=>x.status||'(blank)').entries()]
          .sort((a,b)=>b[1].length-a[1].length).map(([st, v])=>{
          const rs=v.flatMap(x=>qaBy.get(x.nameKey)||[]);
          const cl=v.reduce((s2,x)=>s2+x.claims,0), tg=v.reduce((s2,x)=>s2+x.target,0);
          const days=new Set(v.flatMap(x=>(prodBy.get(x.nameKey)||[]).map(p=>p.dateKey)).filter(Boolean)).size;
          if(!rs.length && !cl) return `<tr>
            <td><b>${esc(st)}</b></td><td class="num">${v.length}</td>
            <td colspan="7" style="text-align:center;color:var(--text-faint);font-style:italic;">no QA or production data for this status</td></tr>`;
          return `<tr>
            <td><b>${esc(st)}</b></td>
            <td class="num">${v.length}</td>
            <td class="num">${rs.length||'—'}</td>
            <td class="num">${rs.length? `<span class="stamp ${scoreClass(avgScore(rs))}">${fmtPct(avgScore(rs))}</span>`:'<span class="na-cell">no data</span>'}</td>
            <td class="num">${rs.reduce((s2,r)=>s2+r.errors.length,0)||'—'}</td>
            <td class="num">${cl||'—'}</td>
            <td class="num">${tg||'—'}</td>
            <td class="num">${tg>0? `<span class="stamp ${attainBand(pct(cl,tg))}">${fmtPct(pct(cl,tg))}</span>`:'<span class="na-cell">no data</span>'}</td>
            <td class="num">${days? (cl/days).toFixed(1):'—'}</td>
          </tr>`;}).join('')}</tbody>
      </table></div>
    </div>

    <div class="section-title">Roster Checks</div>
    <div class="card"><h3>Problems in the roster itself</h3>
      <div class="card-sub">These distort every other report, so they are worth fixing at source</div>
      ${(noBoth.length||prodNoQA.length||qaNoProd.length||dupNames.length||ecnOdd.rows.length||notInRoster.length) ? `
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Check</th><th class="num">People</th><th>Detail</th></tr></thead>
        <tbody>
          ${checkRow('In the team, no production and no audits', noBoth.length,
            `${noBoth.slice(0,6).map(x=>esc(x.name)).join(', ')}${noBoth.length>6?` +${noBoth.length-6}`:''} — invisible in every other report`, 'is-outlier')}
          ${checkRow('Production but never audited', prodNoQA.length,
            `${prodNoQA.slice(0,6).map(x=>esc(x.name)).join(', ')}${prodNoQA.length>6?` +${prodNoQA.length-6}`:''} — worked claims, no QA score at all`)}
          ${checkRow('Audited but no production', qaNoProd.length,
            `${qaNoProd.slice(0,6).map(x=>esc(x.name)).join(', ')}${qaNoProd.length>6?` +${qaNoProd.length-6}`:''} — sampling cannot be worked out`)}
          ${checkRow('Same person listed twice', dupNames.length,
            dupNames.map(d=>`${esc(d[0].name)} — ${d.map(r=>esc(r.ecn||'no ECN')).join(' and ')}`).join('; '), 'is-outlier')}
          ${checkRow('ECN does not match the usual pattern', ecnOdd.rows.length,
            `${ecnOdd.rows.slice(0,4).map(r=>esc(r.ecn)+' ('+esc(r.name)+')').join('; ')} — most are <span class="mono">${esc(ecnOdd.pattern)}</span>`)}
          ${checkRow('Working, but not in the roster', notInRoster.length,
            `${notInRoster.slice(0,6).map(esc).join(', ')}${notInRoster.length>6?` +${notInRoster.length-6}`:''} — no status, so no sampling target applies`, 'is-outlier')}
        </tbody>
      </table></div>` : `<div class="insight-box"><div class="ib-row"><span class="ib-dot"></span><span>
        Every name matches across the roster, the QA sheet and the production sheet, with no duplicates.
      </span></div></div>`}
    </div>

    <div class="section-title">Data Available</div>
    ${dataAvailabilityHTML()}`;
}

function comparisonDashboardHTML(){
  const has = baseHas();
  if(!has.qa && !has.prod){
    return `<div class="empty"><h2>No previous period loaded</h2>
      <p>Upload last month's data in the <b>Previous QA Sheet</b> and <b>Previous Production</b> slots above.
      This report then compares every measure — quality, volume, errors, rework, repeats, projects and people —
      between the two periods.</p></div>`;
  }
  const nowQA = scopeQA(), nowPR = scopeProd();
  const wasQA = BASE.qa||[],  wasPR = BASE.prod||[];
  const n = periodStats(nowQA, nowPR), b = periodStats(wasQA, wasPR);
  if(!has.qa){ ['audits','score','errors','fatal','clean','reworkClosure'].forEach(k=>b[k]=null); }
  if(!has.prod){ b.claims=null; b.attain=null; b.target=null; }
  if(!has.qa || !has.prod){ b.sampling=null; }

  const ri = rangeInfo();
  const kpi=(l,v,t,s2)=>`<div class="kpi ${t||''}"><div class="k-label">${esc(l)}</div>
    <div class="k-value">${v}</div><div class="k-sub">${esc(s2||'')}</div></div>`;
  const pf = v => v===null||v===undefined ? '—' : fmtPct(v);
  const nf = v => v===null||v===undefined ? '—' : v;

  /* ---------- people ---------- */
  const A = assocStats(nowQA, nowPR), B = assocStats(wasQA, wasPR);
  const allKeys = new Set([...A.keys(), ...B.keys()]);
  const people = [...allKeys].map(k=>{
    const a=A.get(k), z=B.get(k);
    const name = (a&&a.name) || (z&&z.name) || k;
    const dScore  = (a&&a.score!==null && z&&z.score!==null) ? +(a.score-z.score).toFixed(1) : null;
    const dAttain = (a&&a.attain!==null && z&&z.attain!==null) ? +(a.attain-z.attain).toFixed(1) : null;
    return {key:k, name, teamLead:(a&&a.teamLead)||(z&&z.teamLead)||teamLeadOf(k),
      now:a||null, was:z||null, dScore, dAttain,
      status: (a&&!z) ? 'new' : (!a&&z) ? 'gone' : 'both'};
  }).sort((x,y)=>{
    const rank=s=>s==='both'?0:s==='new'?1:2;
    return rank(x.status)-rank(y.status) || ((x.dScore??99)-(y.dScore??99));
  });
  const declined = people.filter(p=>p.dScore!==null && p.dScore<=-1);
  const improved = people.filter(p=>p.dScore!==null && p.dScore>=1);
  const joined   = people.filter(p=>p.status==='new');
  const left     = people.filter(p=>p.status==='gone');

  /* ---------- error categories ---------- */
  const catCount = rows => { const m=new Map();
    rows.forEach(r=>r.errors.forEach(e=>m.set(e.cat,(m.get(e.cat)||0)+1))); return m; };
  const cn = catCount(nowQA), cb = catCount(wasQA);
  const catKeys=[...new Set([...cn.keys(), ...cb.keys()])];
  const totN=[...cn.values()].reduce((a,c)=>a+c,0), totB=[...cb.values()].reduce((a,c)=>a+c,0);
  const cats = catKeys.map(k=>{
    const a=cn.get(k)||0, z=cb.get(k)||0;
    return {cat:k, now:a, was:z, d:a-z,
      shareNow: totN? pct(a,totN):0, shareWas: totB? pct(z,totB):0,
      status: z===0 ? 'new' : a===0 ? 'gone' : 'both'};
  }).sort((x,y)=>y.d-x.d);
  const grew = cats.filter(c=>c.d>0).slice(0,8);
  const shrank = cats.filter(c=>c.d<0).slice(-8).reverse();
  const newCats = cats.filter(c=>c.status==='new');
  const goneCats = cats.filter(c=>c.status==='gone');

  /* ---------- projects and practices ---------- */
  // Practice sits on the QA sheet but not on production, so practice-level
  // claims are apportioned from where each associate's audited work sat.
  const projStats = (qa, pr) => {
    const keys=[...new Set([...qa.map(r=>r.project), ...pr.map(p=>p.project)].filter(Boolean))];
    const m=new Map();
    keys.forEach(k=>{
      const rs=qa.filter(r=>r.project===k), ps=pr.filter(p=>p.project===k);
      const claims=ps.reduce((s,p)=>s+p.count,0), target=ps.reduce((s,p)=>s+targetForRow(p),0);
      // per-practice quality is exact; claims are shared out by audit mix
      const pracKeys=[...new Set(rs.map(r=>r.practice||'(unspecified)'))];
      const kids=pracKeys.map(pk=>{
        const prs=rs.filter(r=>(r.practice||'(unspecified)')===pk);
        const shareOfAudits = rs.length? prs.length/rs.length : 0;
        return {practice:pk, audits:prs.length,
          score: prs.length? avgScore(prs):null,
          errors: prs.reduce((s,r)=>s+r.errors.length,0),
          claims: Math.round(claims*shareOfAudits),
          apportioned:true};
      }).sort((a,b2)=>b2.audits-a.audits);
      m.set(k,{project:k, audits:rs.length, score: rs.length? avgScore(rs):null,
        errors:rs.reduce((s,r)=>s+r.errors.length,0), claims,
        attain: target>0? pct(claims,target):null,
        sampling: claims>0? pct(rs.length, claims):null, kids});
    });
    return m;
  };
  const pN = projStats(nowQA, nowPR), pB = projStats(wasQA, wasPR);
  const projKeys=[...new Set([...pN.keys(), ...pB.keys()])];

  /* ---------- team leads ---------- */
  const tlStats = (qa, pr) => {
    const m=new Map();
    const nameTL=new Map();
    qa.forEach(r=>{ if(r.nameKey && r.teamLead && !nameTL.has(r.nameKey)) nameTL.set(r.nameKey, r.teamLead); });
    const keys=[...new Set(qa.map(r=>r.teamLead).filter(Boolean))];
    keys.forEach(k=>{
      const rs=qa.filter(r=>r.teamLead===k);
      const names=new Set(rs.map(r=>r.nameKey));
      const ps=pr.filter(p=>names.has(p.nameKey));
      const claims=ps.reduce((s,p)=>s+p.count,0), target=ps.reduce((s,p)=>s+targetForRow(p),0);
      m.set(k,{tl:k, size:names.size, audits:rs.length, score:avgScore(rs),
        errors:rs.reduce((s,r)=>s+r.errors.length,0),
        claims, attain: target>0? pct(claims,target):null});
    });
    return m;
  };
  const tN = tlStats(nowQA, nowPR), tB = tlStats(wasQA, wasPR);
  const tlKeys=[...new Set([...tN.keys(), ...tB.keys()])];

  /* ---------- rework, feedback, repeats ---------- */
  const rwStats = rows => {
    const need=rows.filter(r=>rwYes(r.reworkNeeded));
    return {needed:need.length, done:need.filter(r=>rwYes(r.reworkComplete)).length,
      open:need.filter(r=>rwNo(r.reworkComplete)).length,
      closure: need.length? pct(need.filter(r=>rwYes(r.reworkComplete)).length, need.length):null};
  };
  const rN=rwStats(nowQA), rB=rwStats(wasQA);
  const fbStats = rows => {
    const errRows=rows.filter(r=>r.errors.length);
    return {errors:errRows.length,
      shared:errRows.filter(r=>fbShared(r.feedbackStatus)).length,
      share: errRows.length? pct(errRows.filter(r=>fbShared(r.feedbackStatus)).length, errRows.length):null};
  };
  const fN=fbStats(nowQA), fB=fbStats(wasQA);
  const repN=repeatErrorData(nowQA), repB=repeatErrorData(wasQA);

  /* ---------- auditors ---------- */
  const audStats = rows => {
    const m=new Map();
    groupBy(rows, r=>r.auditorName||'(unnamed)').forEach((rs,k)=>{
      m.set(k,{aud:k, audits:rs.length,
        detection: pct(rs.filter(r=>r.errors.length).length, rs.length),
        score: avgScore(rs), people:new Set(rs.map(r=>r.nameKey)).size});
    });
    return m;
  };
  const aN=audStats(nowQA), aB=audStats(wasQA);
  const audKeys=[...new Set([...aN.keys(), ...aB.keys()])];

  const row2 = (label, nv, bv, opts) => `<tr>
    <td><b>${esc(label)}</b></td>
    <td class="num">${(opts&&opts.pct)? pf(bv) : nf(bv)}</td>
    <td class="num">${(opts&&opts.pct)? pf(nv) : nf(nv)}</td>
    <td class="num">${cmpDelta(nv, bv, {lowerIsBetter:opts&&opts.lower, unit:(opts&&opts.pct)?' pts':''})}</td>
    ${cmpNoteCell('measure::'+label, 'Why did this move?')}
  </tr>`;

  return `
    <div class="banner ${declined.length?'bad':'good'}"><div>
      <div class="b-title">${esc(ri.label)} against the previous period${BASE.label?` (to ${esc(fmtD(BASE.label))})`:''}</div>
      ${declined.length
        ? `<b>${declined.length}</b> associate(s) scored lower than last period, <b>${improved.length}</b> higher.`
        : `No associate scored materially lower than last period.`}
      ${(!has.qa||!has.prod)?` Only the ${has.qa?'QA':'production'} half of the baseline was uploaded, so ${has.qa?'volume':'quality'} rows read as —.`:''}
    </div></div>

    ${(()=>{
      // previous → now with an explicit delta, grouped, so no one has to do the
      // subtraction or guess whether a move is good
      const card = (label, nv, bv, o) => {
        const opt = o||{};
        const fmtv = v => v===null||v===undefined ? '—' : (opt.pct? fmtPct(v) : v);
        let chip = '<span class="cmp-chip flat">no baseline</span>';
        if(nv!==null && nv!==undefined && bv!==null && bv!==undefined && !isNaN(nv) && !isNaN(bv)){
          const d=+(nv-bv).toFixed(1);
          if(Math.abs(d) < 0.05) chip = '<span class="cmp-chip flat">no change</span>';
          else {
            const better = opt.lower ? d<0 : d>0;
            chip = `<span class="cmp-chip ${better?'up':'down'}">${d>0?'&#9650;':'&#9660;'} ${Math.abs(d)}${opt.pct?' pts':''}</span>`;
          }
        }
        return `<div class="cmp-card">
          <div class="cmp-label">${esc(label)}</div>
          <div class="cmp-body">
            <span class="cmp-was">${fmtv(bv)}</span>
            <span class="cmp-arrow">&rarr;</span>
            <span class="cmp-now">${fmtv(nv)}</span>
            ${chip}
          </div></div>`;
      };
      return `
      <div class="cmp-group">Quality</div>
      <div class="cmp-row">
        ${card('QA Score', n.score, b.score, {pct:true})}
        ${card('Errors',   n.errors, b.errors, {lower:true})}

        <div class="cmp-card"><div class="cmp-body" style="gap:10px;">
          <span class="cmp-now" style="color:var(--bad);">${declined.length}</span>
          <span class="cmp-people">associate${declined.length===1?'':'s'}<br/>scored lower</span>

      <div class="col-legend" style="margin-top:14px;">
        <div class="cl-title">What these mean</div>
        <div class="cl-grid">
          <div><b>QA Score</b> — average audit score, weighted by audits.</div>
          <div><b>Errors</b> — total defects found across all audits.</div>
          <div><b>Attainment</b> — claims worked &divide; target. 100% = hit target.</div>
          <div><b>Claims Worked</b> — total claims in the production sheet.</div>
          <div><b>Scored lower / higher</b> — moved more than 1 point, counting only people present in both periods.</div>
          <div style="grid-column:1/-1;padding-top:4px;border-top:1px solid var(--border);">
            <b>Reading the arrows</b> — left is the previous period, right is now. Colour follows what is good for that measure:
            fewer errors is <span style="color:var(--good);font-weight:700;">green</span>, fewer claims is
            <span style="color:var(--bad);font-weight:700;">red</span>. <b>pts</b> means percentage points, not percent change.
          </div>
          <div style="grid-column:1/-1;"><b>Before comparing</b> — the two periods must cover similar spans. If one is a full month and the other two weeks, every count moves without anything having changed.</div>
        </div>
      </div>`;})()}

    <div class="section-title">By Team Lead &amp; Associate</div>
    <div class="card"><h3>Quality and Volume, Team by Team</h3>
      <div class="card-sub">Each team lead with their associates beneath · click a team to open it — open rows stay open when you print</div>
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Team Lead / Associate</th><th class="num">Size</th>
          <th class="num">Score Was</th><th class="num">Score Now</th><th class="num">Change</th>
          <th class="num">Errors Was</th><th class="num">Errors Now</th><th class="num">Repeats</th>
          <th class="num">Attain. Was</th><th class="num">Attain. Now</th><th>Verdict</th>
          <th>Reason for the change</th></tr></thead>
        <tbody>${(()=>{
          // group people under their team lead; a lead with no name still gets a row
          const byTL = new Map();
          people.forEach(p=>{
            const tl = p.teamLead || '(no team lead)';
            if(!byTL.has(tl)) byTL.set(tl, []);
            byTL.get(tl).push(p);
          });
          const wAvg = (arr, pick, weight) => {
            let num=0, den=0;
            arr.forEach(x=>{ const v=pick(x), wgt=weight(x);
              if(v!==null && v!==undefined && wgt) { num+=v*wgt; den+=wgt; } });
            return den? +(num/den).toFixed(1) : null;
          };
          const sum = (arr, pick) => arr.reduce((s2,x)=>s2+(pick(x)||0),0);
          const blocks=[...byTL.entries()].map(([tl, members])=>{
            const scoreWas = wAvg(members, m=>m.was&&m.was.score, m=>m.was&&m.was.audits);
            const scoreNow = wAvg(members, m=>m.now&&m.now.score, m=>m.now&&m.now.audits);
            const claimsWas= sum(members, m=>m.was&&m.was.claims);
            const targetWas= sum(members, m=>m.was&&m.was.target);
            const claimsNow= sum(members, m=>m.now&&m.now.claims);
            const targetNow= sum(members, m=>m.now&&m.now.target);
            members.sort((x,y)=>(x.dScore??99)-(y.dScore??99));
            return {tl, members,
              size: members.filter(m=>m.now).length,
              scoreWas, scoreNow,
              d: (scoreWas!==null&&scoreNow!==null)? +(scoreNow-scoreWas).toFixed(1) : null,
              errWas: sum(members, m=>m.was&&m.was.errors),
              errNow: sum(members, m=>m.now&&m.now.errors),
              repeats: sum(members, m=>m.now&&m.now.repeats),
              attainWas: targetWas>0? pct(claimsWas,targetWas):null,
              attainNow: targetNow>0? pct(claimsNow,targetNow):null};
          }).sort((a,b2)=>(a.d??99)-(b2.d??99));
          return blocks.map((blk,bi)=>{
            const v = cmpVerdict(blk.d,false,1);
            const head = `<tr class="row-parent tl-toggle ${v.label==='Declined'?'is-outlier':''}" data-tl="${bi}" style="cursor:pointer;">
              <td><span class="aud-caret" data-tlcaret="${bi}">&#9656;</span> <b>${esc(blk.tl)}</b></td>
              <td class="num">${blk.size}</td>
              <td class="num">${pf(blk.scoreWas)}</td>
              <td class="num">${pf(blk.scoreNow)}</td>
              <td class="num">${cmpDelta(blk.scoreNow, blk.scoreWas, {unit:' pts'})}</td>
              <td class="num">${blk.errWas}</td>
              <td class="num">${blk.errNow}</td>
              <td class="num">${blk.repeats? `<span class="tag ${blk.repeats>=3?'fatal':'major'}">${blk.repeats}</span>`:'0'}</td>
              <td class="num">${pf(blk.attainWas)}</td>
              <td class="num">${pf(blk.attainNow)}</td>
              <td><span class="tag ${v.tone}">${esc(v.label)}</span></td>
              ${cmpNoteCell('person::'+blk.tl+' (team)', 'Why did this team move?')}
            </tr>`;
            const kids = blk.members.map(p=>{
              const pv = p.status==='new' ? {label:'New this period', tone:'major'}
                       : p.status==='gone' ? {label:'Not in this period', tone:'major'}
                       : cmpVerdict(p.dScore, false, 1);
              return `<tr class="row-child tl-row" data-tl="${bi}" style="display:none;">
                <td><span class="child-mark">&#8226;</span>${esc(p.name)}</td>
                <td class="num">—</td>
                <td class="num">${p.was? pf(p.was.score):'—'}</td>
                <td class="num">${p.now? pf(p.now.score):'—'}</td>
                <td class="num">${cmpDelta(p.now&&p.now.score, p.was&&p.was.score, {unit:' pts'})}</td>
                <td class="num">${p.was? p.was.errors:'—'}</td>
                <td class="num">${p.now? p.now.errors:'—'}</td>
                <td class="num">${p.now&&p.now.repeats? p.now.repeats:'0'}</td>
                <td class="num">${p.was? pf(p.was.attain):'—'}</td>
                <td class="num">${p.now? pf(p.now.attain):'—'}</td>
                <td><span class="tag ${pv.tone}">${esc(pv.label)}</span></td>
                ${cmpNoteCell('person::'+p.name, 'Why did they move?')}
              </tr>`;}).join('');
            return head + kids;
          }).join('');
        })()}</tbody>
      </table></div>
      <div class="col-legend">
        <div class="cl-title">What each column means</div>
        <div class="cl-grid">
          <div><b>Score was / now</b> average QA score, previous period and this one</div>
          <div><b>Change</b> score now minus score was, in points</div>
          <div><b>Attain. was / now</b> claims worked &divide; target, each period. 100% = hit target</div>
          <div><b>Repeats</b> an error category that came back for the same person in a later week</div>
          <div style="grid-column:1/-1;"><b>Verdict</b>
            <span style="color:var(--bad);font-weight:700;">Declined</span>: down more than 1 point &nbsp;·&nbsp;
            <span style="color:var(--good);font-weight:700;">Improved</span>: up more than 1 point &nbsp;·&nbsp;
            <b>Flat</b>: within 1 point either way</div>
          <div style="grid-column:1/-1;"><b>New / Not in this period</b> the person is in only one of the two files, so no change can be shown</div>
        </div>

    <div class="section-title">By Auditor</div>
    <div class="card"><h3>Auditor Movement</h3>
      <div class="card-sub">Volume, detection rate and the average score each auditor gave</div>
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Auditor</th>
          <th class="num">Audits Was</th><th class="num">Audits Now</th>
          <th class="num">Detection Was</th><th class="num">Detection Now</th><th class="num">Change</th>
          <th class="num">Avg Score Given Was</th><th class="num">Avg Score Given Now</th></tr></thead>
        <tbody>${audKeys.map(k=>{
          const a=aN.get(k), z=aB.get(k);
          return `<tr>
            <td><b>${esc(k)}</b></td>
            <td class="num">${z? z.audits:'—'}</td>
