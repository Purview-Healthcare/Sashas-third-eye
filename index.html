const THRESHOLD_FIELDS = [
  {k:'qa',      label:'QA score minimum',        val:()=>OUTLIER_THRESHOLD,    min:50, max:100,
   help:'An associate below this is flagged. Used across every report.'},
  {k:'weeks',   label:'Weeks before outlier',    val:()=>OUTLIER_CONSEC_WEEKS, min:1,  max:8,
   help:'Consecutive weeks below the minimum before someone counts as an outlier.'},
  {k:'pareto',  label:'Pareto cut %',            val:()=>PARETO_CUT,           min:50, max:95,
   help:'The share of errors that defines the vital few worth an RCA.'},
  {k:'prod',    label:'Production attainment %', val:()=>PROD_MIN_ATTAIN,      min:50, max:100,
   help:'Minimum share of target a biller is expected to reach.'},
  {k:'fresher', label:'Fresher cutoff (months)', val:()=>FRESHER_MONTHS,       min:1,  max:24,
   help:'Tenure below this counts as a fresher when the roster has no Fresher column.'}
];
function settingsCardHTML(){
  return `<div class="card settings-card"><h3>Thresholds</h3>
    <div class="card-sub">What the reports judge against. Change a figure and every report recalculates.</div>
    <div class="tgt-grid">
      ${THRESHOLD_FIELDS.map(f=>`<label class="tgt-f" style="min-width:186px;">
        <span class="tgt-lbl">${esc(f.label)}</span>
        <input type="number" min="${f.min}" max="${f.max}" step="1" data-th="${f.k}" value="${f.val()}" />

document.addEventListener('change', async e=>{
  const f=e.target.closest('[data-th]');
  if(!f) return;
  const v=parseFloat(f.value);
  const spec=THRESHOLD_FIELDS.find(x=>x.k===f.dataset.th);
  if(!isFinite(v) || v<spec.min || v>spec.max){ f.value=spec.val(); toast(`${spec.label} must be between ${spec.min} and ${spec.max}.`, true); return; }
  if(f.dataset.th==='qa')      OUTLIER_THRESHOLD=v;
  if(f.dataset.th==='weeks')   OUTLIER_CONSEC_WEEKS=v;
  if(f.dataset.th==='pareto')  PARETO_CUT=v;
  if(f.dataset.th==='prod')    PROD_MIN_ATTAIN=v;
  if(f.dataset.th==='fresher') FRESHER_MONTHS=v;
  await sset(K.thresholds, {qa:OUTLIER_THRESHOLD, weeks:OUTLIER_CONSEC_WEEKS,
    pareto:PARETO_CUT, prod:PROD_MIN_ATTAIN, fresher:FRESHER_MONTHS});
  render();
});

function buildGroupRows(rows, keyFn, prodKeyFn){
  const g = groupBy(rows, keyFn);
  const prodAll = scopeProd();
  const out=[];
  for(const [k, rs] of g){
    const pr = prodKeyFn ? prodAll.filter(p=>prodKeyFn(p)===k) : null;
    out.push({key:k, ...statBlock(rs, pr)});
  }
  return out.sort((a,b)=>a.score-b.score);
}
function numlist(items){
  const rowsN = Math.ceil(items.length/2);
  return `<div class="numlist" style="grid-template-rows:repeat(${rowsN},auto);">${
    items.map((t,i)=>`<div class="numlist-item"><span class="numlist-n">${i+1})</span><span>${t}</span></div>`).join('')}</div>`;
}

function scoreCardsHTML(rows){
  const g = groupBy(rows, r=>r.project);
  const prodAll = scopeProd();
  const tiles=[];
  for(const [proj,rs] of g){
    if(proj==='(blank)') continue;
    const st = statBlock(rs, prodAll.filter(p=>p.project===proj));
    const practices = new Set(rs.map(r=>r.practice).filter(Boolean)).size;
    tiles.push({key:proj, ...st, practices});
  }
  if(!tiles.length) return '';
  tiles.sort((a,b)=>a.score-b.score);
  return `<div class="score-tiles">${tiles.map(x=>`
    <div class="score-tile ${x.score>=OUTLIER_THRESHOLD?'ok':'low'}">
      <div class="st-kind">Project</div>
      <div class="st-name" title="${esc(x.key)}">${esc(x.key)}</div>
      <div class="st-score">${fmtPct(x.score)}</div>
      <div class="st-meta">${x.practices} practice${x.practices!==1?'s':''} · ${x.audits} audit${x.audits!==1?'s':''} · ${x.errors} error${x.errors!==1?'s':''}</div>
    </div>`).join('')}</div>`;
}

// Project is the parent entity; Practice rows are nested beneath their project.

// Production rows carry no Practice, so a practice's production is attributed from
// where that associate's audited work sat that day; a day audited in two practices
// is split in proportion to the audits. Practices then sum exactly to their project.

// The two sheets rarely spell a practice the same way — "Reklame" in production
// against "Reklame Health" in the QA sheet. An exact match is tried first, then
// one name being the start of the other, so production is not silently lost.
function practiceLookup(map, name){
  if(!map || !map.size) return 0;
  const want=String(name||'').trim();
  if(map.has(want)) return map.get(want);
  const norm=s2=>String(s2||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const w=norm(want);
  if(!w) return 0;
  let hit=0;
  map.forEach((v,k)=>{ if(norm(k)===w) hit=v; });
  if(hit) return hit;
  map.forEach((v,k)=>{ const n=norm(k);
    if(!hit && n && (n.startsWith(w) || w.startsWith(n))) hit=v; });
  return hit;
}
function prodByPractice(projRows, prodRows){
  // If the production sheet names the practice itself, use it — apportioning
  // from the audit mix was only ever a fallback, and it silently gives a
  // practice zero production when that biller has no audit on the same day.
  const direct = prodRows.filter(p=>p.practice);
  if(direct.length){
    const out=new Map();
    direct.forEach(p=>{ const k=p.practice||'(no practice)';
      out.set(k,(out.get(k)||0)+p.count); });
    return out;
  }
  const dayPrac = new Map();  // name||day -> Map(practice -> audit count)
  for(const r of projRows){
    if(!r.dateWorked) continue;
    const k=r.nameKey+'||'+r.dateWorked;
    if(!dayPrac.has(k)) dayPrac.set(k,new Map());
    const m=dayPrac.get(k);
    const pr=r.practice||'(no practice)';
    m.set(pr,(m.get(pr)||0)+1);
  }
  const out=new Map();
  for(const p of prodRows){
    const k=p.nameKey+'||'+p.dateKey;
    const m=dayPrac.get(k);
    if(!m){continue;}
    const tot=[...m.values()].reduce((a,b)=>a+b,0);
    for(const [prac,c] of m) out.set(prac,(out.get(prac)||0)+p.count*c/tot);
  }
  return out;   // practice -> production (fractional shares rounded at display)
}
function projectPracticeTableHTML(rows){
  const prodAll = scopeProd();

  for(const [proj, prs] of byProj){

    const byPrac = groupBy(prs, r=>r.practice);
    const pracProd = prodByPractice(prs, prodAll.filter(p=>p.project===proj || !p.project));
    const kids=[];
    for(const [prac, rs] of byPrac){
      const st = statBlock(rs, null);
      const production = Math.round(practiceLookup(pracProd, prac||'(no practice)'));
      kids.push({key:prac, ...st, production,

    }
    kids.sort((a,b)=>a.score-b.score);
    blocks.push({proj, pst, kids});

// How many times an associate hit an error category they had already been flagged
// for in an earlier week. Feedback is not considered here — this is raw recurrence.
function repeatCountByAssociate(rows){
  const seq = rows.filter(r=>r.dateWorked).slice().sort((a,b)=>(a.dwT||0)-(b.dwT||0));
  const firstWeek = new Map();   // nameKey||cat -> week label
  const out = new Map();
  for(const r of seq){
    const wk = weekLabel(r.week);
    for(const e of r.errors){
      const k = r.nameKey+'||'+e.cat;
      if(!firstWeek.has(k)){ firstWeek.set(k, wk); continue; }
      if(firstWeek.get(k) === wk) continue;      // same week is not a repeat
      out.set(r.nameKey, (out.get(r.nameKey)||0)+1);
    }
  }
  return out;
}

/* ============================ PARETO ============================ */
function paretoData(rows, keyFn, parentFn, allKeys){
  const m=new Map();
  // seed every known category so ones with no errors this range still appear as 0
  if(allKeys) for(const k of allKeys){
    if(k) m.set(k,{key:k, count:0, parents:new Map(), people:new Map(), leads:new Map()});
  }
  for(const r of rows) for(const e of r.errors){
    const k = keyFn(e);
    if(!k) continue;
    if(!m.has(k)) m.set(k,{key:k, count:0, parents:new Map(), people:new Map(), leads:new Map()});
    const x=m.get(k);
    x.count++;
    if(parentFn){ const pv=parentFn(e); if(pv) x.parents.set(pv,(x.parents.get(pv)||0)+1); }
    x.people.set(r.name,(x.people.get(r.name)||0)+1);
    if(r.teamLead) x.leads.set(r.teamLead,(x.leads.get(r.teamLead)||0)+1);
  }
  const arr=[...m.values()].sort((a,b)=> b.count-a.count || a.key.localeCompare(b.key));
  const total=arr.reduce((s,x)=>s+x.count,0);
  let run=0;
  arr.forEach((x,i)=>{
    x.share=pct(x.count,total); run+=x.count; x.cum=pct(run,total); x.rank=i+1;
    x.parent = x.parents.size ? [...x.parents.entries()].sort((a,b)=>b[1]-a[1])[0][0] : '';
    x.topPeople = [...x.people.entries()].sort((a,b)=>b[1]-a[1]);
    x.topLeads  = [...x.leads.entries()].sort((a,b)=>b[1]-a[1]);
  });
  let vi=arr.findIndex(x=>x.cum>=PARETO_CUT);
  if(vi===-1) vi=arr.length-1;
  arr.forEach((x,i)=>x.vital = i<=vi && x.count>0);
  return {arr, total, vitalCount:vi+1};
}
function truncLabel(t,max){ t=String(t??''); return t.length>max ? t.slice(0,max-1)+'…' : t; }
function keyOf(e,label){ return /type/i.test(label) ? e.pillar : e.cat; }
function paretoChartSVG(arr, total){
  const n=arr.length;
  // widen the canvas when there are many categories so labels never collide
  const W=Math.max(980, 62*n + 130), H=460;
  const padL=56, padR=58, padT=44;
  const nameChars = n>16 ? 16 : n>11 ? 20 : 24;
  const nameSize  = n>16 ? 9.5 : n>11 ? 10 : 11;
  const padB=132;
  const iw=W-padL-padR, ih=H-padT-padB;
  const maxC=Math.max(...arr.map(x=>x.count),1);
  const niceMax=Math.max(2, Math.ceil(maxC*1.15));      // headroom so labels never hit the top
  const step=iw/n;
  const bw=Math.min(72, step*0.6);
  const xC=i=>padL + step*i + step/2;
  const yB=v=>padT + ih - (v/niceMax)*ih;
  const yP=v=>padT + ih - (v/100)*ih;
  const halo='paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round;';

  // left-axis gridlines at nice count intervals
  const stepC = niceMax<=5?1: niceMax<=10?2: niceMax<=25?5: Math.ceil(niceMax/5);
  let grid='';
  for(let v=0; v<=niceMax; v+=stepC){
    grid+=`<line x1="${padL}" y1="${yB(v).toFixed(1)}" x2="${padL+iw}" y2="${yB(v).toFixed(1)}"
      stroke="var(--border-soft)" stroke-width="1"/>
    <text x="${padL-9}" y="${(yB(v)+3.5).toFixed(1)}" font-size="10.5" text-anchor="end"
      fill="var(--text-faint)">${v}</text>`;
  }
  // right axis ticks
  const rTicks=[0,25,50,75,100].map(v=>`
    <text x="${padL+iw+9}" y="${(yP(v)+3.5).toFixed(1)}" font-size="10.5" fill="var(--text-faint)">${v}%</text>`).join('');

  const bars=arr.map((x,i)=>{
    if(x.count===0){
      // no errors this range — show a flat stub on the baseline so the category is still visible
      return `
      <rect x="${(xC(i)-bw/2).toFixed(1)}" y="${(padT+ih-3).toFixed(1)}" width="${bw.toFixed(1)}"
        height="3" rx="1.5" fill="#DCE4EC"><title>${esc(x.key)} — no errors in this range</title></rect>
      <text x="${xC(i).toFixed(1)}" y="${(padT+ih-9).toFixed(1)}" font-size="10.5" font-weight="700"
        text-anchor="middle" fill="var(--good)">0</text>
      <text x="${xC(i).toFixed(1)}" y="${(padT+ih+14).toFixed(1)}" font-size="${nameSize}"
        fill="var(--text-faint)" text-anchor="end"
        transform="rotate(-38 ${xC(i).toFixed(1)} ${(padT+ih+14).toFixed(1)})"
        >${esc(truncLabel(x.key,nameChars))}<title>${esc(x.key)}</title></text>`;
    }
    const top=yB(x.count), barH=padT+ih-top;
    const inBar = barH>=26;
    const cLabel = inBar
      ? `<text x="${xC(i).toFixed(1)}" y="${(top+16).toFixed(1)}" font-size="12" font-weight="700"
           text-anchor="middle" fill="#ffffff">${x.count}</text>`
      : `<text x="${xC(i).toFixed(1)}" y="${(top-6).toFixed(1)}" font-size="12" font-weight="700"
           text-anchor="middle" fill="var(--navy)" style="${halo}">${x.count}</text>`;
    // category name under the bar, angled so long names fit
    const nm = truncLabel(x.key, nameChars);
    return `
    <rect x="${(xC(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${barH.toFixed(1)}" rx="3" fill="${x.vital?'var(--accent)':'#B7C8D9'}">
      <title>${esc(x.key)} — ${x.count} errors (${fmtPct(x.share)}) · cumulative ${fmtPct(x.cum)}</title></rect>
    ${cLabel}
    <text x="${xC(i).toFixed(1)}" y="${(padT+ih+14).toFixed(1)}" font-size="${nameSize}"
      fill="${x.count?'var(--text-dim)':'var(--text-faint)'}"
      text-anchor="end" transform="rotate(-38 ${xC(i).toFixed(1)} ${(padT+ih+14).toFixed(1)})"
      >${esc(nm)}<title>${esc(x.key)}</title></text>`;
  }).join('');

  const withErr = arr.map((x,i)=>({x,i})).filter(o=>o.x.count>0);
  const pts=withErr.map(o=>`${xC(o.i).toFixed(1)},${yP(o.x.cum).toFixed(1)}`).join(' ');
  // cumulative labels: above the marker, haloed; flip below when close to the top edge
  const dots=withErr.map(({x,i})=>{
    const cy=yP(x.cum);
    const below = cy < padT+18;
    const ly = below ? cy+16 : cy-9;
    return `
    <circle cx="${xC(i).toFixed(1)}" cy="${cy.toFixed(1)}" r="3.8" fill="var(--navy)" stroke="#fff" stroke-width="1.4"/>
    <text x="${xC(i).toFixed(1)}" y="${ly.toFixed(1)}" font-size="10.5" font-weight="700" text-anchor="middle"
      fill="var(--navy)" style="${halo}">${Math.round(x.cum)}%</text>`;
  }).join('');

  // only the vital few are plotted, so there is no long-tail swatch to explain
  const legend=`
    <rect x="${padL}" y="12" width="12" height="12" rx="2" fill="var(--accent)"/>
    <text x="${padL+18}" y="22" font-size="11.5" fill="var(--text-dim)">Errors (count)</text>
    <line x1="${padL+118}" y1="18" x2="${padL+148}" y2="18" stroke="var(--navy)" stroke-width="2"/>
    <circle cx="${padL+133}" cy="18" r="3.4" fill="var(--navy)" stroke="#fff" stroke-width="1.2"/>
    <text x="${padL+154}" y="22" font-size="11.5" fill="var(--text-dim)">Cumulative %</text>
    <line x1="${padL+268}" y1="18" x2="${padL+298}" y2="18" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="${padL+304}" y="22" font-size="11.5" fill="var(--text-dim)">80% threshold</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" class="pareto-svg">
    ${legend}
    ${grid}
    ${rTicks}
    <line x1="${padL}" y1="${yP(80).toFixed(1)}" x2="${padL+iw}" y2="${yP(80).toFixed(1)}"
      stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="7 5"/>
    ${bars}
    <polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2.2"/>
    ${dots}
    <line x1="${padL}" y1="${padT+ih}" x2="${padL+iw}" y2="${padT+ih}" stroke="var(--border)" stroke-width="1"/>
  </svg>`;
}
function paretoBlock(rows, keyFn, parentFn, title, sub, keyLabel, parentLabel, allKeys){
  const {arr,total,vitalCount} = paretoData(rows, keyFn, parentFn, allKeys);
  if(!arr.length) return `<div class="card"><h3>${esc(title)}</h3>
    <div class="card-sub">No errors recorded in this range, so there is nothing to rank.</div></div>`;
  // Only the vital few are charted — the long tail is deliberately left out.
  const vital = arr.filter(x=>x.vital);
  if(!vital.length) return `<div class="card"><h3>${esc(title)}</h3>
    <div class="card-sub">No errors recorded in this range, so there is nothing to rank.</div></div>`;
  const vitalShare = vital.reduce((s,x)=>s+x.count,0);
  const tailCount  = arr.length - vital.length;
  const tailErrors = total - vitalShare;

  // Contributors behind the vital few, themselves cut at 80% — the handful of
  // people who account for most of it, not everyone who touched it once.
  const contrib = new Map();
  vital.forEach(x=>x.topPeople.forEach(([nm,c])=>contrib.set(nm,(contrib.get(nm)||0)+c)));
  const ranked=[...contrib.entries()].sort((a,b)=>b[1]-a[1]);
  const contribTotal = ranked.reduce((s,x)=>s+x[1],0);
  const keyPeople=[]; let run=0;
  for(const [nm,c] of ranked){
    keyPeople.push([nm,c]); run+=c;
    if(pct(run, contribTotal||1) >= 80) break;
  }
  const restPeople = ranked.length - keyPeople.length;
  const contribLine = keyPeople.length
    ? `<div class="contrib-line"><b>Top-80% contributors:</b> ${keyPeople.map(([nm,c])=>`${esc(nm)} (${c})`).join(' · ')}
        <span style="color:var(--text-faint);">— ${keyPeople.length} ${plural('person',keyPeople.length)} behind ${fmtPct(pct(run,contribTotal||1))} of the vital-few errors${restPeople>0?`; ${restPeople} other${restPeople!==1?'s':''} contributed the rest`:''}</span></div>`
    : '';
  return `<div class="card"><h3>${esc(title)}</h3>
    <div class="card-sub">${esc(sub)}</div>
    <div class="pareto-wrap">${paretoChartSVG(vital,total)}</div>
    ${contribLine}
    <div class="insight-box">
      <div class="ib-title">Insights — the vital few</div>
      ${paretoInsights(vital,total,vital.length,vitalShare,keyLabel,parentLabel,rows,tailCount,tailErrors).map(t=>
        `<div class="ib-row"><span class="ib-dot"></span><span>${t}</span></div>`).join('')}
    </div></div>`;
}
const IRREGULAR_PLURALS = {person:'people', analysis:'analyses'};
function plural(word,n){
  if(n===1) return word;
  const low=String(word).toLowerCase();
  if(IRREGULAR_PLURALS[low]) return IRREGULAR_PLURALS[low];
  return /y$/i.test(word) ? word.replace(/y$/i,'ies') : word+'s';
}
function paretoInsights(arr,total,vitalCount,vitalShare,label,parentLabel,rows,tailCount,tailErrors){
  const out=[];
  const lc = label.toLowerCase();
  const vital = arr;   // already scoped to the vital few by the caller

  out.push(`These <b>${vitalCount}</b> ${plural(lc,vitalCount)} drive <b>${fmtPct(pct(vitalShare,total))}</b> of all ${total} errors — fix these first and most of the defect volume goes with them.`);

  // systemic vs individual — the actionable distinction
  const top=arr[0];
  if(top){
    const topPerson=top.topPeople[0];
    const conc = topPerson ? pct(topPerson[1], top.count) : 0;
    if(conc>=50){
      out.push(`<b>${esc(top.key)}</b> is the largest ${lc} (${fmtPct(top.share)}), and <b>${esc(topPerson[0])}</b> alone accounts for ${fmtPct(conc)} of it — treat this as an <b>individual coaching</b> item, not a process gap.`);
    } else if(top.topPeople.length>=3){
      out.push(`<b>${esc(top.key)}</b> is the largest ${lc} (${fmtPct(top.share)}) and is spread across <b>${top.topPeople.length} associates</b> — that pattern points to a <b>process or training gap</b>, so a group refresher will beat one-on-one coaching.`);
    }
  }

  // team-lead concentration
  const leadMap=new Map();
  vital.forEach(x=>x.topLeads.forEach(([l,c])=>leadMap.set(l,(leadMap.get(l)||0)+c)));
  const leads=[...leadMap.entries()].sort((a,b)=>b[1]-a[1]);
  if(leads.length>1 && pct(leads[0][1],vitalShare)>=55){
    out.push(`${fmtPct(pct(leads[0][1],vitalShare))} of the vital-few errors sit under <b>${esc(leads[0][0])}</b>'s team — worth reviewing how that team is briefed before rolling anything out floor-wide.`);
  }

  // what to actually do about the top item
  if(top){
    // score impact = weightage this category removed, spread over audited claims
    let wsum=0;
    for(const r of rows) for(const e of r.errors) if(keyOf(e,label)===top.key) wsum+=e.weight;
    const lift = rows.length ? (wsum/rows.length)*100 : 0;
    const claimsHit = rows.filter(r=>r.errors.some(e=>keyOf(e,label)===top.key)).length;
    out.push(`Start with <b>${esc(top.key)}</b>${top.parent?` (${esc(parentLabel)}: ${esc(top.parent)})`:''} — it touches <b>${claimsHit}</b> of ${rows.length} audited ${plural('claim',rows.length)}${lift>0?`, and clearing it would lift the overall QA score by about <b>${fmtPct(lift)}</b>`:''}.`);
  }

  if(tailCount>0) out.push(`<b>${tailCount}</b> further ${plural(lc,tailCount)} ${tailCount===1?'accounts':'account'} for the remaining ${tailErrors} errors (${fmtPct(100-pct(vitalShare,total))}) and are not charted — park them until the vital few are under control.`);
  return out;
}
function paretoHTML(rows){
  // every category defined in the Error Parameters sheet, so zero-error ones still show
  const allCats=[...new Set(PARAMS.map(p=>p.cat).filter(Boolean))];
  return paretoBlock(rows, e=>e.cat, e=>e.pillar, 'Pareto — Error Category',
    'Only the vital few — the categories that together drive the first 80% of all errors',
    'Error Category', 'Error Type', allCats);
}



/* ============================ ERROR TYPE — RANKED BARS ============================ */
function errorTypeBarsHTML(rows){
  const m=new Map();
  // seed every known error type so clean ones still show as 0
  const known=[...new Set([...PILLARS, ...PARAMS.map(p=>p.type)].filter(Boolean))];
  known.forEach(t=>m.set(t,0));
  for(const r of rows) for(const e of r.errors){
    if(!e.pillar) continue;
    m.set(e.pillar,(m.get(e.pillar)||0)+1);
  }
  const arr=[...m.entries()].map(([key,count])=>({key,count}))
    .sort((a,b)=> b.count-a.count || a.key.localeCompare(b.key));
  const total=arr.reduce((s,x)=>s+x.count,0);
  if(!arr.length) return '';
  const max=Math.max(...arr.map(x=>x.count),1);
  const clean=arr.filter(x=>x.count===0).length;
  return `<div class="card"><h3>Errors by Error Type</h3>
    <div class="card-sub">All ${arr.length} error types ranked by volume · ${clean} with no errors in this range ·
      these are <b>defects</b>, and they total ${total} — one claim can carry several, so this will never equal a claim count</div>
    ${(()=>{
      // the one-column-per-type layout cannot hold two errors of the same type,
      // so a sheet can declare more defects than its type columns identify
      const gap = rows.reduce((s2,r)=>s2 + Math.max(0,(r.sheetCount||0) - r.errors.length), 0);
      const nrows = rows.filter(r=>(r.sheetCount||0) > r.errors.length).length;
      if(!gap) return '';
      return `<div class="data-note">
        <b>${nrows} row(s) declare ${gap} more defect(s) than the type columns identify.</b>
        The Audit Data tab holds one category per error type, so two errors of the same type on one claim
        cannot both be recorded — the count columns catch them, the type columns cannot.
        Every breakdown here uses the <b>identified</b> errors (${total}), so the figures reconcile with each other.
        To close the gap, split those claims across rows or widen the sheet.
      </div>`;})()}
    <div class="etype-grid">
      ${arr.map(x=>`
        <div class="et-name ${x.count?'':'is-clean'}">${esc(x.key)}</div>
        <div class="et-track">${x.count?`<div class="et-fill" style="width:${Math.max(2,x.count/max*100).toFixed(1)}%;"></div>`:''}</div>
        <div class="et-val">${x.count
          ? `<b>${x.count}</b> <span class="et-pct">· ${fmtPct(pct(x.count,total))}</span>`
          : `<span class="et-clean">0 · clean</span>`}</div>`).join('')}
    </div>
    <div class="et-foot">${total} error${total!==1?'s':''} across ${rows.length} audited ${plural('claim',rows.length)}</div>
  </div>`;
}

/* ============================ RECOMMENDED ACTIONS ============================ */
function recommendedActionsHTML(rows){
  const acts=[];
  const g = groupBy(rows, r=>r.nameKey);
  const prodAll = scopeProd();
  const people=[];
  for(const [nk,rs] of g){
    const st=statBlock(rs, prodAll.filter(p=>p.nameKey===nk));
    people.push({nk, name:rs[0].name, tl:rs[0].teamLead, roster:rosterFor(nk), oi:outlierInfo(nk), ...st});
  }
  if(!people.length) return '';
  const strong = people.filter(p=>p.score>=98 && p.audits>=3).sort((a,b)=>b.score-a.score);
  const buddyFor = p => {
    const sameTeam = strong.filter(s=>s.tl===p.tl && s.nk!==p.nk);
    const pick2 = (sameTeam[0] || strong.find(s=>s.nk!==p.nk));
    return pick2 ? pick2.name : null;
  };

  // 1. Confirmed outliers
  people.filter(p=>p.oi.isOutlier).forEach(p=>{
    const onPip = p.roster && /PIP|QIP/i.test(p.roster.status);
    acts.push({pri:1, who:p.name,
      title: onPip ? `${p.name} — already on PIP/QIP, review progress` : `${p.name} — move to QIP/PIP`,
      body: `Scored under ${OUTLIER_THRESHOLD}% for ${p.oi.maxRun} consecutive weeks (${p.oi.streak.map(w=>w.label+' '+fmtPct(w.score)).join(', ')}). ` +
            (onPip ? `They are already flagged as "${p.roster.status}" — check whether the current plan is working, since the scores have not recovered.`
                   : `Formalise the plan this week; the trend is established, not a one-off dip.`)});
  });

  // 2. At risk — one week from becoming an outlier: buddy up BEFORE the flag
  people.filter(p=>!p.oi.isOutlier && p.oi.currentRun>0).forEach(p=>{
    const b = buddyFor(p);
    acts.push({pri:2, who:p.name,
      title: `${p.name} — buddy up now to avoid PIP`,
      body: `Below ${OUTLIER_THRESHOLD}% for ${p.oi.currentRun} week${p.oi.currentRun!==1?'s':''} (latest ${fmtPct(p.oi.weeks[p.oi.weeks.length-1].score)}). ` +
            `One more week under threshold makes this a formal outlier. ` +
            (b ? `Pair them with <b>${esc(b)}</b> for shadowing this week and re-audit before the week closes — a save now avoids the paperwork entirely.`
               : `Assign shadowing with a consistent performer this week and re-audit before the week closes.`)});
  });

  // 3. Fatal errors — highest weightage, immediate review
  people.filter(p=>p.fatal>0).sort((a,b)=>b.fatal-a.fatal).slice(0,5).forEach(p=>{
    acts.push({pri:3, who:p.name,
      title: `${p.name} — review ${p.fatal} fatal error${p.fatal!==1?'s':''}`,
      body: `Fatal errors carry the heaviest deduction, so these cost the most score per occurrence. ` +
            `Walk through each claim with them individually rather than in a group session.`});
  });

  // 4. Sampling coverage gaps
  const lowSample = people.filter(p=>p.sampling!==null && p.sampling<5 && p.production>0)
    .sort((a,b)=>a.sampling-b.sampling);
  if(lowSample.length){
    acts.push({pri:4, who:'Audit coverage',
      title: `Increase audit coverage for ${lowSample.length} associate${lowSample.length!==1?'s':''}`,
      body: `Sampling below 5%: ${lowSample.slice(0,5).map(p=>`${esc(p.name)} (${fmtPct(p.sampling)})`).join(', ')}` +
            `${lowSample.length>5?` +${lowSample.length-5} more`:''}. ` +
            `Scores from a thin sample are not reliable enough to act on — raise coverage before drawing conclusions about them.`});
  }
  const noProd = people.filter(p=>p.sampling===null).length;
  if(noProd===people.length && PROD.length===0){
    acts.push({pri:5, who:'Data', title:'Upload a Production Sheet to unlock sampling %',
      body:`Without production volumes there is no way to tell whether a high score reflects real quality or just a small sample.`});
  }

  // 5. Recognise consistent performers — reinforcement, and your buddy pool
  if(strong.length){
    acts.push({pri:6, who:'Recognition',
      title:`${strong.length} consistent performer${strong.length!==1?'s':''} to recognise and use as buddies`,
      body:`${strong.slice(0,5).map(p=>`<b>${esc(p.name)}</b> (${fmtPct(p.score)})`).join(', ')}` +
           `${strong.length>5?` +${strong.length-5} more`:''} ${strong.length===1?'is':'are'} at or above 98%. ` +
           `Call this out in the next huddle and use them as the shadowing pool for the at-risk names above.`});
  }

  // 6. Practice-level signal
  const byPrac = buildGroupRows(rows, r=>r.practice).filter(x=>x.key!=='(blank)' && x.score<OUTLIER_THRESHOLD);
  byPrac.forEach(x=>{
    acts.push({pri:7, who:x.key,
      title:`${x.key} practice is below ${OUTLIER_THRESHOLD}%`,
      body:`Practice-wide score ${fmtPct(x.score)} across ${x.audits} audit${x.audits!==1?'s':''}. ` +
           `When a whole practice sits under threshold the cause is usually payer rules or an SOP gap rather than individual performance — review the practice SOP before coaching individuals.`});
  });

  if(!acts.length) return `<div class="card"><h3>Recommended Actions</h3>
    <div class="card-sub">Nothing needs intervention in this range — no outliers, no at-risk associates, no fatal errors.</div></div>`;
  acts.sort((a,b)=>a.pri-b.pri);
  const badge = p => p<=1?'<span class="tag outlier">Urgent</span>'
    : p<=2?'<span class="tag major">This week</span>'
    : p<=3?'<span class="tag fatal">Review</span>'
    : p<=5?'<span class="tag nonfatal">Process</span>' : '<span class="tag clear">Positive</span>';
  return `<div class="card"><h3>Recommended Actions</h3>
    <div class="card-sub">Prioritised, named next steps generated from this range — urgent first</div>
    <div class="action-list">${acts.map((a,i)=>`
      <div class="action-row">
        <div class="ar-num">${i+1}</div>
        <div class="ar-body">
          <div class="ar-title">${esc(a.title)} ${badge(a.pri)}</div>
          <div class="ar-text">${a.body}</div>
        </div>
      </div>`).join('')}</div></div>`;
}


/* ============================ RCA & MITIGATION ============================ */
const RCA_STATUS = ['Not started','Started','In progress','Implemented','Need help from supervisor','Other'];
const RCA_WHY = ['Knowledge gap','Process / SOP gap','System or tool limitation',
  'Payer / client rule change','Volume or time pressure','Unclear instruction','Other'];

function rcaKeyFor(cat){ return `${CLIENT}||${PRACTICE}||${cat}`; }
// Typing fires many saves; the storage API rejects rapid writes with a 500.
// Single-flight with coalescing + backoff retry, and never spam the console.
let RCA_SAVING=false, RCA_DIRTY=false, RCA_WARNED=false;
async function saveRCA(){
  if(RCA_SAVING){ RCA_DIRTY=true; return; }
  RCA_SAVING=true;
  let ok=false;
  for(let attempt=0; attempt<3 && !ok; attempt++){
    if(attempt) await new Promise(r=>setTimeout(r, 400*Math.pow(2,attempt)));
    ok = await ssetQuiet(K.rca, RCA);
  }
  RCA_SAVING=false;
  if(!ok && !RCA_WARNED){
    RCA_WARNED=true;
    toast('Saving is being throttled — your text is kept on screen and will save shortly.', true);
  }
  if(ok) RCA_WARNED=false;
  if(RCA_DIRTY){ RCA_DIRTY=false; setTimeout(saveRCA, 400); }
}
async function ssetQuiet(k,v){ return sset(k,v); }   // sset already retries quietly


// Once a plan is marked Implemented we stamp the date, so the category's error
// rate before and after that date is a fair before/after read.
function rcaTrendCell(cat, entry){
  const e = entry || {};
  if(e.status!=='Implemented' || !e.implementedAt)
    return '<span style="color:var(--text-faint);">not implemented yet</span>';
  const rows = scopeQA().filter(r=>r.dateWorked);
  const before = rows.filter(r=>r.dateWorked <  e.implementedAt);
  const after  = rows.filter(r=>r.dateWorked >= e.implementedAt);
  const hit = rs => rs.filter(r=>r.errors.some(x=>x.cat===cat)).length;
  if(!before.length || !after.length)
    return '<span style="color:var(--text-faint);">range does not span the date</span>';
  const b = pct(hit(before), before.length);
  const a = pct(hit(after),  after.length);
  const d = +(a-b).toFixed(1);
  if(after.length < 5)
    return `<span class="tag clear">too early — ${after.length} audit(s) since</span>`;
  const tone = d <= -2 ? 'good' : d >= 2 ? 'bad' : 'flat';
  const label = d <= -2 ? 'working' : d >= 2 ? 'worse' : 'no change';
  return `<span style="color:${tone==='good'?'var(--good)':tone==='bad'?'var(--bad)':'var(--text-dim)'};font-weight:700;">
    ${fmtPct(b)} &rarr; ${fmtPct(a)} (${d>0?'+':''}${d}) </span>
    <span class="tag ${tone==='good'?'clear':tone==='bad'?'outlier':'major'}">${label}</span>`;
}
function rcaSummaryGridHTML(vital){
  if(!vital.length) return '';
  const rowsH = vital.map(x=>{
    const k = rcaKeyFor(x.key);
    const e = RCA[k]||{};
    const why = e.why==='Other' ? (e.whyOther||'Other') : (e.why||'');
    const st  = e.status==='Other' ? (e.statusOther||'Other') : (e.status||'Not started');
    return `<tr data-gridkey="${esc(k)}">
      <td><b>${esc(x.key)}</b></td>
      <td class="num">${x.count}</td>
      <td class="num">${fmtPct(x.share)}</td>
      <td class="g-why">${why?esc(why):'<span style="color:var(--text-faint);font-style:italic;">Not documented</span>'}</td>
      <td class="g-status"><span class="tag ${st==='Implemented'?'clear':st==='Not started'?'major':'nonfatal'}">${esc(st)}</span></td>
      <td>${rcaTrendCell(x.key, e)}</td>
    </tr>`;}).join('');
  return `<div class="card"><h3>RCA Summary Grid</h3>
    <div class="card-sub">One line per vital-few category — root cause against its mitigation plan status · updates as the fields above are filled</div>
    <div class="table-scroll"><table class="data" id="rcaGrid">
      <thead><tr><th>Error Category</th><th class="num">Errors</th><th class="num">% of Total</th>
        <th>Root Cause</th><th>Mitigation Plan Status</th><th>Since Implemented</th></tr></thead>
      <tbody>${rowsH}</tbody>
      <tfoot><tr><td>TOTAL</td>
        <td class="num">${vital.reduce((s2,x)=>s2+x.count,0)}</td>
        <td class="num">${fmtPct(vital.reduce((s2,x)=>s2+x.share,0))}</td>
        <td colspan="3"></td></tr></tfoot>
    </table></div></div>`;
}
function rcaHTML(rows){
  const {arr,total,vitalCount} = paretoData(rows, e=>e.cat, e=>e.pillar);
  const vital = arr.filter(x=>x.vital && x.count>0);
  if(!vital.length) return `<div class="card"><h3>RCA &amp; Mitigation Plan</h3>
    <div class="card-sub">No errors in this range, so there is nothing requiring root-cause analysis.</div></div>`;
  const vitalShare = vital.reduce((s,x)=>s+x.count,0);
  const done = vital.filter(x=>{ const e=RCA[rcaKeyFor(x.key)]; return e && e.rca && e.mitigation; }).length;
  return `<div class="card"><h3>RCA &amp; Mitigation Plan</h3>
    <div class="card-sub">The ${vital.length} categories driving ${fmtPct(pct(vitalShare,total))} of all errors ·
      ${done} of ${vital.length} documented · entries are saved automatically and appear in the printed report</div>
    <div class="rca-list">
      ${vital.map(x=>{
        const k = rcaKeyFor(x.key);
        const e = RCA[k] || {};
        // the people behind the first 80% of THIS category's errors, so a
        // one-off contributor does not sit alongside the main drivers
        const keyP=[]; let acc=0;
        for(const [nm,cnt] of x.topPeople){
          keyP.push(`${esc(nm)} (${cnt})`); acc+=cnt;
          if(pct(acc, x.count||1) >= 80) break;
        }
        const others = x.topPeople.length - keyP.length;
        const people = keyP.join(', ') + (others>0
          ? ` <span style="color:var(--text-faint);">+${others} other${others!==1?'s':''}</span>` : '');
        const filled = e.rca && e.mitigation;
        return `<div class="rca-item ${filled?'is-done':''}" data-key="${esc(k)}">
          <div class="rca-head">
            <div class="rca-title">${esc(x.key)}
              <span class="tag nonfatal">${esc(x.parent||'—')}</span>
              ${filled?'<span class="tag clear">Documented</span>':'<span class="tag major">Needs RCA</span>'}
            </div>
            <div class="rca-metrics">
              <span><b>${x.count}</b> errors</span>
              <span><b>${fmtPct(x.share)}</b> of total</span>
              <span>cumulative <b>${fmtPct(x.cum)}</b></span>
            </div>
          </div>
          <div class="rca-why-here">Why this category is on the list: it accounts for
            <b>${fmtPct(x.share)}</b> of all ${total} errors and
            <b>${fmtPct(pct(x.count, vitalShare))}</b> of the vital few that make up the top 80%.</div>
          <div class="rca-sub">Main contributors: ${people||'—'}</div>

          <label class="rca-f">
            <span class="rca-lbl">1 · Root cause category</span>
            <select data-f="why">
              <option value="">Select a cause category…</option>
              ${RCA_WHY.map(w=>`<option value="${esc(w)}" ${e.why===w?'selected':''}>${esc(w)}</option>`).join('')}
            </select>
          </label>
          <label class="rca-f rca-other" data-show-when="why" style="${e.why==='Other'?'':'display:none;'}">
            <span class="rca-lbl">Specify the cause category</span>
            <input type="text" data-f="whyOther" placeholder="Type the cause category" value="${esc(e.whyOther||'')}" />
          </label>

          <label class="rca-f rca-wide">
            <span class="rca-lbl">2 · Root cause analysis — what is actually causing these errors?</span>
            <textarea data-f="rca" rows="3" placeholder="Describe the underlying cause, not the symptom. What did these claims have in common?">${esc(e.rca||'')}</textarea>
          </label>

          <label class="rca-f rca-wide">
            <span class="rca-lbl">3 · Mitigation plan — what will stop it recurring?</span>
            <textarea data-f="mitigation" rows="3" placeholder="Specific corrective action: SOP update, refresher, checklist change, system fix…">${esc(e.mitigation||'')}</textarea>
          </label>

          <label class="rca-f">
            <span class="rca-lbl">4 · Mitigation plan status</span>
            <select data-f="status">
              ${RCA_STATUS.map(st=>`<option value="${esc(st)}" ${e.status===st?'selected':''}>${esc(st)}</option>`).join('')}
            </select>
          </label>
          <label class="rca-f rca-other" data-show-when="status" style="${e.status==='Other'?'':'display:none;'}">
            <span class="rca-lbl">Specify the status</span>
            <input type="text" data-f="statusOther" placeholder="Describe where the plan stands" value="${esc(e.statusOther||'')}" />
          </label>
        </div>`;
      }).join('')}
    </div>
  </div>${rcaSummaryGridHTML(vital)}`;
}

// one delegated listener handles every RCA field
document.addEventListener('input', e=>{
  const f = e.target.closest('[data-f]');
  const item = e.target.closest('.rca-item');
  if(!f || !item) return;
  const k = item.dataset.key;
  RCA[k] = RCA[k] || {};
  RCA[k][f.dataset.f] = e.target.value;
  clearTimeout(window.__rcaT);
  window.__rcaT = setTimeout(()=>{ saveRCA(); }, 1400);
});
document.addEventListener('change', e=>{
  const f = e.target.closest('[data-f]');
  const item = e.target.closest('.rca-item');
  if(!f || !item) return;
  const k = item.dataset.key;
  RCA[k] = RCA[k] || {};
  RCA[k][f.dataset.f] = e.target.value;
  // record when a plan went live so effectiveness can be measured before/after
  if(f.dataset.f==='status'){
    if(e.target.value==='Implemented' && !RCA[k].implementedAt){
      RCA[k].implementedAt = new Date().toISOString().slice(0,10);
    }
    if(e.target.value!=='Implemented') delete RCA[k].implementedAt;
  }
  saveRCA();
  // reveal the free-text box when "Other" is chosen
  const which = f.dataset.f;
  if(which==='why' || which==='status'){
    const extra = item.querySelector(`.rca-other[data-show-when="${which}"]`);
    if(extra) extra.style.display = (e.target.value==='Other') ? '' : 'none';
  }
  // refresh the Documented / Needs RCA badge without losing focus
  const filled = RCA[k].rca && RCA[k].mitigation;
  item.classList.toggle('is-done', !!filled);
  // mirror into the summary grid
  const grow = document.querySelector(`#rcaGrid tr[data-gridkey="${CSS.escape(k)}"]`);
  if(grow){
    const e2 = RCA[k];
    const whyTxt = e2.why==='Other' ? (e2.whyOther||'Other') : (e2.why||'');
    const stTxt  = e2.status==='Other' ? (e2.statusOther||'Other') : (e2.status||'Not started');
    grow.querySelector('.g-why').innerHTML = whyTxt?esc(whyTxt):'<span style="color:var(--text-faint);font-style:italic;">Not documented</span>';
    grow.querySelector('.g-status').innerHTML = `<span class="tag ${stTxt==='Implemented'?'clear':stTxt==='Not started'?'major':'nonfatal'}">${esc(stTxt)}</span>`;
  }
});

/* ============================ QA PERFORMANCE ============================ */
// Days FROM a TO b. Positive when b is later than a. Never clamped — callers
// decide what a negative means, so a reversed pair shows up instead of silently
// collapsing to zero.
function daysBetween(a,b){
  if(!a||!b) return null;
  const t1=new Date(a+'T00:00:00').getTime(), t2=new Date(b+'T00:00:00').getTime();
  if(isNaN(t1)||isNaN(t2)) return null;
  return Math.round((t2-t1)/86400000);
}
function prodIndex(){
  const m=new Map();
  for(const p of scopeProd()) m.set(p.nameKey+'||'+p.dateKey, (m.get(p.nameKey+'||'+p.dateKey)||0)+p.count);
  return m;
}
// production behind a set of audit rows = the work actually covered (per biller per day)
function prodCovered(rs, pidx){
  const seen=new Set(); let tot=0;
  for(const r of rs){
    const k=r.nameKey+'||'+r.dateWorked;
    if(seen.has(k)) continue;
    seen.add(k);
    tot += pidx.get(k)||0;
  }
  return tot;
}
function qaStats(rows){
  const g = groupBy(rows, r=>r.auditorName||'(unnamed)');
  const pidx = prodIndex();
  const out=[];
  for(const [aud, rs] of g){
    const audits=rs.length;
    const production = prodCovered(rs, pidx);
    const withErr=rs.filter(r=>r.errCount>0).length;
    const lags=rs.map(r=>daysBetween(r.dateWorked, r.auditDate)).filter(v=>v!==null && v>=0);
    const days=new Set(rs.map(r=>r.auditDate).filter(Boolean)).size;
    out.push({
      key:aud, audits,
      associates:new Set(rs.map(r=>r.nameKey)).size,
      projects:new Set(rs.map(r=>r.project).filter(Boolean)).size,
      practices:new Set(rs.map(r=>r.practice).filter(Boolean)).size,
      days, perDay: days? +(audits/days).toFixed(1) : 0,
      detection: pct(withErr, audits),
      errors: rs.reduce((s,r)=>s+r.errCount,0),
      fatal: rs.reduce((s,r)=>s+r.fatal,0),
      major: rs.reduce((s,r)=>s+r.major,0),
      nonfatal: rs.reduce((s,r)=>s+r.nonfatal,0),
      avgScore: avgScore(rs),
      avgDed: audits? +(rs.reduce((s,r)=>s+r.deduction,0)/audits).toFixed(3) : 0,
      avgLag: lags.length? +(lags.reduce((a,b)=>a+b,0)/lags.length).toFixed(1) : null,
      maxLag: lags.length? Math.max(...lags) : null,
      production, sampling: production>0 ? pct(audits, production) : null,
      rows: rs
    });
  }
  return out.sort((a,b)=>b.audits-a.audits);
}

/* ============================ QA EFFECTIVENESS MODULES ============================ */
function yesish(v){ return /^(y|yes|true|1|raised|disputed)$/i.test(String(v||'').trim()); }
// Careful with substrings: "Disagree" contains "agree", "Incorrect" contains
// "correct", and "Invalid" contains "valid". Negatives are always tested first.
function disagrees(v){
  return /(disagree|dis-agree|mismatch|differ|incorrect|not\s*correct|wrong|overturn)/i.test(String(v||''));
}
function agrees(v){
  const t=String(v||'').trim();
  if(!t || disagrees(t)) return false;
  return /(agree|match|concur|same|correct|upheld|valid|yes)/i.test(t);
}
function overturned(v){
  return /(overturn|reversed|withdrawn|removed|dropped|waived|accept(ed)?\b|in favou?r of (the )?(biller|associate|agent)|invalid)/i.test(String(v||''));
}
function upheld(v){
  const t=String(v||'').trim();
  if(!t || overturned(t)) return false;
  return /(uphold|upheld|retain|sustain|reject|denied|qa correct|no change|valid|stands)/i.test(t);
}

// ---- 1. Repeat errors: same associate + same category flagged again in a later week ----
function repeatErrorData(rows){
  const seq = rows.filter(r=>r.dateWorked).slice().sort((a,b)=> (a.dwT||0)-(b.dwT||0));
  const firstSeen = new Map();      // name||cat -> week label
  const repeats = [];
  for(const r of seq){
    const wk = weekLabel(r.week);
    for(const e of r.errors){
      const k = r.nameKey+'||'+e.cat;
      if(!firstSeen.has(k)){ firstSeen.set(k, {wk, t:r.dwT||0}); continue; }
      const prev = firstSeen.get(k);
      if(wk !== prev.wk){
        repeats.push({name:r.name, nameKey:r.nameKey, cat:e.cat, pillar:e.pillar,
          firstWeek:prev.wk, repeatWeek:wk, auditor:r.auditorName, teamLead:r.teamLead});
      }
    }
  }
  const totalPairs = firstSeen.size;
  const recurredPairs = new Set(repeats.map(x=>x.nameKey+'||'+x.cat)).size;
  return {repeats, totalPairs, recurredPairs,
    rate: pct(recurredPairs, totalPairs||1)};
}

// ---- 5. Error-type breadth: is an auditor looking at everything, or only a narrow slice? ----
function auditorBreadthHTML(rows){
  const allTypes = [...new Set([...PILLARS, ...PARAMS.map(p=>p.type)].filter(Boolean))];
  const g = groupBy(rows, r=>r.auditorName||'(unnamed)');

  for(const [aud, rs] of g){

    list.push({aud, audits:rs.length, used:types.size, total:allTypes.length,
      breadth: pct(types.size, allTypes.length||1),
      missing: allTypes.filter(t=>!types.has(t))});

  return `<div class="card"><h3>Error-Type Breadth by Auditor</h3>

// ---- 6. Rebuttal / overturn rate (needs optional columns) ----
function rebuttalHTML(rows){
  const withData = rows.filter(r=>r.rebuttal || r.rebuttalOutcome);
  if(!withData.length) return `<div class="card needs-data"><h3>Rebuttal &amp; Overturn Rate</h3>
    <div class="card-sub">Not available — your audit sheet has no rebuttal columns.</div>
    <div class="nd-body">This is the closest thing to a QA score for a QA: when a biller disputes a finding and it is reversed, that is an auditor error. No derived metric substitutes for it.
      <div class="nd-cols">Add either column to the Audit Data tab and it populates automatically:
        <b>Rebuttal Outcome</b> (or Rebuttal Status / Dispute Outcome / Overturned) with values like
        <i>Overturned</i> / <i>Upheld</i>, and optionally <b>Rebuttal</b> (Yes/No) to record that one was raised.</div>
    </div></div>`;
  const g = groupBy(withData, r=>r.auditorName||'(unnamed)');
  const list=[];
  for(const [aud, rs] of g){
    const isRaised = r => yesish(r.rebuttal)
      || overturned(r.rebuttalOutcome) || upheld(r.rebuttalOutcome);
    const raised = rs.filter(isRaised).length;
    const over = rs.filter(r=>overturned(r.rebuttalOutcome)).length;
    const up = rs.filter(r=>upheld(r.rebuttalOutcome)).length;
    const unclear = raised - over - up;
    list.push({aud, audits:rs.length, raised, over, up,
      unclear,
      overturnRate: raised? pct(over, raised) : 0,
      accuracy: raised? pct(raised-over, raised) : 100});
  }
  list.sort((a,b)=>b.overturnRate-a.overturnRate);
  const tot = list.reduce((a,x)=>({raised:a.raised+x.raised, over:a.over+x.over,
    up:a.up+x.up, unclear:a.unclear+x.unclear}), {raised:0,over:0,up:0,unclear:0});
  return `<div class="card"><h3>Rebuttal &amp; Overturn Rate</h3>
    <div class="card-sub">Findings disputed by billers and how often the dispute succeeded · a high overturn rate means audits are being called wrong</div>
    ${tot.unclear>0? `<div class="data-note">${tot.unclear} rebuttal(s) have an outcome this report could not read as either
      overturned or upheld, so they are counted as raised but sit in neither column. Check the wording used in the
      <b>Rebuttal Status</b> column.</div>`:''}
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Auditor</th><th class="num">Audits</th><th class="num">Rebuttals</th>
        <th class="num">Overturned</th><th class="num">Upheld</th><th class="num">Overturn %</th>
        <th class="num">Audit Accuracy</th></tr></thead>
      <tbody>${list.map(x=>`<tr class="${x.overturnRate>=20?'is-outlier':''}">
        <td><b>${esc(x.aud)}</b></td><td class="num">${x.audits}</td>
        <td class="num">${x.raised}</td><td class="num">${x.over}</td><td class="num">${x.up}</td>
        <td class="num"><span class="stamp ${x.overturnRate>=20?'bad':'ok'}">${fmtPct(x.overturnRate)}</span></td>
        <td class="num"><span class="stamp ${scoreClass(x.accuracy)}">${fmtPct(x.accuracy)}</span></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${withData.length}</td><td class="num">${tot.raised}</td>
        <td class="num">${tot.over}</td><td class="num">${tot.up}</td>
        <td class="num">${fmtPct(pct(tot.over, tot.raised||1))}</td>
        <td class="num">${fmtPct(pct(tot.up, tot.raised||1))}</td></tr></tfoot>

}

// ---- 7. Audit-the-auditor: supervisor re-audit agreement ----
function reAuditHTML(rows){
  const withData = rows.filter(r=>r.reAuditBy || r.reAuditVerdict);
  if(!withData.length) return `<div class="card needs-data"><h3>Audit-the-Auditor</h3>
    <div class="card-sub">Not available — your audit sheet has no re-audit columns.</div>
    <div class="nd-body">A supervisor re-audits a sample of already-audited claims and records whether they reached the same verdict. This catches auditors who are consistently wrong in the same direction, which peer comparison alone cannot.
      <div class="nd-cols">Add <b>Re-Audit Verdict</b> (or Supervisor Verdict / Agreement) with values like
        <i>Agree</i> / <i>Disagree</i>, and optionally <b>Re-Audit By</b> for who performed it.</div>
    </div></div>`;
  const g = groupBy(withData, r=>r.auditorName||'(unnamed)');
  const list=[];
  for(const [aud, rs] of g){
    const ag = rs.filter(r=>agrees(r.reAuditVerdict)).length;
    const dis = rs.filter(r=>disagrees(r.reAuditVerdict)).length;
    const judged = ag+dis;
    list.push({aud, checked:rs.length, ag, dis, rate: judged? pct(ag, judged) : null});
  }
  list.sort((a,b)=>(a.rate??101)-(b.rate??101));
  return `<div class="card"><h3>Audit-the-Auditor</h3>
    <div class="card-sub">Supervisor re-audits and whether the original verdict held</div>

        <td class="num">${x.ag}</td><td class="num">${x.dis}</td>

      </tr>`).join('')}</tbody>

        <td class="num">${list.reduce((s2,x)=>s2+x.checked,0)}</td>
        <td class="num">${list.reduce((s2,x)=>s2+x.ag,0)}</td>
        <td class="num">${list.reduce((s2,x)=>s2+x.dis,0)}</td>
        <td class="num">${(()=>{const a=list.reduce((s2,x)=>s2+x.ag,0),d2=list.reduce((s2,x)=>s2+x.dis,0);
          return (a+d2)?fmtPct(pct(a,a+d2)):'—';})()}</td>

      </table></div></div>`;

// ---- 8. Duplicate audit: the same claim audited by more than one auditor ----
function duplicateAuditHTML(rows){
  const withId = rows.filter(r=>r.claimId);
  const g = groupBy(withId, r=>r.claimId);
  const multi=[];
  for(const [cid, rs] of g){
    // a blank claim id is not a claim — without this every unidentified audit
    // lands in one group and reads as hundreds of scores on a single claim
    if(!String(cid||'').trim() || String(cid).trim()==='-') continue;
    const auds = new Set(rs.map(r=>r.auditorName).filter(Boolean));
    if(auds.size<2) continue;
    const scores = rs.map(r=>r.score);
    const spread = +(Math.max(...scores)-Math.min(...scores)).toFixed(1);
    // one line per auditor, not per audit
    const byAud=[...groupBy(rs, r=>r.auditorName||'?').entries()]
      .map(([a,v])=>({a, n:v.length, avg:+(v.reduce((s2,r)=>s2+r.score,0)/v.length).toFixed(1)}))
      .sort((x,y)=>y.avg-x.avg);
    multi.push({cid, auditors:[...auds], n:rs.length, spread, byAud,
      detail: byAud.map(b=>`${b.a}: ${fmtPct(b.avg)}${b.n>1?` (${b.n} audits)`:''}`)});
  }
  if(!withId.length) return `<div class="card needs-data"><h3>Duplicate Audit</h3>
    <div class="card-sub">Not available — no claim ID on the audit rows.</div>
    <div class="nd-body">A duplicate audit is the same claim audited by more than one auditor. Comparing their scores shows whether the parameters are being read the same way, which no amount of volume reporting will reveal.
      <div class="nd-cols">Populate <b>IG Claim ID#/Charge ID#</b> (or <b>Claim ID</b>), then have two or more auditors audit the same claim during a calibration session.</div>
    </div></div>`;
  if(!multi.length) return `<div class="card"><h3>Duplicate Audit</h3>
    <div class="card-sub">Claim IDs are present, but no claim was audited by more than one auditor in this range — so there is nothing to compare.</div>
    <div style="font-size:12.5px;color:var(--text-dim);">Run a duplicate-audit exercise: pick 5–10 claims, have two or more auditors score them independently, and this table will show how far apart they land.</div></div>`;
  multi.sort((a,b)=>b.spread-a.spread);
  const avg = +(multi.reduce((s,x)=>s+x.spread,0)/multi.length).toFixed(1);
  return `<div class="card"><h3>Duplicate Audit</h3>
    <div class="card-sub">Claims audited by more than one auditor · average score spread <b>${avg}</b> points</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Claim</th><th class="num">Auditors</th><th class="num">Audits</th>
        <th class="num">Score Spread</th><th>Average Score Per Auditor</th><th>Read</th></tr></thead>
      <tbody>${multi.slice(0,25).map(x=>`<tr class="${x.spread>=10?'is-outlier':''}">
        <td><b>${esc(x.cid)}</b></td><td class="num">${x.auditors.length}</td>
        <td class="num">${x.n}</td>
        <td class="num">${x.spread}</td>
        <td style="white-space:normal;">${x.detail.slice(0,6).map(esc).join(' &middot; ')}${x.detail.length>6?` &middot; +${x.detail.length-6} more`:''}</td>
        <td>${x.spread>=10?'<span class="tag outlier">Divergent</span>'
          : x.spread>0?'<span class="tag major">Minor difference</span>'
          : '<span class="tag clear">Aligned</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
    <div class="insight-box"><div class="ib-title">Insight</div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        ${multi.filter(x=>x.spread>=10).length} duplicate-audited claim(s) diverged by 10 points or more. Those are the ones to walk through together — the disagreement usually traces to one parameter being read two ways, and fixing the wording fixes it for everyone.
      </span></div></div></div>`;
}

/* ============================ SAMPLING TARGETS BY STATUS ============================ */
// Each associate's expected sampling depends on where they sit in the lifecycle,
// and whether they are a fresher. Ranges are inclusive.
// FRESHER_MONTHS is set in the Settings card
const SAMPLING_RULES = [
  {status:'PIP',         fresher:null,  min:100, max:100, label:'PIP / QIP'},
  {status:'Observation', fresher:null,  min:30,  max:40,  label:'Observation'},
  {status:'Outlier',     fresher:null,  min:20,  max:30,  label:'Outlier'},
  {status:'OJT',         fresher:true,  min:80,  max:100, label:'OJT · Fresher'},
  {status:'OJT',         fresher:false, min:60,  max:80,  label:'OJT · Experienced'},
  {status:'Production',  fresher:true,  min:40,  max:50,  label:'Production · Fresher'},
  {status:'Production',  fresher:false, min:5,   max:10,  label:'Production · Experienced'}
];
function normStatus(raw){
  const v = String(raw||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(!v) return '';
  if(/PIP|QIP/.test(v))           return 'PIP';
  if(/OBSERV/.test(v))            return 'Observation';
  if(/OUTLIER/.test(v))           return 'Outlier';
  // Training is no longer its own band — a roster still saying Training is
  // treated as OJT so those associates still get a target rather than none.
  if(/OJT|OGT|OTT|ONJOB|TRAIN/.test(v)) return 'OJT';
  if(/PROD|LIVE|BAU/.test(v))     return 'Production';
  return '';
}
function isFresher(ro){
  if(!ro) return false;
  if(ro.fresherRaw){
    if(/fresher|fresh|new|trainee/i.test(ro.fresherRaw)) return true;
    if(/exp|lateral|experienced/i.test(ro.fresherRaw))   return false;
  }
  if(ro.tenurity && /fresher/i.test(ro.tenurity)) return true;
  const m = tenureMonthsOf(ro);
  return m!==null && m < FRESHER_MONTHS;
}
function tenureMonthsOf(ro){
  if(!ro) return null;
  const n = parseFloat(String(ro.tenurity||'').replace(/[^0-9.]/g,''));
  if(!isNaN(n) && String(ro.tenurity||'').trim()!=='') return n;
  if(ro.startT){
    const months = (Date.now() - ro.startT) / (1000*60*60*24*30.44);
    return Math.max(0, +months.toFixed(1));
  }
  return null;
}
function samplingTargetFor(nameKey){
  const ro = rosterFor(nameKey);
  let st = normStatus(ro && ro.status);
  const fr = isFresher(ro);
  // detected outliers move to the Outlier band unless already on a stricter plan
  let detected = false;
  if(st!=='PIP' && st!=='Observation' && st!=='Outlier'){
    try{ if(outlierInfo(nameKey).isOutlier){ st='Outlier'; detected=true; } }catch(e){}
  }
  if(!st) return {rule:null, status:(ro&&ro.status)||'', fresher:fr, roster:ro, detected:false};
  const rule = SAMPLING_RULES.find(r=>r.status===st && (r.fresher===null || r.fresher===fr))
            || SAMPLING_RULES.find(r=>r.status===st);
  return {rule, status:st, fresher:fr, roster:ro, detected};
}
function samplingVerdict(actual, rule){
  if(actual===null || !rule) return null;
  if(actual < rule.min) return 'under';
  // a 100% target has no ceiling — duplicate audits can legitimately push a
  // fully-sampled associate just past 100%, which is not over-sampling
  if(rule.max >= 100) return 'in';
  if(actual > rule.max) return 'over';
  return 'in';
}

function samplingComplianceHTML(rows){
  const pidx = prodIndex();
  if(!PROD.length) return `${samplingRulesTableHTML()}
    <div class="card"><h3>Sampling vs Target</h3>
    <div class="card-sub">Upload a Production Sheet to measure each associate against their target range.</div></div>`;
  const g = groupBy(rows, r=>r.nameKey);
  const prodByName = new Map();
  scopeProd().forEach(p2=>prodByName.set(p2.nameKey,(prodByName.get(p2.nameKey)||0)+p2.count));
  const list=[];
  for(const [nk, rs] of g){
    const production = prodByName.get(nk)||0;
    const actual = production>0 ? pct(rs.length, production) : null;
    const t = samplingTargetFor(nk);
    list.push({name:rs[0].name, nk, audits:rs.length, production, actual,
      auditors:[...new Set(rs.map(r=>r.auditorName).filter(Boolean))],
      ...t, verdict: samplingVerdict(actual, t.rule)});
  }
  // unknown status last, then most under-sampled first
  list.sort((a,b)=>{
    if(!!a.rule !== !!b.rule) return a.rule?-1:1;
    const av=a.actual===null?999:(a.rule?a.actual-a.rule.min:999);
    const bv=b.actual===null?999:(b.rule?b.actual-b.rule.min:999);
    return av-bv;
  });
  const under = list.filter(x=>x.verdict==='under').length;

    ${needList.length? `<div class="section-sub-title">Who is short, and by how many audits</div>

      <tbody>${needList.slice(0,15).map(x=>`<tr class="is-outlier">

      ${needTotal<=spareTotal && needTotal>0 ? `<div class="ib-row"><span class="ib-dot"></span><span>

    <div class="card"><h3>Sampling vs Target</h3>

    <div class="table-scroll"><table class="data">
      <thead><tr><th>Associate</th><th>Status</th><th class="num">Target</th>
        <th class="num">Audits</th><th class="num">Production</th><th class="num">Actual</th>

        const gap = (x.actual!==null && x.rule)
          ? (x.verdict==='under' ? +(x.rule.min-x.actual).toFixed(1)

        return `<tr class="${x.verdict==='under'?'is-outlier':''}">

          <td class="num">${x.actual===null?'—':`<span class="stamp ${
            x.verdict==='in'?'ok':x.verdict==='under'?'bad':'warn'}">${fmtPct(x.actual)}</span>`}</td>
          <td class="num">${gap===null?'—':(gap===0?'0':`${x.verdict==='under'?'-':'+'}${gap}`)}</td>
          <td>${!x.rule ? '<span class="tag major">No status on roster</span>'
            : x.verdict==='under' ? '<span class="tag outlier">Under-sampled</span>'

            : '<span class="tag clear">Within target</span>'}</td>
          <td style="white-space:normal;">${x.auditors.map(esc).join(', ')||'—'}</td>
        </tr>`;}).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td></td>
        <td class="num na-cell">varies</td>
        <td class="num">${list.reduce((s2,x)=>s2+x.audits,0)}</td>
        <td class="num">${list.reduce((s2,x)=>s2+(x.production||0),0)}</td>
        <td class="num">${(()=>{const a=list.reduce((s2,x)=>s2+x.audits,0),
                                     pr=list.reduce((s2,x)=>s2+(x.production||0),0);
                               return pr>0?fmtPct(pct(a,pr)):'—';})()}</td>
        <td class="num na-cell">—</td><td></td><td></td></tr></tfoot>

    <div class="insight-box"><div class="ib-title">What to do with this</div>
      ${under? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${under}</b> associate(s) fall below their required range. Under-sampling a PIP or OJT associate is the costly kind — their scores are the ones being used to make decisions, so a thin sample makes those decisions unsafe.
      </span></div>`:''}
      ${over? `<div class="ib-row"><span class="ib-dot"></span><span>

      </span></div>`:''}
      ${noStatus? `<div class="ib-row"><span class="ib-dot"></span><span>

      </span></div>`:''}
      ${(!under&&!over&&!noStatus)? `<div class="ib-row"><span class="ib-dot"></span><span>

/* ============================ FEEDBACK & RECURRENCE ============================ */
function fbPending(v){ return /\b(not|no|pending|awaiting|yet|open|due)\b/i.test(String(v||'')); }
function fbShared(v){
  const t = String(v||'').trim();
  if(!t || fbPending(t)) return false;
  return /(shared|delivered|done|complete|given|yes|sent|discussed|closed)/i.test(t);
}
// When a feedback date is missing we fall back to the audit date — feedback is
// normally given around the audit, and without a date "after" can't be judged.
function fbWhen(r){ return r.feedbackDate || r.auditDate || ''; }

function feedbackRecurrenceData(rows){
  const people = new Map();
  for(const r of rows){
    if(!r.errors.length) continue;
    for(const e of r.errors){
      if(!people.has(r.nameKey)) people.set(r.nameKey,{name:r.name, teamLead:r.teamLead, cats:new Map()});
      const p = people.get(r.nameKey);
      if(!p.cats.has(e.cat)) p.cats.set(e.cat,{cat:e.cat, hits:[], fbDates:[], auditors:new Set()});
      const c = p.cats.get(e.cat);
      c.hits.push({worked:r.dateWorked, wk:weekLabel(r.week)});
      if(r.auditorName) c.auditors.add(r.auditorName);
      if(fbShared(r.feedbackStatus)){
        const w = fbWhen(r);
        if(w) c.fbDates.push(w);
      }
    }
  }
  const out=[];
  for(const [nk,p] of people){
    const cats=[];
    for(const [,c] of p.cats){
      c.fbDates.sort();
      const last = c.fbDates.length ? c.fbDates[c.fbDates.length-1] : '';
      // only work done AFTER the last feedback counts — earlier work predates being told
      const after = last ? c.hits.filter(h=>h.worked && h.worked > last).length : null;
      cats.push({cat:c.cat, errors:c.hits.length, feedbacks:c.fbDates.length,
        lastFb:last, after, auditors:[...c.auditors],
        lastError: c.hits.map(h=>h.worked).filter(Boolean).sort().pop()||''});
    }
    cats.sort((a,b)=>b.errors-a.errors);
    const allFb = cats.map(c=>c.lastFb).filter(Boolean).sort();
    const totAfter = cats.some(c=>c.after!==null)
      ? cats.reduce((s,c)=>s+(c.after||0),0) : null;
    const allAud=[...new Set(cats.flatMap(c=>c.auditors))];
    out.push({nameKey:nk, name:p.name, teamLead:p.teamLead, cats, auditors:allAud,
      errors: cats.reduce((s,c)=>s+c.errors,0),
      feedbacks: cats.reduce((s,c)=>s+c.feedbacks,0),
      lastFb: allFb.length? allFb[allFb.length-1] : '',
      after: totAfter});
  }
  return out.sort((a,b)=>b.errors-a.errors);
}

function repeatedCell(after, feedbacks){
  if(!feedbacks) return '<span class="tag major">No feedback given</span>';
  if(after===null) return '<span style="color:var(--text-faint);">—</span>';
  return after>0
    ? `<span class="tag fatal">Yes — ${after} more time${after!==1?'s':''}</span>`
    : '<span class="tag clear">No</span>';
}
function audCell(list){
  if(!list || !list.length) return '<span style="color:var(--text-faint);">—</span>';
  return esc(list[0]) + (list.length>1
    ? ` <span style="color:var(--text-faint);">+${list.length-1}</span>` : '');
}

function feedbackEffectHTML(rows){
  const data = feedbackRecurrenceData(rows);
  if(!data.length) return `<div class="card"><h3>Feedback &amp; Recurrence</h3>
    <div class="card-sub">No errors in this range, so there is nothing to follow up on.</div></div>`;

  // error-level totals: every individual error, and whether its audit carried feedback
  let errTotal=0, errWithFb=0, errNoFb=0;
  for(const r of rows){
    for(const e of r.errors){
      errTotal++;
      if(fbShared(r.feedbackStatus)) errWithFb++; else errNoFb++;
    }
  }
  // a case = one associate + one error category
  const cases=[];
  data.forEach(p=>p.cats.forEach(c=>cases.push({...c, name:p.name, nameKey:p.nameKey})));
  const noFb   = cases.filter(c=>c.feedbacks===0);
  const repeat = cases.filter(c=>c.feedbacks>0 && c.after>0);
  const clear  = cases.length - noFb.length - repeat.length;
  const attention = noFb.concat(repeat)
    .sort((a,b)=> (b.after||0)-(a.after||0) || b.errors-a.errors);


  const tile = (n, label, tone) => `
    <div class="fb-tile ${tone}"><div class="ft-n">${n}</div><div class="ft-l">${esc(label)}</div></div>`;
  void 0;

  const ATT_SHOWN = 5;
  // group the cases that need attention under one row per associate
  const attByName = new Map();
  attention.forEach(c=>{
    if(!attByName.has(c.nameKey)) attByName.set(c.nameKey, {name:c.name, nameKey:c.nameKey, cats:[]});
    attByName.get(c.nameKey).cats.push(c);
  });
  const attPeople = [...attByName.values()].map(p=>{
    p.cats.sort((a,b)=> (b.after||0)-(a.after||0) || b.errors-a.errors);
    p.errors    = p.cats.reduce((s2,c)=>s2+c.errors,0);
    p.feedbacks = p.cats.reduce((s2,c)=>s2+c.feedbacks,0);
    p.repeated  = p.cats.filter(c=>c.after>0).length;
    p.noFb      = p.cats.filter(c=>c.feedbacks===0).length;
    const fbs   = p.cats.map(c=>c.lastFb).filter(Boolean).sort();
    p.lastFb    = fbs.length ? fbs[fbs.length-1] : '';
    p.auditors  = [...new Set(p.cats.flatMap(c=>c.auditors))];
    return p;
  }).sort((a,b)=> (b.repeated+b.noFb)-(a.repeated+a.noFb) || b.errors-a.errors);

  const ATT_PEOPLE_SHOWN = 5;
  const parentVerdict = p =>
      p.repeated>0 ? `<span class="tag fatal">${p.repeated} of ${p.cats.length} repeated</span>`
    : p.noFb===p.cats.length ? '<span class="tag major">No feedback on any</span>'
    : `<span class="tag major">No feedback on ${p.noFb}</span>`;

  const attRows = attPeople.map((p,i)=>{
    const hide = i>=ATT_PEOPLE_SHOWN;
    // when every category says the same thing, one line beats repeating it
    const allSame = p.cats.length>2 && p.cats.every(c=>c.feedbacks===0);
    const kids = allSame
      ? `<tr class="row-child ${hide?'more-att':''}" ${hide?'style="display:none;"':''}>
           <td colspan="6" style="padding-left:26px;color:var(--text-faint);font-style:italic;">
             ${p.cats.length} categories — ${p.cats.map(c=>esc(c.cat)).join(', ')}</td></tr>`
      : p.cats.map(c=>`
        <tr class="row-child ${hide?'more-att':''}" ${hide?'style="display:none;"':''}>
          <td><span class="child-mark">&#8226;</span>${esc(c.cat)}</td>
          <td class="num">${c.errors}</td>
          <td class="num">${c.feedbacks===0?'<span style="color:var(--bad);font-weight:700;">0</span>':c.feedbacks}</td>
          <td>${c.lastFb?esc(c.lastFb):'<span style="color:var(--text-faint);">—</span>'}</td>
          <td>${repeatedCell(c.after, c.feedbacks)}</td>
          <td>${audCell(c.auditors)}</td>
        </tr>`).join('');
    return `
      <tr class="row-parent ${hide?'more-att':''}" ${hide?'style="display:none;"':''}>
        <td><b>${esc(p.name)}</b> <span style="color:var(--text-faint);font-weight:400;">· ${p.cats.length} categor${p.cats.length===1?'y':'ies'}</span></td>
        <td class="num">${p.errors}</td>
        <td class="num">${p.feedbacks===0?`<span style="color:var(--bad);font-weight:700;">0</span>`:p.feedbacks}</td>
        <td>${p.lastFb?esc(p.lastFb):'<span style="color:var(--text-faint);">—</span>'}</td>
        <td>${parentVerdict(p)}</td>
        <td>${audCell(p.auditors)}</td>
      </tr>${kids}`;
  }).join('');

  const moreBar = (cls, n, noun) => n<=0 ? '' : `
    <div class="more-bar">
      <button class="more-btn" data-more="${cls}">+ ${n} more ${esc(noun)}</button>
      <span class="more-hint">click to show ${n===1?'it':'them all'} — expanded rows stay open when you print</span>
    </div>`;

  return `<div class="card"><h3>Feedback &amp; Recurrence</h3>
    <div class="card-sub">${errTotal} error${errTotal!==1?'s':''} across ${data.length} associate${data.length!==1?'s':''} ·
      feedback was shared on ${errWithFb} of them (${fmtPct(pct(errWithFb,errTotal||1))}) ·
      ${attPeople.length} associate${attPeople.length!==1?'s':''} need attention</div>

    <div class="fb-tiles">
      ${tile(errTotal, 'total errors', '')}
      ${tile(`${errWithFb} <span style="font-size:12px;font-weight:400;">(${fmtPct(pct(errWithFb,errTotal||1))})</span>`,
             'errors with feedback shared', errTotal&&pct(errWithFb,errTotal)>=80?'good':'warn')}
      ${tile(`${errNoFb} <span style="font-size:12px;font-weight:400;">(${fmtPct(pct(errNoFb,errTotal||1))})</span>`,
             'errors with no feedback', errNoFb?'bad':'good')}
      ${tile(repeat.length, 'categories repeated after feedback','warn')}
    </div>

    ${attention.length? `
      <div class="table-scroll"><table class="data">
        <thead><tr><th>Associate / Error Category</th><th class="num">Errors</th>
          <th class="num">Feedbacks</th><th>Last Feedback</th><th>Repeated After Feedback</th>
          <th>Auditor</th></tr></thead>
        <tbody>${attRows}</tbody></table></div>
      ${moreBar('more-att', attPeople.length-ATT_PEOPLE_SHOWN, `associate${attPeople.length-ATT_PEOPLE_SHOWN!==1?'s':''} need attention`)}`
    : `<div style="font-size:12.5px;color:var(--good);font-weight:600;margin-bottom:6px;">
        Nothing needs attention — every error category had feedback recorded and none recurred afterwards.</div>`}

    <div class="insight-box"><div class="ib-title">How to read this</div>
      <div class="ib-row"><span class="ib-dot"></span><span>
Only the categories needing action are listed. An associate whose errors all had feedback and did not recur will not appear — the three counts above still cover everyone.
      </span></div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        Only work done <b>after</b> the last feedback date is counted. Errors on claims worked before the feedback landed are excluded — the person had not been told yet.
      </span></div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        A <b>Yes</b> is a prompt to look, not a conclusion. The same category covers different payers and scenarios, and a recurrence can have a cause coaching cannot fix — an SOP gap, a payer rule change, or feedback too vague to act on.
      </span></div>
      ${noFb.length? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${noFb.length}</b> case(s) have errors with <b>no feedback recorded at all</b>${noFb.length? ` — ${
          esc([...new Set(noFb.map(c=>c.name))].slice(0,6).join(', '))}${
          [...new Set(noFb.map(c=>c.name))].length>6? ` and ${[...new Set(noFb.map(c=>c.name))].length-6} more`:''}`:''}.
        That is the clearest item here: nobody was told, so nothing could change.
      </span></div>`:''}
      <div class="ib-row"><span class="ib-dot"></span><span>
        A <b>No</b> is not proof the feedback worked — the associate may simply not have hit that scenario again in this range.
      </span></div>
    </div></div>`;
}

/* ============================ REWORK ============================ */
// Both columns are dropdowns: Yes / No / Not Required.
// Only rows explicitly marked "Yes" for Rework Needed enter the denominator —
// "No" and "Not Required" both mean no correction was called for.
function rwYes(v){ return /^\s*(y|yes)\s*$/i.test(String(v||'')); }
function rwNo(v){  return /^\s*(n|no)\s*$/i.test(String(v||'')); }
function rwNA(v){  return /not\s*required|^\s*(na|n\/a)\s*$/i.test(String(v||'')); }
function hasRework(rows){ return rows.some(r=>r.reworkNeeded || r.reworkComplete); }

// Ageing is measured against the latest audit date in scope, not today, so a
// historical range does not report every open item as months old.
function reworkAsOf(rows){
  const ds = rows.map(r=>r.auditDate||r.dateWorked).filter(Boolean).sort();
  return ds.length ? ds[ds.length-1] : '';
}
function reworkStat(rows, asOf){
  const needed = rows.filter(r=>rwYes(r.reworkNeeded));
  const done   = needed.filter(r=>rwYes(r.reworkComplete));
  const open   = needed.filter(r=>rwNo(r.reworkComplete));
  const oddNA  = needed.filter(r=>rwNA(r.reworkComplete));      // contradictory
  const blank  = needed.filter(r=>!r.reworkComplete.trim());
  const ages   = open.map(r=>daysBetween(r.auditDate||r.dateWorked, asOf)).filter(v=>v!==null&&v>=0);
  return {
    needed:needed.length, done:done.length, open:open.length,
    oddNA:oddNA.length, blank:blank.length,
    closure: needed.length ? pct(done.length, needed.length) : null,
    oldest: ages.length ? Math.max(...ages) : null,
    avgAge: ages.length ? +(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1) : null,
    openRows: open
  };
}

function reworkAgentHTML(rows){
  if(!hasRework(rows)) return `<div class="card needs-data"><h3>Rework &amp; Correction</h3>
    <div class="card-sub">Not available — the rework columns are empty on these rows.</div>
    <div class="nd-body">An error that is found but never corrected is still an open claim. This tracks whether the flagged work actually got fixed.
      <div class="nd-cols">Fill <b>Rework Needed - QA</b> and <b>Rework Complete - QA</b> on the Audit Data tab
        (each a dropdown of <i>Yes</i> / <i>No</i> / <i>Not Required</i>).</div>
    </div></div>`;
  const asOf = reworkAsOf(rows);
  const all = reworkStat(rows, asOf);
  const g = groupBy(rows.filter(r=>rwYes(r.reworkNeeded)), r=>r.nameKey);
  const list=[];
  for(const [nk, rs] of g){
    const st = reworkStat(rs, asOf);
    const errs = rows.filter(r=>r.nameKey===nk).reduce((s2,r)=>s2+r.errCount,0);
    list.push({name:rs[0].name, tl:rs[0].teamLead, errors:errs, ...st});
  }
  list.sort((a,b)=> b.open-a.open || (a.closure??101)-(b.closure??101));
  const tile=(n,l,tone)=>`<div class="fb-tile ${tone}"><div class="ft-n">${n}</div><div class="ft-l">${esc(l)}</div></div>`;

  // which error categories generate the rework, and which are hardest to close
  const catMap=new Map();
  const flagged = rows.filter(r=>rwYes(r.reworkNeeded));
  // A rework flag on an audit with no error cannot be attributed to a category.
  // Those rows are counted in the totals but reported on their own rather than
  // being lumped under an invented "(no error category)" heading.
  const noErrRework = flagged.filter(r=>!r.errors.length);
  flagged.filter(r=>r.errors.length).forEach(r=>{
    [...new Set(r.errors.map(e=>e.cat))].forEach(c=>{
      if(!catMap.has(c)) catMap.set(c,{cat:c, needed:0, done:0, open:0});
      const x=catMap.get(c); x.needed++;
      if(rwYes(r.reworkComplete)) x.done++; else if(rwNo(r.reworkComplete)) x.open++;
    });
  });
  const cats=[...catMap.values()].sort((a,b)=>b.needed-a.needed);
  const catTotal = cats.reduce((s2,c)=>s2+c.needed,0);
  const CAT_SHOWN=8;

  return `<div class="card"><h3>Rework &amp; Correction</h3>
    <div class="card-sub">Did the flagged claims actually get fixed · only rows marked <b>Rework Needed = Yes</b> count ·
      open items aged to ${esc(fmtD(asOf))}, the latest audit in this range</div>

    ${(()=>{
      const audited = rows.length;
      const withErr = rows.filter(r=>r.errors.length).length;
      const errsOnFlagged = rows.filter(r=>rwYes(r.reworkNeeded)).reduce((s2,r)=>s2+r.errors.length,0);
      return `<div class="fb-tiles">
      ${tile(`${all.needed} <span style="font-size:12px;font-weight:400;">of ${audited}</span>`,
             `claims flagged for rework (${fmtPct(pct(all.needed, audited||1))} of audited)`, '')}
      ${tile(all.done,'rework complete','good')}
      ${tile(all.open,'still pending', all.open?'bad':'good')}
      ${tile(all.closure===null?'—':fmtPct(all.closure),'closure rate', all.closure!==null&&all.closure<80?'warn':'good')}
    </div>
    <div class="data-note" style="background:var(--panel-2);color:var(--text-dim);border-left-color:var(--accent);">
      <b>Defectives, not defects.</b> ${all.needed} <b>claims</b> were flagged for rework, and those claims carry
      <b>${errsOnFlagged} defects</b> between them — one claim can hold several, so the two figures differ by
      design and will not match the defect breakdown.
      For reference: ${audited} claims audited, ${withErr} had at least one error, ${rows.reduce((s2,r)=>s2+r.errors.length,0)} errors in total.
    </div>`;})()}

    <div class="section-sub-title">By associate</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Associate</th><th>Team Lead</th><th class="num">Errors</th>
        <th class="num">Rework Needed</th><th class="num">Complete</th><th class="num">Pending</th>
        <th class="num">Closure %</th><th class="num">Oldest Open</th><th>Flag</th></tr></thead>
      <tbody>${list.map(b=>`<tr class="${b.open>=5?'is-outlier':''}">
        <td><b>${esc(b.name)}</b></td><td>${esc(b.tl)||'—'}</td>
        <td class="num">${b.errors}</td>
        <td class="num">${b.needed}</td>
        <td class="num">${b.done}</td>
        <td class="num">${b.open?`<span style="color:var(--bad);font-weight:700;">${b.open}</span>`:'0'}</td>
        <td class="num"><span class="stamp ${b.closure===null?'':b.closure>=90?'ok':b.closure>=75?'warn':'bad'}">${b.closure===null?'—':fmtPct(b.closure)}</span></td>
        <td class="num">${b.oldest===null?'—':`${b.oldest}d`}</td>
        <td>${b.open>=5?'<span class="tag outlier">Backlog</span>'
          : b.open>0?'<span class="tag major">Watch</span>'
          : '<span class="tag clear">Clear</span>'}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td></td>
        <td class="num">${list.reduce((s2,b)=>s2+b.errors,0)}</td>
        <td class="num">${all.needed}</td><td class="num">${all.done}</td><td class="num">${all.open}</td>
        <td class="num">${all.closure===null?'—':fmtPct(all.closure)}</td>
        <td class="num">${all.oldest===null?'—':all.oldest+'d'}</td><td></td></tr></tfoot>
    </table></div>

    <div class="section-sub-title">Which errors drive the rework</div>
    ${noErrRework.length? `<div class="data-note">
      <b>${noErrRework.length} of ${flagged.length}</b> rows flagged <b>Rework Needed = Yes</b>
      (${fmtPct(pct(noErrRework.length, flagged.length||1))}) have <b>no error recorded on the audit</b>,
      so they cannot be attributed to a category and are excluded from the table below.
      They are still counted in the totals above.
      ${pct(noErrRework.length, flagged.length||1)>=25
        ? 'A share this large usually means the column is being set to Yes on clean audits — worth confirming before these figures are used.'
        : ''}</div>`:''}
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Error Category</th><th class="num">Rework Needed</th><th class="num">% of All Rework</th>
        <th class="num">Still Pending</th><th class="num">Closure %</th></tr></thead>
      <tbody>${cats.map((c,i)=>`<tr class="${i>=CAT_SHOWN?'more-rwcat':''}" ${i>=CAT_SHOWN?'style="display:none;"':''}>
        <td><b>${esc(c.cat)}</b></td>
        <td class="num">${c.needed}</td>
        <td class="num">${fmtPct(pct(c.needed, catTotal||1))}</td>
        <td class="num">${c.open?`<span style="color:var(--bad);font-weight:700;">${c.open}</span>`:'0'}</td>
        <td class="num"><span class="stamp ${pct(c.done,c.needed)>=90?'ok':pct(c.done,c.needed)>=75?'warn':'bad'}">${fmtPct(pct(c.done,c.needed))}</span></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td>
        <td class="num">${catTotal}</td>
        <td class="num">${fmtPct(100)}</td>
        <td class="num">${cats.reduce((s2,c)=>s2+c.open,0)}</td>
        <td class="num">${fmtPct(pct(cats.reduce((s2,c)=>s2+c.done,0), catTotal||1))}</td>
      </tr></tfoot>
    </table></div>
    ${cats.length>CAT_SHOWN?`<div class="more-bar">
      <button class="more-btn" data-more="more-rwcat">+ ${cats.length-CAT_SHOWN} more categories</button>
      <span class="more-hint">click to show them all — expanded rows stay open when you print</span></div>`:''}

    <div class="insight-box"><div class="ib-title">Insights</div>
      ${all.open? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${all.open}</b> flagged claim(s) have not been corrected. The audit found the problem but the money has not moved — this is the most directly recoverable item in the report.

      </span></div>`:''}
