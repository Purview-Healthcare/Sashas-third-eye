// Attainment = claims worked ÷ target. Target is per biller per day; if the
// production sheet carries its own Target column that is used instead.
// Daily target per biller. Editable in the report and stored per project, since
// targets move between clients. Precedence: the sheet's own Target column, then
// the project's figure, then the default.
const PROD_TARGET_DEFAULT = 30;
let PROD_MIN_ATTAIN = 95;   // % of target a biller is expected to reach
let FRESHER_MONTHS  = 6;    // tenure cutoff when the roster has no Fresher column
let TARGETS = { __default__: PROD_TARGET_DEFAULT, byName: {} };
let PRODDET = [];   // one row per claim, when the production sheet provides it
function dailyTargetFor(nameKey){
  const v = TARGETS.byName ? TARGETS.byName[nameKey] : undefined;
  return (typeof v==='number' && v>0) ? v : (TARGETS.__default__ || PROD_TARGET_DEFAULT);
}
// The most specific figure wins: the sheet's own Target column, then the biller,
// then the practice they worked, then the project, then the default.
function targetForRow(p){
  if(p.target && p.target>0) return p.target;
  const own = TARGETS.byName ? TARGETS.byName[p.nameKey] : undefined;
  if(typeof own==='number' && own>0) return own;
  const prac = (TARGETS.byPractice||{})[p.practice||''];
  if(typeof prac==='number' && prac>0) return prac;
  const proj = (TARGETS.byProject||{})[p.project||''];
  if(typeof proj==='number' && proj>0) return proj;
  return TARGETS.__default__ || PROD_TARGET_DEFAULT;
}
function targetSourceFor(p){
  if(p.target && p.target>0) return 'sheet';
  const own=(TARGETS.byName||{})[p.nameKey];
  if(typeof own==='number' && own>0) return 'biller';
  const prac=(TARGETS.byPractice||{})[p.practice||''];
  if(typeof prac==='number' && prac>0) return 'practice';
  const proj=(TARGETS.byProject||{})[p.project||''];
  if(typeof proj==='number' && proj>0) return 'project';
  return 'default';
}
// PROD_MIN_ATTAIN is set in the Settings card

function prodDaily(){
  // one row per biller per day, in the selected range
  const m=new Map();
  for(const p of scopeProd()){
    const k=p.nameKey+'||'+p.dateKey;
    if(!m.has(k)) m.set(k,{nameKey:p.nameKey, name:p.name, dateKey:p.dateKey,
      dwT:p.dwT, project:p.project, count:0, target:0});
    const r=m.get(k);
    r.count += p.count;
    r.target += targetForRow(p);
  }
  return [...m.values()];
}
function prodByBiller(){
  const days = prodDaily();
  const g = groupBy(days, r=>r.nameKey);
  const out=[];
  for(const [nk, rs] of g){
    const claims = rs.reduce((s,r)=>s+r.count,0);
    const target = rs.reduce((s,r)=>s+r.target,0);
    const ro = rosterFor(nk);
    const perDay = rs.map(r=>r.count).sort((a,b)=>a-b);
    out.push({nameKey:nk, name:rs[0].name, teamLead:(scopeQA().find(q=>q.nameKey===nk)||{}).teamLead||'',
      status: ro?ro.status:'', days:rs.length, claims, target,
      attain: target>0 ? pct(claims,target) : null,
      avgDay: rs.length ? +(claims/rs.length).toFixed(1) : 0,
      best: perDay.length?perDay[perDay.length-1]:0,
      worst: perDay.length?perDay[0]:0,
      shortDays: rs.filter(r=>r.target>0 && pct(r.count,r.target) < PROD_MIN_ATTAIN).length,
      rows: rs});
  }
  return out.sort((a,b)=>(a.attain??999)-(b.attain??999));
}


// A production outlier is the volume equivalent of the QA one: below the minimum
// for two or more consecutive weeks, so a single bad week is not treated as a trend.
function prodOutliers(){
  const rows = prodDaily().filter(r=>r.dateKey);
  const byName = groupBy(rows, r=>r.nameKey);
  const out=[];
  for(const [nk, rs] of byName){
    const byW = groupBy(rs, r=>weekOfDate(r.dateKey)||'(no week)');
    const weeks=[...byW.entries()].map(([wk,ws])=>{
      const cl=ws.reduce((s,r)=>s+r.count,0), tg=ws.reduce((s,r)=>s+r.target,0);
      return {wk, attain: tg>0?pct(cl,tg):null, claims:cl, target:tg};
    }).sort((a,b)=>a.wk<b.wk?-1:1);
    let cur=[], longest=[];
    weeks.forEach(w=>{
      if(w.attain!==null && w.attain<PROD_MIN_ATTAIN){ cur.push(w); if(cur.length>longest.length) longest=[...cur]; }
      else cur=[];
    });
    if(longest.length>=2){
      out.push({nameKey:nk, name:rs[0].name, weeks:longest,
        latest: longest[longest.length-1].attain, count:longest.length});
    }
  }
  return out.sort((a,b)=>a.latest-b.latest);
}

// Editing a target or a roster field rebuilds the whole report, which used to
// throw the reader back to the top with every group closed. This keeps the view
// where it was: same scroll position, same rows open, same field focused.
const EXPAND_KEYS = ['data-ag','data-cc','data-tc','data-ar','data-cp','data-nc','data-ts','data-aud'];
function snapshotView(){
  const open=[];
  EXPAND_KEYS.forEach(k=>{
    document.querySelectorAll(`tr[${k}]`).forEach(tr=>{
      if(tr.classList.contains('row-child') && tr.style.display!=='none')
        open.push(k+'='+tr.getAttribute(k));
    });
  });
  const el=document.activeElement;
  return { y: window.scrollY || document.documentElement.scrollTop || 0,
           open: [...new Set(open)],
           focus: el && el.dataset ? (el.dataset.tgtname||el.dataset.tgt||el.dataset.rk||'') : '',
           field: el && el.dataset ? (el.dataset.rf||'') : '' };
}
function restoreView(snap){
  if(!snap) return;
  snap.open.forEach(sel=>{
    const [k,v]=sel.split('=');
    document.querySelectorAll(`tr[${k}="${v}"]`).forEach(tr=>{
      if(tr.classList.contains('row-child')) tr.style.display='table-row';
    });
    const car=document.querySelector(`[data-${k.replace('data-','')}caret="${v}"]`);
    if(car) car.innerHTML='&#9662;';
  });
  window.scrollTo(0, snap.y);
  if(snap.focus){
    const sel = snap.field
      ? `[data-rk="${snap.focus}"][data-rf="${snap.field}"]`
      : `[data-tgtname="${snap.focus}"], [data-tgt="${snap.focus}"]`;
    const el=document.querySelector(sel);
    if(el && el.focus) { try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }
  }
}
function renderKeepingView(){
  const snap=snapshotView();
  render();
  requestAnimationFrame(()=>restoreView(snap));
}
document.addEventListener('change', async e=>{
  const f=e.target.closest('[data-tgt], [data-tgtname], [data-tgtproj], [data-tgtprac]');
  if(!f) return;
  const v=parseFloat(f.value);
  if(f.dataset.tgtproj!==undefined){
    TARGETS.byProject = TARGETS.byProject || {};
    if(isFinite(v)&&v>0) TARGETS.byProject[f.dataset.tgtproj]=v;
    else delete TARGETS.byProject[f.dataset.tgtproj];
  } else if(f.dataset.tgtprac!==undefined){
    TARGETS.byPractice = TARGETS.byPractice || {};
    if(isFinite(v)&&v>0) TARGETS.byPractice[f.dataset.tgtprac]=v;
    else delete TARGETS.byPractice[f.dataset.tgtprac];
  } else if(f.dataset.tgt==='__default__'){
    TARGETS.__default__ = (isFinite(v)&&v>0)? v : PROD_TARGET_DEFAULT;
  } else if(f.dataset.tgtname){
    TARGETS.byName = TARGETS.byName || {};
    TARGETS.notes  = TARGETS.notes  || {};
    const nk=f.dataset.tgtname;
    if(isFinite(v)&&v>0){
      const was = TARGETS.byName[nk];
      TARGETS.byName[nk]=v;
      // a changed target changes everyone's attainment, so record the reason
      if(was!==v){
        const why = (typeof prompt==='function')
          ? prompt(`Target for this biller set to ${v}/day. Why? (optional — shown in the report)`,
                   TARGETS.notes[nk]||'')
          : null;
        if(why!==null){
          const txt=String(why||'').trim();
          if(txt) TARGETS.notes[nk] = {text:txt, at:new Date().toISOString().slice(0,10), value:v};
          else delete TARGETS.notes[nk];
        }
      }
    } else {
      delete TARGETS.byName[nk];
      delete TARGETS.notes[nk];
    }
  }
  await sset(K.targets, TARGETS);

});
/* ==================== CLAIM & COMMENT ANALYSIS ==================== */
// Only runs when the production sheet is one row per claim with a claim id
// and/or a comment column. Duplicate touches are wasted capacity; repeated
// comment text usually means notes are being pasted rather than written.
function scopePDetail(){
  return PRODDET.filter(r=>
    (CLIENT==='__all__'   || !r.project || r.project===CLIENT) &&
    (ASSOC==='__all__'    || r.nameKey===ASSOC) &&
    (TEAMLEAD==='__all__' || teamLeadOf(r.nameKey)===TEAMLEAD) &&
    inProdRange(r.dateKey));
}
function normNote(t){
  return String(t||'').toLowerCase()
    .replace(/\d+/g,'#')            // claim numbers and dates differ; wording does not
    .replace(/[^a-z#\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}

// Comment categories. Order matters — the first match wins, so the more
// specific patterns sit above the general ones.
const NOTE_BUCKETS = [
  {key:'voicemail',  label:'Voicemail left',        tone:'warn',
   re:/voice\s*mail|voicemail|\bvm\b|left (a )?(msg|message)|lvm|leave (a )?message/i,
   note:'No information obtained — the claim still needs a follow-up touch.'},
  {key:'closed',     label:'Payer / office closed', tone:'warn',
   re:/\bclosed\b|holiday|after (business )?hours|non[- ]business|outside business/i,
   note:'Call placed outside the payer working window.'},
  {key:'noanswer',   label:'No answer / long hold', tone:'warn',
   re:/no answer|not answer|nobody|no response|long hold|on hold|ivr|call (drop|disconnect)|disconnected|line busy/i,
   note:'Time spent with nothing obtained.'},
  {key:'needhelp',   label:'Need help / escalation',tone:'bad',
   re:/need help|needs help|help needed|escalat|supervisor|team lead|guidance|clarification|not sure|unable to (determine|decide)|query/i,
   note:'Blocked and waiting on someone else — these age quietly.'},
  {key:'system',     label:'Portal / system issue', tone:'bad',
   re:/portal (down|issue|error)|system (down|issue|error)|website (down|not)|technical (issue|error)|unable to (access|login|log in)|access denied|maintenance/i,
   note:'Blocked by tooling rather than by the payer.'},
  {key:'records',    label:'Records / documentation needed', tone:'nonfatal',
   re:/medical record|records requested|documentation (needed|required|requested)|itemi[sz]ed|additional info|attach/i,
   note:'Waiting on documentation from the client or provider.'},
  {key:'followup',   label:'Follow-up set',          tone:'nonfatal',
   re:/follow\s*up|tickler|revisit|re-?check|call back|callback|next touch/i,
   note:'Deliberately deferred.'},
  {key:'resolved',   label:'Status obtained / actioned', tone:'clear',
   re:/paid|denied|processed|in process|adjudicat|appeal (filed|sent)|claim (sent|submitted|refiled|corrected)|status (received|obtained)|eob|check\s*#|posted/i,
   note:'A real outcome was recorded.'}
];
function bucketOf(note){
  const t=String(note||'').trim();
  if(!t) return null;
  for(const b of NOTE_BUCKETS) if(b.re.test(t)) return b;
  return {key:'other', label:'Other / unclassified', tone:'', note:'Did not match a known pattern.'};
}

function claimAnalysisHTML(){
  const det = scopePDetail();
  const hasClaim = det.some(r=>r.claimId || r.uid);
  const hasNote  = det.some(r=>r.note);
  if(!det.length || (!hasClaim && !hasNote)){
    return `<div class="card needs-data"><h3>Claim &amp; Comment Analysis</h3>
      <div class="card-sub">Not available — the production sheet has no claim id or comment column.</div>
      <div class="nd-body">With one row per claim this finds duplicate touches (the same claim worked twice),
        duplicate comment text (notes pasted rather than written), and what the comments actually say —
        voicemails, closed offices, blocked claims.
        <div class="nd-cols">Include a claim column (<b>Claim ID</b>, <b>Charge ID</b>, <b>ICN</b> or <b>Account No</b>)
          and a comment column (<b>Comments</b>, <b>Notes</b>, <b>Remarks</b> or <b>Action Taken</b>) in the production upload.</div>
      </div></div>`;
  }

  /* ---- duplicate claims, matched on EITHER identifier ----
     Rows are linked when they share a claim id OR a unique id, so a row that
     fills only one of the two is still caught. Linking (rather than grouping
     on one column) also means a claim reached through both identifiers is
     counted once, not twice. ---- */
  const idRows = det.filter(r=>r.claimId || r.uid);
  const noId   = det.length - idRows.length;
  const parent = idRows.map((_,i)=>i);
  const find = a => { while(parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; };
  const union = (a,b) => { a=find(a); b=find(b); if(a!==b) parent[b]=a; };
  const seen = new Map();
  idRows.forEach((r,i)=>{
    for(const key of [r.claimId?('C:'+r.claimId):null, r.uid?('U:'+r.uid):null]){
      if(!key) continue;
      if(seen.has(key)) union(seen.get(key), i); else seen.set(key, i);
    }
  });
  const groups = new Map();
  idRows.forEach((r,i)=>{
    const root = find(i);
    if(!groups.has(root)) groups.set(root, []);
    groups.get(root).push(r);
  });
  const dups=[...groups.values()].filter(v=>v.length>1).map(v=>{
    const claims=[...new Set(v.map(x=>x.claimId).filter(Boolean))];
    const uids  =[...new Set(v.map(x=>x.uid).filter(Boolean))];
    // which identifier actually caused the match
    const byClaim = claims.some(c=>v.filter(x=>x.claimId===c).length>1);
    const byUid   = uids.some(u=>v.filter(x=>x.uid===u).length>1);
    return {
      label: claims[0] || uids[0] || '(no id)',
      claims, uids,
      matchedOn: byClaim && byUid ? 'Both' : byClaim ? 'Claim ID' : 'Unique ID',
      touches: v.length,
      billers:[...new Set(v.map(x=>x.name))],
      dates:[...new Set(v.map(x=>x.dateKey).filter(Boolean))].sort(),
      sameDay:new Set(v.map(x=>x.dateKey)).size===1,
      sameBiller:new Set(v.map(x=>x.nameKey)).size===1
    };
  }).sort((a,b)=>b.touches-a.touches);
  const wasted = dups.reduce((s,d)=>s+(d.touches-1),0);
  const DUP_SHOWN=8;

  /* ---- duplicate comments (per biller) ---- */
  const byText = new Map();
  det.filter(r=>r.note && normNote(r.note).length>12).forEach(r=>{
    const k = r.nameKey+'||'+normNote(r.note);
    if(!byText.has(k)) byText.set(k, {name:r.name, nameKey:r.nameKey, note:r.note, n:0, claims:new Set()});
    const x=byText.get(k); x.n++; if(r.claimId) x.claims.add(r.claimId);
  });
  const dupNotes=[...byText.values()].filter(x=>x.n>1).sort((a,b)=>b.n-a.n);
  const pastedTouches = dupNotes.reduce((s,x)=>s+(x.n-1),0);
  const NOTE_SHOWN=8;

  /* ---- comment categories ---- */
  const withNote = det.filter(r=>r.note && r.note.trim());
  const counts = new Map();
  withNote.forEach(r=>{
    const b=bucketOf(r.note);
    if(!counts.has(b.key)) counts.set(b.key, {...b, n:0, people:new Map()});
    const c=counts.get(b.key); c.n++;
    c.people.set(r.name,(c.people.get(r.name)||0)+1);
  });
  const buckets=[...counts.values()].sort((a,b)=>b.n-a.n);
  const unproductive = buckets.filter(b=>['voicemail','closed','noanswer','system'].includes(b.key))
                              .reduce((s,b)=>s+b.n,0);

  const tile=(n,l,tone)=>`<div class="fb-tile ${tone}"><div class="ft-n">${n}</div><div class="ft-l">${esc(l)}</div></div>`;

  return `<div class="card"><h3>Claim &amp; Comment Analysis</h3>
    <div class="card-sub">${det.length} claim row(s) in range · duplicates matched on <b>claim id</b> and <b>unique id</b>, so a row filling only one is still caught${hasClaim?'':' · neither identifier column is present, so duplicates cannot be checked'}${hasNote?'':' · no comment column, so comments cannot be read'}</div>
    ${noId? `<div class="data-note"><b>${noId}</b> of ${det.length} row(s) carry neither a claim id nor a unique id, so they are excluded from the duplicate check. Fill at least one identifier to cover them.</div>`:''}

    <div class="fb-tiles">
      ${tile(dups.length, 'claims touched more than once', dups.length?'warn':'good')}
      ${tile(wasted, 'wasted touches', wasted?'bad':'good')}
      ${tile(dupNotes.length, 'repeated comment texts', dupNotes.length?'warn':'good')}
      ${tile(withNote.length? fmtPct(pct(unproductive, withNote.length)) : '—', 'touches with no outcome',
        withNote.length && pct(unproductive,withNote.length)>=35?'bad':'')}
    </div>

    ${hasClaim? `
    <div class="section-sub-title">Duplicate claims</div>
    ${dups.length? `<div class="table-scroll"><table class="data">
      <thead><tr><th>Identifier</th><th>Matched On</th><th class="num">Touches</th>
        <th>Worked By</th><th>Dates</th><th>Read</th></tr></thead>
      <tbody>${dups.map((d,i)=>`<tr class="${i>=DUP_SHOWN?'more-dup':''} ${d.touches>2?'is-outlier':''}" ${i>=DUP_SHOWN?'style="display:none;"':''}>
        <td><b>${esc(d.label)}</b>${(d.claims.length+d.uids.length)>1?`<span style="color:var(--text-faint);font-weight:400;"> +${d.claims.length+d.uids.length-1}</span>`:''}</td>
        <td><span class="tag ${d.matchedOn==='Both'?'fatal':'nonfatal'}">${esc(d.matchedOn)}</span></td>
        <td class="num">${d.touches}</td>
        <td style="white-space:normal;">${d.billers.map(esc).join(', ')}</td>
        <td style="white-space:normal;">${d.dates.map(x=>esc(fmtD(x))).join(', ')||'—'}</td>
        <td>${d.sameBiller && d.sameDay ? '<span class="tag major">Same biller, same day — likely a re-open</span>'
           : d.sameBiller ? '<span class="tag major">Same biller, different days</span>'
           : `<span class="tag outlier">${d.billers.length} billers touched it — allocation gap</span>`}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td></td>
        <td class="num">${dups.reduce((s,d)=>s+d.touches,0)}</td>
        <td colspan="3">${wasted} touch(es) beyond the first${noId?` · ${noId} row(s) had no identifier and could not be checked`:''}</td></tr></tfoot>
    </table></div>
    ${dups.length>DUP_SHOWN?`<div class="more-bar">
      <button class="more-btn" data-more="more-dup">+ ${dups.length-DUP_SHOWN} more duplicate claims</button>
      <span class="more-hint">click to show them all — expanded rows stay open when you print</span></div>`:''}`
    : `<div style="font-size:12.5px;color:var(--good);font-weight:600;">No claim was worked more than once in this range.</div>`}`
    :''}

    ${hasNote? `
    <div class="section-sub-title">Repeated comment text</div>
    ${dupNotes.length? `<div class="table-scroll"><table class="data">
      <thead><tr><th>Biller</th><th class="num">Times Used</th><th class="num">Claims</th><th>Comment</th></tr></thead>
      <tbody>${dupNotes.map((x,i)=>`<tr class="${i>=NOTE_SHOWN?'more-note':''} ${x.n>=5?'is-outlier':''}" ${i>=NOTE_SHOWN?'style="display:none;"':''}>
        <td><b>${esc(x.name)}</b></td>
        <td class="num">${x.n}</td>
        <td class="num">${x.claims.size||'—'}</td>
        <td style="white-space:normal;max-width:420px;color:var(--text-dim);">${esc(x.note.slice(0,160))}${x.note.length>160?'…':''}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${dupNotes.reduce((s,x)=>s+x.n,0)}</td>
        <td colspan="2">${pastedTouches} comment(s) beyond the first use</td></tr></tfoot>
    </table></div>
    ${dupNotes.length>NOTE_SHOWN?`<div class="more-bar">
      <button class="more-btn" data-more="more-note">+ ${dupNotes.length-NOTE_SHOWN} more repeated comments</button>
      <span class="more-hint">click to show them all — expanded rows stay open when you print</span></div>`:''}`
    : `<div style="font-size:12.5px;color:var(--good);font-weight:600;">No comment text was reused. Notes look individually written.</div>`}

    <div class="section-sub-title">What the comments say</div>
    <div class="data-note" style="background:var(--panel-2);color:var(--text-dim);border-left-color:var(--accent);">
      Rows in <b>red</b> are the two blocked categories — <b>Need help / escalation</b> and <b>Portal / system issue</b>.
      They are highlighted because nobody owns them: the biller cannot proceed and the claim sits until someone else acts.
      The other categories are outcomes, not blockages.
    </div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Category</th><th class="num">Touches</th><th class="num">Share</th>
        <th>Main Contributors</th><th>What it means</th></tr></thead>
      <tbody>${buckets.map(b=>`<tr class="${['needhelp','system'].includes(b.key)?'is-outlier':''}">
        <td><span class="tag ${b.tone}">${esc(b.label)}</span></td>
        <td class="num">${b.n}</td>
        <td class="num">${fmtPct(pct(b.n, withNote.length||1))}</td>
        <td style="white-space:normal;">${[...b.people.entries()].sort((a,c)=>c[1]-a[1]).slice(0,3)
          .map(([nm,c])=>`${esc(nm)} <span style="color:var(--text-faint);">(${c})</span>`).join(', ')}</td>
        <td style="white-space:normal;color:var(--text-dim);">${esc(b.note)}</td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td class="num">${withNote.length}</td>
        <td class="num">${fmtPct(100)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>`
    :''}

    <div class="insight-box"><div class="ib-title">What to do with this</div>
      ${wasted? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${wasted}</b> touch(es) went to claims that had already been worked${dups.filter(d=>!d.sameBiller).length?`, and <b>${dups.filter(d=>!d.sameBiller).length}</b> of those involved two different billers — that is a queue allocation problem, not a biller one`:''}. At your current rate that is roughly <b>${(wasted/Math.max(1,det.length)*100).toFixed(1)}%</b> of capacity spent twice.
      </span></div>`:''}
      ${dupNotes.length? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${dupNotes.length}</b> comment text(s) were reused across claims${dupNotes[0]?`, most by <b>${esc(dupNotes[0].name)}</b> (${dupNotes[0].n} times)`:''}. Identical wording on different claims usually means the note was pasted — the next person cannot tell what was actually checked. Worth reading a few before treating it as misconduct; some payers genuinely produce identical outcomes.
      </span></div>`:''}
      ${withNote.length && pct(unproductive,withNote.length)>=25? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${fmtPct(pct(unproductive, withNote.length))}</b> of touches ended with no information obtained — voicemail, a closed office, no answer, or a system problem. That is capacity spent without moving a claim, and most of it is schedulable: call inside the payer's window and the number drops.
      </span></div>`:''}
      ${(counts.get('needhelp')||counts.get('system'))? `<div class="ib-row"><span class="ib-dot"></span><span>
        <b>${(counts.get('needhelp')?.n||0)+(counts.get('system')?.n||0)}</b> touch(es) are blocked waiting on help or on a system. These age quietly because nobody owns them — worth a daily sweep.
      </span></div>`:''}
      <div class="ib-row"><span class="ib-dot"></span><span>
        Categories are matched on wording, so a comment phrased unusually lands in <b>Other</b>. A large Other share means the patterns need widening, not that the work is unclassifiable.
      </span></div>
    </div></div>`;
}

/* ==================== CALL HANDLING TIME ==================== */
// Start, End and Total Duration record a CALL, not the whole claim. Portal and
// web work carries no call, so it never enters the AHT denominator — including
// it would understate handle time and make everyone look faster than they are.
function isCallRow(r){
  if(r.mode){
    // "Non Call" and "No call" both contain "call", so the negation is tested
    // first — otherwise every row reads as a call
    if(/\b(non[\s\-]?call|no[\s\-]?call|not[\s\-]?called|portal|web|analysis|email|fax)\b/i.test(r.mode)) return false;
    return /call|phone|voice|ivr|dial/i.test(r.mode);
  }
  return r.mins > 0;          // no Mode column: a timed row is treated as a call
}
function hhmmM(m){ return `${Math.floor(m/60)}h ${Math.round(m%60)}m`; }

function callTimeHTML(){
  const det = scopePDetail();
  const calls = det.filter(r=>isCallRow(r));
  const timed = calls.filter(r=>r.mins>0);
  const nonCall = det.filter(r=>!isCallRow(r));
  if(!timed.length) return `<div class="card needs-data"><h3>Call &amp; Non-Call Work</h3>
    <div class="card-sub">Not available — no call durations on the production rows.</div>
    <div class="nd-body">Where <b>Mode of Work</b> is a call, Start, End and Total Duration give average handle time
      and split the day between phone work and everything else.
      <div class="nd-cols">Include <b>Mode of Work</b>, <b>Start Time</b>, <b>End Time</b> and <b>Total Duration</b>
        on the production sheet.</div></div></div>`;

  const hasMode = det.some(r=>r.mode);
  const tMins = timed.reduce((s,r)=>s+r.mins,0);
  const teamAht = timed.length? +(tMins/timed.length).toFixed(1) : 0;
  const nonMins = nonCall.reduce((s,r)=>s+(r.mins||0),0);


  const qaBy = groupBy(scopeQA(), r=>r.nameKey);
  const g = groupBy(det, r=>r.nameKey);
  const list=[];
  for(const [nk, rs] of g){
    const c  = rs.filter(isCallRow);
    const ct = c.filter(r=>r.mins>0);
    const nc = rs.filter(r=>!isCallRow(r));
    const mins = ct.reduce((s,r)=>s+r.mins,0);
    const days = new Set(rs.map(r=>r.dateKey).filter(Boolean)).size || 1;
    const qrs = qaBy.get(nk);
    list.push({nameKey:nk, name:rs[0].name, tl:teamLeadOf(nk),
      touches: rs.length, calls: c.length, nonCalls: nc.length,
      mins, aht: ct.length? +(mins/ct.length).toFixed(1) : null,
      callsPerHour: mins>0 ? +(ct.length/(mins/60)).toFixed(1) : 0,
      talkPerDay: +(mins/60/days).toFixed(1),
      longest: ct.length? Math.max(...ct.map(r=>r.mins)) : 0,
      callShare: rs.length? pct(c.length, rs.length) : null,
      score: qrs&&qrs.length? avgScore(qrs) : null,
      nonMins: nc.reduce((s,r)=>s+(r.mins||0),0)});
  }
  list.sort((a,b)=>(b.aht??-1)-(a.aht??-1));
  const fastLow = list.filter(x=>x.aht!==null && x.score!==null && x.aht < teamAht*0.75 && x.score < OUTLIER_THRESHOLD);

  const bigCard = (title, tone, lines) => `<div class="mode-card ${tone}">
    <div class="mc-title">${esc(title)}</div>
    <div class="mc-rows">${lines.map(([l,v])=>`<div class="mc-row"><span>${esc(l)}</span><b>${v}</b></div>`).join('')}</div>
  </div>`;

  return `<div class="card"><h3>Call &amp; Non-Call Work</h3>
    <div class="card-sub">${det.length} claim(s) worked · split by how the work was done${hasMode?'':' · no Mode of Work column, so any timed row counts as a call'}</div>

    <div class="mode-split">
      ${bigCard('Call work', 'is-call', [
        ['Claims worked by call', calls.length],
        ['Share of all claims', det.length? fmtPct(pct(calls.length, det.length)) : '—'],
        ['Total talk time', hhmmM(tMins)],
        ['Average handle time (AHT)', teamAht+'m'],
        ['Calls per talk hour', tMins>0? (+(timed.length/(tMins/60)).toFixed(1)) : '—'],
        ['Longest single call', timed.length? Math.round(Math.max(...timed.map(r=>r.mins)))+'m' : '—']
      ])}
      ${bigCard('Non-call work', 'is-noncall', [
        ['Claims worked without a call', nonCall.length],
        ['Share of all claims', det.length? fmtPct(pct(nonCall.length, det.length)) : '—'],
        ['Time recorded', nonMins>0? hhmmM(nonMins) : 'none — no call to time'],
        ['Counted in AHT', 'No, by design'],
        ['Why it matters', 'Cheaper than phone work'],
        ['', '']
      ])}
    </div>

    <div class="section-sub-title">By biller — click a name for the mode split</div>
    <div class="table-scroll"><table class="data">
      <thead><tr><th>Biller / Mode</th><th>Team Lead</th><th class="num">Claims</th>
        <th class="num">Calls</th><th class="num">Non-Call</th><th class="num">% by Call</th>
        <th class="num">Talk Time</th><th class="num">AHT</th><th class="num">Calls / Talk Hr</th>
        <th class="num">Talk Hrs / Day</th><th class="num">Longest</th><th class="num">QA Score</th><th>Read</th></tr></thead>
      <tbody>${list.map((x,i)=>{
        const fast = x.aht!==null && x.aht < teamAht*0.75;
        const slow = x.aht!==null && x.aht > teamAht*1.35;
        const head = `<tr class="row-parent cm-toggle ${fast && x.score!==null && x.score<OUTLIER_THRESHOLD?'is-outlier':''}"
            data-cm="${i}" style="cursor:pointer;">
          <td><span class="aud-caret" data-cmcaret="${i}">&#9656;</span> <b>${esc(x.name)}</b></td>
          <td>${esc(x.tl)||'—'}</td>
          <td class="num">${x.touches}</td>
          <td class="num">${x.calls}</td>
          <td class="num">${x.nonCalls}</td>
          <td class="num">${x.callShare===null?'—':fmtPct(x.callShare)}</td>
          <td class="num">${hhmmM(x.mins)}</td>
          <td class="num">${x.aht===null?'—':x.aht+'m'}</td>
          <td class="num">${x.callsPerHour||'—'}</td>
          <td class="num">${x.talkPerDay}</td>
          <td class="num">${x.longest? Math.round(x.longest)+'m':'—'}</td>
          <td class="num">${x.score===null?'—':`<span class="stamp ${scoreClass(x.score)}">${fmtPct(x.score)}</span>`}</td>
          <td>${x.score===null? '<span class="tag clear">No audits</span>'
             : fast && x.score<OUTLIER_THRESHOLD ? '<span class="tag outlier">Short calls, low score</span>'
             : fast ? '<span class="tag clear">Efficient on calls</span>'
             : slow && x.score>=OUTLIER_THRESHOLD ? '<span class="tag major">Long calls, accurate</span>'
             : slow ? '<span class="tag outlier">Long calls, low score</span>'
             : '<span class="tag clear">Around the average</span>'}</td>
        </tr>`;
        const kid = (label, n, mins, isCall) => `<tr class="row-child cm-row" data-cm="${i}" style="display:none;">
          <td><span class="child-mark">&#8226;</span>${esc(label)}</td>
          <td>${isCall? '<span class="tag nonfatal">call</span>':'<span class="tag clear">no call</span>'}</td>
          <td class="num">${n}</td>
          <td class="num">${isCall? n : 0}</td>
          <td class="num">${isCall? 0 : n}</td>
          <td class="num">${x.touches? fmtPct(pct(n, x.touches)):'—'}</td>
          <td class="num">${mins? hhmmM(mins):'—'}</td>
          <td class="num">${mins&&n? (+(mins/n).toFixed(1))+'m' : '—'}</td>
          <td class="num">—</td><td class="num">—</td><td class="num">—</td>
          <td class="num">—</td><td>—</td>
        </tr>`;
        const kids = kid('Call', x.calls, x.mins, true) + kid('Non-call', x.nonCalls, x.nonMins, false);
        return head + kids;
      }).join('')}</tbody>
      <tfoot><tr><td>TOTAL</td><td></td>
        <td class="num">${det.length}</td>
        <td class="num">${calls.length}</td>
        <td class="num">${nonCall.length}</td>
        <td class="num">${det.length? fmtPct(pct(calls.length, det.length)):'—'}</td>
        <td class="num">${hhmmM(tMins)}</td>
        <td class="num">${teamAht}m<span class="foot-note">weighted</span></td>
        <td class="num">${tMins>0? (+(timed.length/(tMins/60)).toFixed(1)) : '—'}</td>
        <td class="num na-cell">varies</td>
        <td class="num">${timed.length? Math.round(Math.max(...timed.map(r=>r.mins)))+'m':'—'}</td>
        <td class="num">${fmtPct(avgScore(scopeQA()))}</td><td></td></tr></tfoot>
    </table></div>
    <div class="col-legend">
      <div class="cl-title">What these mean</div>
      <div class="cl-grid">
        <div><b>Calls</b> claims worked by phone, from Mode of Work${hasMode?'':' — inferred from a duration being present'}</div>
        <div><b>Non-Call</b> any claim worked without a call</div>
        <div><b>% by Call</b> share of that biller's claims that needed a call at all</div>
        <div><b>AHT</b> talk time &divide; calls. Non-call claims are excluded, so it is not diluted</div>
        <div><b>Calls / Talk Hr</b> calls per hour of talk time, not per hour of shift</div>
        <div><b>Talk Hrs / Day</b> talk time &divide; days worked. Low is normal — most of a day is not on the phone</div>
      </div>
    </div>
    <div class="insight-box"><div class="ib-title">Reading this</div>
      ${fastLow.length? `<div class="ib-row"><span class="ib-dot"></span><span>
        ${fastLow.map(x=>`<b>${esc(x.name)}</b> (${x.aht}m AHT, ${fmtPct(x.score)})`).join('; ')} —
        well under the team's ${teamAht}m and scoring below ${OUTLIER_THRESHOLD}%. Short calls with a low score usually
        mean the call ended before the information was obtained, so the claim comes back.
      </span></div>`:`<div class="ib-row"><span class="ib-dot"></span><span>
        No biller is running materially short calls with a low score.
      </span></div>`}
      <div class="ib-row"><span class="ib-dot"></span><span>
        <b>${nonCall.length}</b> claim(s) (${det.length? fmtPct(pct(nonCall.length,det.length)):'—'}) were worked without a call.
        They carry no talk time by design and are excluded from AHT — a high non-call share is usually good, since work
        resolved without the phone is faster and cheaper.
      </span></div>
      <div class="ib-row"><span class="ib-dot"></span><span>
        AHT is not a target on its own. An aged, high-balance claim with several CPTs legitimately takes longer than a
        status check, so compare like with like before acting on a number.
      </span></div>
    </div></div>`;
}

function prodDashboardHTML(){
  const days = prodDaily();
  if(!days.length) return `<div class="empty"><h2>No production data loaded yet</h2>
    <p>Upload a Production Sheet to see attainment against the ${PROD_MIN_ATTAIN}% minimum.</p></div>`;
  const list = prodByBiller();
  const claims = list.reduce((s,b)=>s+b.claims,0);
  const target = list.reduce((s,b)=>s+b.target,0);
  const attain = target>0 ? pct(claims,target) : null;
  const below  = list.filter(b=>b.attain!==null && b.attain < PROD_MIN_ATTAIN);
  const dayCount = new Set(days.map(d=>d.dateKey)).size;
  const ri = rangeInfo();

  // day-by-day totals
  const byDate = groupBy(days, r=>r.dateKey);
  const dayRows=[...byDate].map(([dk,rs])=>({
    dateKey:dk, billers:new Set(rs.map(r=>r.nameKey)).size,
    claims:rs.reduce((s,r)=>s+r.count,0),
    target:rs.reduce((s,r)=>s+r.target,0)
  })).sort((a,b)=>a.dateKey<b.dateKey?-1:1)
    .map(d=>({...d, attain: d.target>0?pct(d.claims,d.target):null}));

  const bandFor = a => a===null ? '' : a>=100 ? 'ok' : a>=PROD_MIN_ATTAIN ? 'ok' : a>=80 ? 'warn' : 'bad';
  const outliers = prodOutliers();
  const outlierBanner = outliers.length
    ? `<div class="banner bad"><div class="bn-title">${outliers.length} PRODUCTION OUTLIER${outliers.length!==1?'S':''} — BELOW ${PROD_MIN_ATTAIN}% FOR 2+ CONSECUTIVE WEEKS</div>
        <div class="bn-body">${outliers.slice(0,6).map((o,i)=>`${i+1}) ${esc(o.name)} — ${o.count} wks, latest ${fmtPct(o.latest)}`).join(' &nbsp;·&nbsp; ')}${outliers.length>6?` &nbsp;·&nbsp; +${outliers.length-6} more`:''}</div></div>`

/* ============================ COMBINED INSIGHTS ============================ */
// Reads the QA sheet and the production sheet together. Neither alone answers
// "is this person/project actually doing well" — volume without quality is rework
// waiting to happen, and quality without volume is capacity sitting idle.
function combinedByAssociate(){
  const qa = scopeQA(), pr = prodByBiller();
  const byName = groupBy(qa, r=>r.nameKey);
  const prMap = new Map(pr.map(b=>[b.nameKey,b]));
  const rep = repeatCountByAssociate(qa);
  const rw  = (nk)=>{
    const rs = qa.filter(r=>r.nameKey===nk && rwYes(r.reworkNeeded));
    const done = rs.filter(r=>rwYes(r.reworkComplete)).length;
    return {needed:rs.length, done, open:rs.filter(r=>rwNo(r.reworkComplete)).length,
            closure: rs.length? pct(done, rs.length) : null};
  };
  const keys = new Set([...byName.keys(), ...prMap.keys()]);
  const out=[];
  for(const nk of keys){
    const rs = byName.get(nk) || [];
    const p  = prMap.get(nk);
    const fbShareRows = rs.filter(r=>r.errors.length);
    const fbShared = fbShareRows.filter(r=>fbShared_(r)).length;
    out.push({
      nameKey:nk,
      name: (rs[0] && rs[0].name) || (p && p.name) || nk,
      teamLead: teamLeadOf(nk),
      project: (rs[0] && rs[0].project) || (p && p.project) || '',
      status: (rosterFor(nk)||{}).status || '',
      audits: rs.length,
      score: rs.length? avgScore(rs) : null,
      errors: rs.reduce((s,r)=>s+r.errors.length,0),
      fatal: rs.reduce((s,r)=>s+r.errors.filter(e=>e.bucket==='fatal').length,0),
      repeats: rep.get(nk)||0,
      claims: p? p.claims : 0,
      target: p? p.target : 0,
      attain: p? p.attain : null,
      days:   p? p.days : 0,
      rework: rw(nk),
      fbShare: fbShareRows.length? pct(fbShared, fbShareRows.length) : null
    });
  }
  return out;
}
function fbShared_(r){ return fbShared(r.feedbackStatus); }

function verdictFor(x){
  const lowQ = x.score!==null && x.score < OUTLIER_THRESHOLD;
  const lowP = x.attain!==null && x.attain < PROD_MIN_ATTAIN;
  if(x.score===null && x.attain===null) return {k:'none', label:'No data', tone:'clear'};
  if(x.score===null) return {k:'noqa', label:'Production only — never audited', tone:'major'};
  if(x.attain===null) return {k:'noprod', label:'Audited, no production data', tone:'major'};
  if(lowQ && lowP)  return {k:'both',  label:'Short on both', tone:'outlier'};
  if(lowQ && !lowP) return {k:'vol',   label:'Volume held, quality slipping', tone:'outlier'};
  if(!lowQ && lowP) return {k:'qual',  label:'Accurate but under volume', tone:'major'};
  return {k:'ok', label:'Meeting both', tone:'clear'};
}
function suggestionFor(x, v){
  switch(v.k){
    case 'both': return `Both sides are below standard. Start with quality — pushing volume now multiplies the rework. ${x.repeats>=3?`${x.repeats} repeat errors say earlier feedback has not landed, so change how it is delivered, not just how often.`:'Review the last five defects with them individually before setting a volume goal.'}`;
    case 'vol':  return `Hitting ${fmtPct(x.attain)} of target but scoring ${fmtPct(x.score)}. This is usually pace, not knowledge — the claims are moving and a share of them will come back. Slow the queue slightly and re-audit in two weeks.`;
    case 'qual': return `Accurate at ${fmtPct(x.score)} but only ${fmtPct(x.attain)} of target${x.days?` across ${x.days} day(s)`:''}. Check queue allocation and days worked before treating it as performance — a careful biller starved of volume looks identical to a slow one.`;
    case 'noqa': return `${x.claims} claim(s) produced with no audit at all. Quality here is unknown, not good — allocate coverage before the next cycle closes.`;
    case 'noprod': return `Audited ${x.audits} time(s) but absent from the production sheet. Either the name differs between sheets or their volume is not being captured — worth reconciling.`;
    default: return `Meeting both marks${x.repeats?` — though ${x.repeats} repeat error(s) are worth a look before they become a trend.`:'. Use as a shadowing pair for the names above.'}`;
  }
}

function combinedByProject(){
  const qa = scopeQA(), pr = scopeProd();
  const keys=[...new Set([...qa.map(r=>r.project), ...pr.map(p=>p.project)].filter(Boolean))];
  return keys.map(k=>{
    const rs = qa.filter(r=>r.project===k);
    const ps = pr.filter(p=>p.project===k);
    const claims = ps.reduce((s,p)=>s+p.count,0);
    const target = ps.reduce((s,p)=>s+targetForRow(p),0);
    const errs = rs.reduce((s,r)=>s+r.errors.length,0);
    const cat = (()=>{ const m=new Map();
      rs.forEach(r=>r.errors.forEach(e=>m.set(e.cat,(m.get(e.cat)||0)+1)));
      const t=[...m.entries()].sort((a,b)=>b[1]-a[1])[0];
      return t? {cat:t[0], n:t[1]} : null; })();
    const rwRows = rs.filter(r=>rwYes(r.reworkNeeded));
    return {project:k, audits:rs.length, score: rs.length? avgScore(rs):null, errors:errs,
      claims, target, attain: target>0? pct(claims,target):null,
      sampling: claims>0? pct(rs.length, claims):null,
      billers: new Set([...rs.map(r=>r.nameKey), ...ps.map(p=>p.nameKey)]).size,
      topCat: cat,
      reworkOpen: rwRows.filter(r=>rwNo(r.reworkComplete)).length,
      reworkClosure: rwRows.length? pct(rwRows.filter(r=>rwYes(r.reworkComplete)).length, rwRows.length):null};
  }).sort((a,b)=>b.claims-a.claims);
}

// One row per biller, with their claim-level detail behind a dropdown.
/* ==================== NOTE FORENSICS ====================
   Everything here reads the note text against the row it is attached to.
   Built from the real sheets: the Claim ID column is often empty and the
   payer's claim number lives inside the note, so that is where we look.
   ======================================================== */

// exact match: case, spacing and punctuation ignored, digits KEPT
function noteExactKey(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
// skeleton: every number and date replaced, so a template with updated
// figures still matches its siblings
function noteSkeletonKey(t){
  return noteExactKey(t).replace(/\b[a-z]?\d[a-z0-9]*\b/g,' # ').replace(/\s+/g,' ').trim();
}
// payer claim numbers written in the note — "claim#Z167TXE45321", "claim # 26237X017202"

// A claim-id cell is often a placeholder rather than blank — "-", "n/a", "0".
// Taken literally every row shares one id and the whole sheet counts as one
// claim, which is how Impacted Claims came to read 1 for every biller.
function realClaimId(v){
  const t=String(v??'').trim();
  if(!t) return '';
  if(/^[-–—.\s]*$/.test(t)) return '';
  if(/^(n\/?a|na|nil|none|null|blank|0+)$/i.test(t)) return '';
  return t.toUpperCase();
}
function claimNosIn(t){
  const out=new Set();
  // the # (or "no."/"number") is REQUIRED — without it "claim received on…"
  // captures the word "received" as an identifier
  const re=/claim\s*(?:#|no\.?|number)\s*[:\-]?\s*([A-Za-z0-9]{8,})/gi;
  let m;
  while((m=re.exec(String(t||'')))){
    const v=m[1].toUpperCase();
    if(/\d/.test(v)) out.add(v);         // an identifier must contain a digit
  }
  return [...out];
}
// call reference — "call ref# I-196454320", "callref#i-196207703"
function callRefsIn(t){
  const out=new Set();
  // NCCI and payer-guidance citations are stripped first. An article, LCD or
  // section number repeated across claims is a shared source of truth, not one
  // phone call covering them all.
  t = String(t||'').replace(
    /(publication|section|article|chapter|manual|\bLCD\b|\bNCD\b|\bNCCI\b|policy)\s*(id|no|number)?\s*[:#]?\s*[A-Z]?[\d.]+/ig, ' ');
  const re=/call\s*ref\s*#?\s*[:\-]?\s*([iI][\s\-]?[0-9][0-9\-]{5,}|\d[\d\-]{5,})/gi;
  let m; while((m=re.exec(String(t||'')))){
    const digits=m[1].replace(/[^0-9]/g,'');
    if(digits.length>=6) out.add(digits);
  }
  return [...out];
}
// the DOS the biller typed into the note
// the same written date read day-first, so an ambiguous note is not called wrong
function noteDOSAlt(t){
  const m=String(t||'').match(/\bd\.?o\.?s\.?\s*[:\-]?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  if(!m) return '';
  const dd=+m[1], mm=+m[2], yy=+m[3];
  if(mm<1||mm>12||dd<1||dd>31) return '';
  return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}
function noteDOS(t){
  const m=String(t||'').match(/\bd\.?o\.?s\.?\s*[:\-]?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
  if(!m) return '';
  const mm=+m[1], dd=+m[2], yy=+m[3];
  if(mm<1||mm>12||dd<1||dd>31) return '';
  return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

// One pass over the scoped rows, producing every note signal at once.
function noteForensics(det){
  const SAAG_OK = det.some(r=>{ const g=saagOf(r); return !!(g.action||g.status); });
  const exact=new Map(), skel=new Map(), claimNo=new Map(), callRef=new Map();
  const add=(map,k,r)=>{ if(!k) return; if(!map.has(k)) map.set(k,[]); map.get(k).push(r); };
  det.forEach(r=>{
    const t=r.note||'';
    if(noteExactKey(t).length>12){
      add(exact, noteExactKey(t), r);
      add(skel,  noteSkeletonKey(t), r);
    }
    // One identifier only: the Unique ID column. Mixing sources meant the same
    // claim could key on a Uni in one row and a Claim ID in another, and the
    // two would never be matched to each other.
    const uid = realClaimId(r.uid);
    const ids = uid ? [uid] : [];
    r._claimNos = ids;
    ids.forEach(c=>add(claimNo, c, r));
    r._callRefs = callRefsIn(t);
    r._callRefs.forEach(c=>add(callRef, c, r));
    // note DOS against the row's own date
    const nd=noteDOS(t);
    r._noteDOS = nd;
    // A note reading 06/05/2025 against a sheet date of 6 May is the same day
    // written day-first. Only flag where no reading of the note date matches.
    r._dosMismatch = (()=>{
      if(!nd || !r.dosKey) return false;
      if(nd === r.dosKey) return false;
      const alt = noteDOSAlt(r.note);          // the day-first reading
      if(alt && alt === r.dosKey) return false;
      return true;
    })();
  });
  det.forEach(r=>{
    const ex = exact.get(noteExactKey(r.note||''));
    const sk = skel.get(noteSkeletonKey(r.note||''));
    // An identical note only means a paste if the note carries something
    // per-claim that should have changed. SOP wording with no claim number or
    // date in it is identical because there is nothing to update, not because
    // anyone copied — that belongs under reused wording.
    // the identifier must be written in the NOTE — the Claim ID column is on
    // every row regardless, so using it would defeat the test
    r._misspelled = misspellingsIn(r.note);
    // the note says the details came from a call, but no reference was recorded,
    // so nothing about that call can be verified afterwards
    // only where the note says a call was placed to the payer or insurance —
    // a portal check, an EOB read or a coding query is not a call and must not
    // be asked for a call reference
    const t2=r.note||'';
    const calledPayer =
      /call(ed|ing)?\s*(@|at)?\s*(the\s+)?(insurance|payer|carrier|medicare|medicaid|bcbs|uhc|aetna|cigna|humana)/i.test(t2) ||
      /(called|calling)\s*@?\s*[\(\d]/.test(t2) ||
      /spoke\s+(to|with)\s+\w|s\/w\s+\w/i.test(t2) ||
      /rep\s+(said|stated|confirmed|advised|informed)|as\s+per\s+(the\s+)?rep\b|per\s+(the\s+)?rep\b/i.test(t2) ||
      /called\s+(and|to)\b/i.test(t2);
    // A call is evidenced by a call reference OR a case, ticket or service
    // request number — payers hand out either. What does not count is a
    // publication, section, article, chapter, LCD, NCD or policy number: those
    // cite NCCI or payer guidance, they are a source of truth for the decision,
    // not proof that a call took place.
    const SOT = /(publication|section|article|chapter|manual|\bLCD\b|\bNCD\b|\bNCCI\b|policy)\s*(id|no|number)?\s*[:#]?\s*[A-Z]?[\d.]+/ig;
    const t3 = t2.replace(SOT, ' ');   // strip guidance citations before looking
    const hasCaseNo = /(case|ticket|incident|service\s*request|\bSR\b|interaction)\s*(id|no|number)?\s*[:#]?\s*[A-Za-z0-9-]{4,}/i.test(t3);
    const saidCall = calledPayer;
    r._callNoRef = saidCall && (r._callRefs||[]).length===0 && !hasCaseNo;
    // the note should carry the claim number it is about, so it stands on its own
    r._noClaimNo = claimNosIn(r.note||'').length===0;
    const hasOwnId = claimNosIn(r.note||'').length>0 || !!r._noteDOS;
    r._exactCopy   = !!(ex && ex.length>1) && hasOwnId;
    r._reusedWord  = false;   // criterion withdrawn — template use is not a fault
    // a claim worked twice is only repeat work when nothing moved — if the
    // action changed on the later touch the claim progressed, same rule the
    // touch count uses
    // without the Action column there is no way to tell a repeat from a claim
    // that moved on, so the check does not run rather than guess
    r._repeatClaim = SAAG_OK && r._claimNos.some(c=>{
      const v=claimNo.get(c)||[];
      if(v.length<2) return false;
      return new Set(v.map(x=>claimAction(x))).size===1;
    });
    r._repeatRef   = r._callRefs.some(c=>(callRef.get(c)||[]).length>1);
    // A claim can trip several checks at once. For counting it is placed in one
    // column only, most serious first, so the columns add up to the flagged
    // total instead of overlapping. Every flag is still shown on the row.
    r._cat = r._dosMismatch ? 'dos'
           : r._exactCopy   ? 'exact'
           : r._repeatClaim ? 'claim'
           : r._repeatRef   ? 'ref'
           : '';
  });
  return {exact, skel, claimNo, callRef};
}

document.addEventListener('click', e=>{
  const t=e.target.closest('.nc-toggle');
  if(t && !e.target.closest('.csv-btn')){
    const id=t.dataset.nc;
    const kids=document.querySelectorAll(`.nc-row[data-nc="${id}"]`);

    const car=document.querySelector(`.aud-caret[data-nccaret="${id}"]`);
    if(car) car.innerHTML = open ? '&#9662;' : '&#9656;';

  }

// every claim for one biller, not just the 25 on screen
function exportBillerClaims(nameKey){
  const det=scopePDetail();
  noteForensics(det);
  const all=det.filter(r=>r.nameKey===nameKey);
  const flagged=all.filter(r=>r._repeatClaim||r._exactCopy||r._repeatRef||r._dosMismatch
                          ||r._noClaimNo||r._callNoRef||(r._misspelled||[]).length);
  if(!all.length){ toast('No claims found for that biller in this range.', true); return; }
  if(!flagged.length){ toast(`Nothing flagged for ${all[0].name} — no file to download.`); return; }
  // A repeat-claim finding cannot be checked from one row. Pull in the other
  // touches of the same claim, whoever worked them, and mark which is which.
  const own=new Set(flagged);
  const extra=[];
  flagged.filter(r=>r._repeatClaim).forEach(r=>{
    (r._claimNos||[]).forEach(id=>{
      det.forEach(o=>{
        if(o!==r && !own.has(o) && (o._claimNos||[]).includes(id)){ own.add(o); extra.push(o); }
      });
    });
  });
  const rs=[...flagged, ...extra].sort((a,b)=>
    String((a._claimNos||[])[0]||'').localeCompare(String((b._claimNos||[])[0]||'')) ||
    String(a.dateKey||'').localeCompare(String(b.dateKey||'')));
  const q=v=>{const s2=String(v??''); return /[",\n]/.test(s2)?'"'+s2.replace(/"/g,'""')+'"':s2;};
  const cols = PROD_HEADERS.length ? PROD_HEADERS
    : ['Claim ID','Agent Name','Unique ID','Date Worked','DOS','Payer','Practice','Mode','Balance','Comment'];
  const CATNAME={dos:'DOS mismatch',exact:'Exact copy',claim:'Repeat claim #',
                 ref:'Repeat call ref'};
  const head=[...cols,'Row','Findings','Finding Detail','Counted Under','Findings On Claim'];
  const lines=[head.map(q).join(',')];
  rs.forEach(r=>{
    const mine = r.nameKey===nameKey && flagged.includes(r);
    const f=[];
    if(mine){
      if(r._dosMismatch)  f.push(['DOS mismatch','the date of service in the note does not match the row on any reading']);
      if(r._exactCopy)    f.push(['Exact copy','identical to another claim note, numbers included']);
      if(r._repeatClaim)  f.push(['Repeat claim #','worked more than once with no change in action']);
      if(r._repeatRef)    f.push(['Repeat call ref',`reference ${(r._callRefs||[]).join(' ')} cited on other claims`]);
      if(r._noClaimNo)    f.push(['No claim # in note','the note does not record the claim number it refers to']);
      if(r._callNoRef)    f.push(['No call reference','a call to the payer is stated but no reference number was recorded']);
      (r._misspelled||[]).forEach(w=>f.push(['Spelling',`${w} -> ${MISSPELLINGS[w]||''}`]));
    }
    lines.push([
      ...cols.map(c=>rawCell(rawOf(r)[c])),
      mine ? 'Finding' : `Other touch of the same claim — worked by ${r.name}`,
      f.map(x=>x[0]).join(' | '),
      f.map((x,k)=>`${k+1}. ${x[1]}`).join(' '),
      mine ? (CATNAME[r._cat]||'') : '', mine ? f.length : ''
    ].map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`note-check-${slugify(all[0].name)}-${(DATE_TO||new Date().toISOString().slice(0,10))}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${new Set(rs.map(r=>(r._claimNos&&r._claimNos[0])||r.uid)).size} claim(s) · ${lines.length-1} row(s) exported for ${all[0].name}` +
        (extra.length? ` — includes ${extra.length} matching touch(es) for context.` : '.'));
}
function slugify(s2){ return String(s2||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

/* ==================== TOUCH COUNT ==================== */
// How often a claim came back inside the selected range. Matched on the claim
// number — the Claim ID column when filled, otherwise the number written in
// the note, the same rule Repeat Claim # uses.
// Words the team actually mistypes. A curated list rather than a dictionary,
// because a generic spellchecker flags every payer name and rep name.
const MISSPELLINGS = {
 'analasys':'analysis','analysys':'analysis','anaylsis':'analysis','analsys':'analysis',
 'caling':'calling','callig':'calling','poratl':'portal','protal':'portal',
 'recieved':'received','recived':'received','recieve':'receive','recieving':'receiving',
 'eligiblity':'eligibility','eligibilty':'eligibility','elgibility':'eligibility',
 'insurence':'insurance','insuarance':'insurance','insurnace':'insurance','insurace':'insurance',
 'refrence':'reference','referance':'reference','refernce':'reference',
 'autorization':'authorization','authorizaton':'authorization','authrization':'authorization',
 'deductable':'deductible','seperate':'separate','seperately':'separately',
 'becuase':'because','becasue':'because',
 'submited':'submitted','submmited':'submitted','resubmited':'resubmitted',
 'verfied':'verified','veified':'verified','verifed':'verified',
 'patinet':'patient','pateint':'patient','patiant':'patient',
 'procedue':'procedure','prcedure':'procedure','procedre':'procedure',
 'neccessary':'necessary','necesary':'necessary','infomation':'information','informaton':'information',
 'apeal':'appeal','apealed':'appealed','denide':'denied','denyed':'denied',
 'provoder':'provider','provieder':'provider','coverge':'coverage','covrage':'coverage',
 'inqueiry':'inquiry','inquiris':'inquiries','aknowledge':'acknowledge',
 'folowup':'followup','shedule':'schedule','sheduled':'scheduled',
 'statting':'stating','staing':'stating','requred':'required','requird':'required','requiered':'required',
 'diagnosys':'diagnosis','diagnosos':'diagnosis','modifer':'modifier','modfier':'modifier',
 'billling':'billing','biling':'billing','clain':'claim','cliam':'claim',
 'perfomed':'performed','perormed':'performed','adjustmet':'adjustment','adjusment':'adjustment',
 'scrubb':'scrub','srub':'scrub','payar':'payer','payeer':'payer',
 'hance':'hence','wich':'which','whcih':'which','furthur':'further','futher':'further'
};
function misspellingsIn(t){
  const out=[];
  (String(t||'').toLowerCase().match(/[a-z]{3,}/g)||[]).forEach(w=>{
    if(MISSPELLINGS[w]) out.push(w);
  });
  return out;
}
// The same value typed several ways fragments every count made from it, so
// case and punctuation are folded away to find the variants.
function variantKey(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function fieldVariants(det, field){
  const g=new Map();
  det.forEach(r=>{
    const v=String(r[field]||'').trim();
    if(!v) return;
    const k=variantKey(v);
    if(!g.has(k)) g.set(k,new Map());
    const m=g.get(k);
    m.set(v,(m.get(v)||0)+1);
  });
  const out=[];
  g.forEach(m=>{
    if(m.size<2) return;
    const forms=[...m.entries()].sort((a,b)=>b[1]-a[1]);
    out.push({main:forms[0][0], forms, rows:forms.reduce((s,f)=>s+f[1],0)});
  });
  return out.sort((a,b)=>b.rows-a.rows);
}

/* ==================== AGING x ACTION ==================== */
// What the biller did, read from the note. Level one of the taxonomy.
// Kept only for the AR workflow matching, which reads the note by design.
function claimActionFromNote(t){
  const H=p=>new RegExp(p,'i').test(t||'');
  const acted = H('drop(ping|ped)?\\s+the\\s+claim|hence\\s+dropped|claim\\s+(is\\s+)?dropped|checked\\s+mark|updated\\s+the\\s+correct|corrected\\s+and\\s+(billed|dropped)');
  if(H('re-?submit|corrected\\s+claim|re-?bill|refil') || acted) return 'Corrected & resubmitted';
  if(H('\\bappeal')) return 'Appeal filed';
  if(H('patient\\s+insurance\\s+review|miscnoshow|patient\\s+resp|self\\s*-?\\s*pay|copay|coinsur|deductible')) return 'Pending with patient';
  if(H('practice\\s+assist|client\\s+assist|need\\s+practice|need\\s+client|coding\\s+assist|requires?\\s+coding\\s+review|not\\s+billable|excludes1|cannot\\s+be\\s+billed\\s+with|\\bmodifier\\b')) return 'Pending with client';
  if(H('in\\s+process|under\\s+process|pending\\s+with\\s+(payer|insurance)|awaiting')) return 'Pending with payer';
  if(H('\\bpaid\\b|payment\\s+posted')) return 'Paid / closed';
  if(H('follow\\s*-?\\s*up|revisit|will\\s+check')) return 'Follow up';
  return 'Action not identified';
}
const AGE_BUCKETS=[['0–30',0,30],['31–60',31,60],['61–90',61,90],['91–120',91,120],
                   ['121–180',121,180],['181–365',181,365],['365+',366,1e9]];
function ageBucketOf(days){
  if(days<0) return 'Future DOS';
  for(const [l,lo,hi] of AGE_BUCKETS) if(days>=lo && days<=hi) return l;
  return '365+';
}
// Level 2 of the taxonomy — the reason behind the action, taken from the note:
// the denial reason, the rejection reason, or paid.
function claimReasonFromNote(t){
  const H=p=>new RegExp(p,'i').test(t||'');
  if(H('not\\s+billable'))                                    return 'Procedure not billable';
  if(H('excludes1|cannot\\s+be\\s+billed\\s+with|component\\s+of\\s+procedure')) return 'Diagnosis / CPT conflict';
  if(H('\\bmodifier\\b'))                                      return 'Modifier required';
  if(H('requires?\\s+coding\\s+review|coding\\s+review|need\\s+coding')) return 'CPT needs coding review';
  if(H('assignment\\s+of\\s+benefit|release\\s+of\\s+information|\\bAOB\\b|\\bROI\\b')) return 'AOB / ROI flag not checked';
  if(H('invalid\\s+insurance\\s+id|incorrect\\s+(insurance\\s+)?package|wrong\\s+package')) return 'Invalid insurance ID / package';
  if(H('ineligible|not\\s+eligible|policy\\s+(in)?active|termed|coverage\\s+(ended|term)')) return 'Policy inactive / ineligible';
  if(H('member\\s+is\\s+eligible|package\\s+is\\s+correct|eligibility.*correct')) return 'Eligibility verified';
  if(H('patient\\s+insurance\\s+review|miscnoshow'))           return 'Patient insurance review';
  if(H('duplicate'))                                          return 'Denied — duplicate';
  if(H('not\\s+covered|non\\s*-?\\s*covered'))                 return 'Denied — not covered';
  if(H('authoriz|\\bauth\\b|precert'))                         return 'Authorization required';
  if(H('medical\\s+record|records?\\s+(sent|requested|required)')) return 'Medical records required';
  if(H('timely\\s+filing|\\btfl\\b'))                          return 'Timely filing';
  if(H('credential'))                                         return 'Credentialing';
  if(H('\\bdenied\\b|denial'))                                 return 'Denied — other';
  if(H('\\bpaid\\b|payment\\s+posted'))                        return 'Paid';
  return 'Not stated';
}

/* ==================== AR REVIEW ====================
   The 56 Purview AR denial workflows, compiled into detection wording,
   requirement lists and valid endpoints. Checks whether the note RECORDS
   what the workflow asks for — never whether the underlying work was right,
   since the app cannot see Athena or the payer portal. */
// what a change must have come from, by what was changed
const CHANGE_SOURCES=[
 {what:'Diagnosis / DX', find:'(updated|corrected|changed|added|revised)[^.]{0,40}\\b(dx|diagnosis|icd)',
  src:'coding|provider documentation|op(erative)? note|medical record|as per practice|practice (update|confirmed)|chart'},
 {what:'CPT / procedure', find:'(updated|corrected|changed|added|revised)[^.]{0,40}\\b(cpt|procedure code|hcpcs)',
  src:'coding|provider documentation|op(erative)? note|medical record|as per practice|chart'},
 {what:'Modifier', find:'(updated|corrected|changed|added|revised)[^.]{0,40}\\bmodifier',
  src:'coding|NCCI|guideline|as per practice|rep (said|stated|confirmed|advised)|policy'},
 {what:'Member / insurance ID', find:'(updated|corrected|changed)[^.]{0,50}\\b(member id|subscriber id|insurance id|policy (id|number))',
  src:'portal|availity|salesforce|rep (said|stated|confirmed|advised)|call ref|eligibility|patient'},
 {what:'Insurance package', find:'(updated|corrected|changed)[^.]{0,50}\\b(package|insurance)',
  src:'salesforce|portal|eligibility|rep (said|stated|confirmed|advised)|call ref|as per practice'},
 {what:'Authorization / referral', find:'(updated|corrected|changed|added)[^.]{0,40}\\b(auth|authoriz|referral)',
  src:'rep (said|stated|confirmed|advised)|call ref|portal|as per practice|practice (update|confirmed)'},
 {what:'Place of service', find:'(updated|corrected|changed)[^.]{0,40}\\b(pos|place of service)',
  src:'as per practice|practice (update|confirmed)|provider|schedule|chart'},
 {what:'Patient demographics', find:'(updated|corrected|changed)[^.]{0,50}\\b(name|dob|date of birth|gender|address)',
  src:'registration|athena|\\bPMS\\b|\\bEHR\\b|patient|portal|eligibility'},
 {what:'Primary payer / COB', find:'(updated|corrected|changed|added)[^.]{0,50}\\b(primary|cob|coordination)',
  src:'rep (said|stated|confirmed|advised)|call ref|portal|\\bEOB\\b|patient|eligibility'}
];
function arReviewRows(det){
  const out=[];
  det.forEach(r=>{
    const t=r.note||'';
    if(!t) return;
    const act=claimActionFromNote(t);
    // a scrub-hold claim never reached a payer, so no AR workflow applies
    const preBill=/scrub hold|never billed|not billed|created but never/i.test(t) && act==='Pending with client';
    // The note must actually describe a denial or rejection before a denial
    // workflow is applied. Without this a word appearing in passing — "claim
    // TFL is 365 days" inside a recoupment note — is measured against the
    // wrong workflow and every requirement then reads as missing.
    const isDenial=/denied|denial|reject(ed|ion)|not covered|non-? ?covered|returned|unprocessed|CO-? ?\d|PR-? ?\d|OA-? ?\d/i.test(t);
    let hits=AR_WORKFLOWS.rules.filter(w=>new RegExp(w.d,'i').test(t));
    if(!isDenial){
      // outside a denial only the payment and processing workflows make sense
      hits=hits.filter(w=>w.s==='payments'||w.s==='processing');
    }
    if(!hits.length){ out.push({r, preBill, scen:null, miss:[], chg:[]}); return; }
    const w=hits.sort((a,b)=>b.d.length-a.d.length)[0];
    // every requirement the workflow lists must appear in the note
    const miss=(w.r||[]).filter(q=>{
      const pat=AR_WORKFLOWS.evid[q.e];
      return pat && !new RegExp(pat,'i').test(t);
    }).map(q=>q.t.replace(/[.,;:]+$/,'').trim());
    const chg=CHANGE_SOURCES.filter(c=>new RegExp(c.find,'i').test(t) && !new RegExp(c.src,'i').test(t))
      .map(c=>c.what);
    out.push({r, preBill, scen:w, miss, chg});
  });
  return out;
}

  {k:'repClaim', label:'Same claim worked twice, no change in action',
   how:'Both rows are in the CSV, side by side', test:r=>r._repeatClaim},
  {k:'repRef', label:'Same call reference across claims',
   how:'Open the claims citing it — one call cannot cover them all', test:r=>r._repeatRef},
  {k:'dos', label:'DOS in note contradicts the row',
   how:'Compare the two dates — they differ on any reading', test:r=>r._dosMismatch}

function auditCompareRows(){
  const det=scopePDetail();
  if(!det.length) return null;
  noteForensics(det);
  // The findings come from the production sheet and stand on their own. A QA
  // sheet is optional — it only adds what the auditor said about the same claim.
  const audBy=new Map();
  scopeQA().forEach(a=>{ const id=String(a.claimId||'').trim();
    if(id && !audBy.has(id)) audBy.set(id,a); });
  const rows=[];
  det.forEach(p=>{
    const firm=FIRM.filter(f=>f.test(p));
    if(!firm.length) return;
    const id=String((p._claimNos&&p._claimNos[0])||realClaimId(p.claimId)||'').trim();
    const a=id? audBy.get(id) : null;
    rows.push({p, id, firm, a,
      audited: !!a,
      audErr: !!(a && a.errors.length),
      audCats: a? a.errors.map(e=>e.cat).join(', ') : ''});
  });
  const hasQA = scopeQA().length>0;
  const matched = rows.filter(r=>r.audited).length;
  // claims the auditor flagged where these checks found nothing
  const audOnly=[];
  if(hasQA){
    const flagged=new Set(rows.map(r=>r.id));
    scopeQA().forEach(a=>{
      if(!a.errors.length) return;
      const id=String(a.claimId||'').trim();
      if(id && !flagged.has(id)) audOnly.push(a);
    });
  }
  // how much AR Review is holding back, and why
  const notes=det.filter(r=>r.note && r.note.trim());
  let coded=0, manyHit=0, noHit=0;
  notes.forEach(r=>{
    if(/\b(CO|PR|OA|PI)[- ]?\d{1,3}\b/i.test(r.note)) coded++;
    const h=AR_WORKFLOWS.rules.filter(x=>new RegExp(x.d,'i').test(r.note));
    if(!h.length) noHit++; else if(h.length>1) manyHit++;
  });
  const ar=arReviewRows(notes);
  let held=0;
  ar.forEach(x=>{ if(x.scen && !x.preBill) held += x.miss.length + x.chg.length; });
  return {rows, hasQA, matched, audOnly, held, coded, manyHit, noHit, notes:notes.length, total:det.length};
}

function exportAuditCompare(which){
  const R=auditCompareRows();
  if(!R){ toast('Nothing to export.'); return; }
  let rows=R.rows;
  if(which && which!=='__all__') rows=rows.filter(r=>r.firm.some(f=>f.k===which));
  if(!rows.length){ toast('Nothing to export here.'); return; }
  const q=v=>{const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const cols = PROD_HEADERS.length ? PROD_HEADERS
    : ['Claim ID','Agent Name','Unique ID','Date Worked','DOS','Payer','Practice','Mode','Balance','Comment'];
  // the auditor columns are always present, so the export shape does not change
  // from month to month — they read "no data" when no audit file was loaded
  const head=[...cols,'Claim Matched On','Finding','How To Confirm','Findings On Claim',
              'Audited','Auditor','Audit Date','Auditor Verdict','Auditor Error Category'];
  const lines=[head.map(q).join(',')];
  rows.forEach(r=>{
    const ND='no data';
    const row=[...cols.map(c=>rawCell(rawOf(r.p)[c])),
      'Unique ID', r.firm.map(f=>f.label).join(' | '), r.firm.map(f=>f.how).join(' | '), r.firm.length,
      R.hasQA? (r.audited?'Yes':'No') : ND,
      R.hasQA? (r.a? (r.a.auditorName||'') : '') : ND,
      R.hasQA? (r.a? (r.a.auditDate||'') : '') : ND,
      R.hasQA? (r.audited? (r.audErr?'Error':'No error') : '') : ND,
      R.hasQA? r.audCats : ND];
    lines.push(row.map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`note-findings-${slugify(which==='__all__'?'all':which)}-${(DATE_TO||new Date().toISOString().slice(0,10))}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${rows.length} claim(s) · ${lines.length-1} row(s) exported.`);
}

  const all=arReviewRows(det);
  const one = scenario && scenario!=='__all__';
  const inScope = all.filter(x=>x.scen && !x.preBill);
  const rows = one ? inScope.filter(x=>x.scen.n===scenario) : all;
  if(!rows.length){ toast('Nothing to export.'); return; }
  const q=v=>{const s2=String(v??''); return /[",\n]/.test(s2)?'"'+s2.replace(/"/g,'""')+'"':s2;};
  // The sheet's own columns pass through byte-for-byte, in their own order.
  // Nothing is reformatted — dates in particular must come out exactly as they
  // went in, since the sheet mixes day-first and month-first.
  const cols = PROD_HEADERS.length ? PROD_HEADERS
    : ['Claim ID','Agent Name','Unique ID','Date Worked','DOS','Payer','Practice','Mode','Balance','Comment'];
  const head=[...cols,'Scenario','Workflow Area','Workflow Page','Error Type','Error',
              'Error Description','Errors On Claim'];
  const lines=[head.map(q).join(',')];
  rows.forEach(x=>{
    const r=x.r, raw=rawOf(r);
    const errs=[
      ...x.miss.map(m=>({type:'Requirement not documented', err:m,
        desc:`The ${x.scen?x.scen.n:'workflow'} workflow requires ${m} to be established before acting. The note does not record it.`})),
      ...x.chg.map(c=>({type:'Change with no source', err:c+' changed',
        desc:`${c} was changed on this claim, but the note does not say where the corrected value came from.`}))
    ];
    lines.push([
      ...cols.map(c=>rawCell(raw[c])),
      x.scen? x.scen.n : (x.preBill? 'Pre-billing — not an AR denial' : 'No recognised denial'),
      x.scen? x.scen.s : '', x.scen? x.scen.f : '',
      errs.map(e=>e.type).filter((v,k,a)=>a.indexOf(v)===k).join(' | '),
      errs.map(e=>e.err).join(' | '),
      errs.map((e,k)=>`${k+1}. ${e.desc}`).join(' '),
      errs.length
    ].map(q).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=(DATE_TO||new Date().toISOString().slice(0,10));
  a.href=url;
  a.download = one ? `ar-${slugify(scenario)}-${stamp}.csv` : `ar-review-full-${stamp}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const withErr=rows.filter(x=>x.miss.length||x.chg.length).length;
  toast(`${rows.length} claim(s) · ${lines.length-1} row(s) exported${one?` for ${scenario}`:''} — ${withErr} with findings.`);
}

/* The action and sub-status are read out of free text. Where a report shows
   them, it says so — and names the two things that would make it unnecessary:
   the SAAG columns in the sheet, or a standardised note. The note disappears
   once those columns arrive, so it is a prompt rather than a permanent
   disclaimer. */
function saagColumnsPresent(){
  const det = scopePDetail();
  if(!det.length) return [];
  // Exact names only. "Bucket" on its own is the aging bucket, not the owner,
  // and matching it would wrongly suppress the warning.
  const want = [
    ['Status',                  ['status','claim status','current status']],
    ['Sub Status',              ['sub status','substatus','sub-status']],
    ['Action',                  ['action','action code','action taken']],
    ['Bucket / Responsibility', ['bucket / responsibility','bucket/responsibility','responsibility']]
  ];
  const raw = det.find(r=>r._raw && Object.keys(r._raw).length);
  if(!raw) return [];
  const keys = Object.keys(raw._raw).map(k=>String(k).trim().toLowerCase());
  return want.filter(([label,aliases]) =>
    aliases.some(a=>keys.includes(a))).map(x=>x[0]);
}
function derivedActionNote(what){
  const det = scopePDetail().filter(r=>r.note && r.note.trim());
  const have = saagColumnsPresent();
  const missing = ['Status','Sub Status','Action','Bucket / Responsibility'].filter(c=>!have.includes(c));
  if(!missing.length){
    // the sheet carries them, but this report is still reading the note
    return `<div class="data-note" style="border-left:2px solid var(--warn);">
      <b>Your sheet already carries Status, Sub Status, Action and Bucket / Responsibility</b> — but this section still
      works the action out by reading the note, so the two may disagree. Reading those columns directly is a change worth
      making; until then treat this as inferred rather than as your own data.</div>`;
  }
  let none=0, many=0;
  det.forEach(r=>{
    const h = (typeof AR_WORKFLOWS!=='undefined')
      ? AR_WORKFLOWS.rules.filter(x=>new RegExp(x.d,'i').test(r.note)) : [];
    if(!h.length) none++; else if(h.length>1) many++;
  });
  const cols = missing.map(c=>`<b>${c}</b>`).join(', ');
  return `<div class="data-note" style="border-left:2px solid var(--bad);">
    <b>${what} here ${/and/.test(what)?'are':'is'} worked out by reading the note, not taken from your sheet.</b>
    The production file carries no ${cols} column${missing.length>1?'s':''}, and the notes follow no fixed format — so what
    you see below is inferred from free text and will not always be right.${det.length? `
    <span style="color:var(--text-faint);">${none} of ${det.length} notes match no known pattern; ${many} match more than one.</span>`:''}<br>
    <b>Either of two things would fix it.</b> Export the ${missing.length===3?'SAAG':'missing'} column${missing.length>1?'s':''}
    with the production sheet and ${missing.length>1?'they':'it'} would be read directly. Or standardise the note — denial
    code, action and next owner in fixed fields — and the reading becomes reliable.
    <span style="color:var(--text-faint);">Until then, treat this as a guide to where to look, not as a count you would quote.</span>
  </div>`;
}

// The action and sub-status come from the sheet, never from the note. If the
// SAAG columns are absent or empty the report says so instead of guessing —
// a guess read off free text is not something to put beside a biller's name.
function saagField(r, names){
  const raw = r && r._raw;
  if(!raw) return '';
  for(const n of names){
    for(const k of Object.keys(raw)){
      if(String(k).trim().toLowerCase()===n){
        const v=String(raw[k]??'').replace(/\u00a0/g,' ').trim();
        if(v && !/^[-–—.\s]*$/.test(v) && !/^(n\/?a|na|nil|none|null)$/i.test(v)) return v;
      }
    }
  }
  return '';
}
function saagOf(r){
  return {
    status: saagField(r, ['status','claim status','current status']),
    sub:    saagField(r, ['sub status','substatus','sub-status']),
    action: saagField(r, ['action','action code','action taken']),
    bucket: saagField(r, ['bucket / responsibility','bucket/responsibility','responsibility'])
  };
}
// which of the four the loaded sheet actually carries data in
function saagCoverage(){
  const det=scopePDetail();
  const out={status:0, sub:0, action:0, bucket:0, rows:det.length};
  det.forEach(r=>{ const g=saagOf(r);
    if(g.status) out.status++; if(g.sub) out.sub++;
    if(g.action) out.action++; if(g.bucket) out.bucket++; });
  return out;
}
function saagMissingCard(title, what){
  const c=saagCoverage();
  const missing=[['Status',c.status],['Sub Status',c.sub],['Action',c.action],
                 ['Bucket / Responsibility',c.bucket]].filter(x=>x[1]===0).map(x=>x[0]);
  return `<div class="card needs-data"><h3>${esc(title)}</h3>
    <div class="card-sub">No data available in ${missing.join(', ')}.</div>
    <div class="nd-body">${what} is taken from those columns, not worked out from the note — a guess read off free text
      is not something to show beside a claim.
      <div class="nd-cols">Fill ${missing.length>1?'them':'it'} in the production export and this fills in.
        ${c.rows? `Checked ${c.rows} row(s): Status ${c.status}, Sub Status ${c.sub}, Action ${c.action},
        Bucket / Responsibility ${c.bucket}.`:''}</div></div></div>`;
}
function saagUsable(){
  const c=saagCoverage();
  return c.status>0 || c.action>0;
}

// The action and sub-status a report shows come from the sheet's own columns.
function claimAction(r){
  if(typeof r==='string') return '';            // a note alone cannot answer this
  const g=saagOf(r);
  return g.action || g.status || '(no action in the sheet)';
}
function claimReason(r){
  if(typeof r==='string') return '';
  const g=saagOf(r);
  // no invented sub-status: if the column is empty the row says so
  return g.sub || '(no sub status in the sheet)';
}

// Every touch of each matching claim, so the repeat can be seen rather than
// taken on trust — the sheet's own columns pass through untouched.
function exportTouchClaims(group, action, reason){
  const det=scopePDetail();
  noteForensics(det);
  const byClaim=new Map();
  det.forEach(r=>{ const id=(r._claimNos&&r._claimNos[0])||''; if(!id) return;
    if(!byClaim.has(id)) byClaim.set(id,[]); byClaim.get(id).push(r); });
  const picked=[];
  byClaim.forEach((v,id)=>{
    if(v.length<2) return;
    const seq=[...v].sort((x,y)=>String(x.dateKey||'').localeCompare(String(y.dateKey||'')));
    const acts=seq.map(r=>claimAction(r));
    const billers=[...new Set(seq.map(r=>r.name))];
    const grp = new Set(acts).size>1 ? 'moved' : (billers.length>1 ? 'dup' : 'own');
    if(grp!==group) return;
    if(action && acts[0]!==action) return;
    const rsn=claimReason(seq[0]);
    if(reason && rsn!==reason) return;
    seq.forEach((r,i)=>picked.push({r, id, i, of:seq.length, act:acts[0], rsn, billers}));
  });
  if(!picked.length){ toast('Nothing to export here.'); return; }
  const q=v=>{const s2=String(v??''); return /[",\n]/.test(s2)?'"'+s2.replace(/"/g,'""')+'"':s2;};
  const cols = PROD_HEADERS.length ? PROD_HEADERS
    : ['Claim ID','Agent Name','Unique ID','Date Worked','DOS','Payer','Practice','Mode','Balance','Comment'];
  const GN={dup:'Two billers, same step',own:'Same biller came back',moved:'Moved on — action changed'};
  const head=[...cols,'Group','Action','Sub-status','Touch','Of','Billers On This Claim'];
  const lines=[head.map(q).join(',')];
  picked.forEach(p2=>lines.push([
    ...cols.map(c=>rawCell(rawOf(p2.r)[c])),
    GN[group]||group, p2.act, p2.rsn, p2.i+1, p2.of, p2.billers.join(' | ')
  ].map(q).join(',')));
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const bit=[group, action, reason].filter(Boolean).join('-');
  a.href=url;
  a.download=`touch-${slugify(bit)}-${(DATE_TO||new Date().toISOString().slice(0,10))}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const claims=new Set(picked.map(p2=>p2.id)).size;
  toast(`${claims} claim(s) · ${lines.length-1} row(s) exported — every touch of each claim is included.`);
}

// Nothing can be matched without the Unique ID column, so the sections that

function uniqueIdCoverage(){
